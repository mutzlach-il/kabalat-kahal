-- מתג השבתה כללי — רק הבעלים
create table if not exists kk_system (id int primary key default 1 check (id=1), disabled boolean not null default false, message text, updated_at timestamptz default now());
insert into kk_system(id) values (1) on conflict (id) do nothing;

create or replace function kk_me() returns text language sql stable as $f$ select lower(coalesce(auth.jwt()->>'email','')) $f$;
create or replace function kk_owner() returns boolean language sql stable security definer set search_path=public as $f$ select exists(select 1 from kk_users where email=kk_me() and active and not blocked and role='owner') $f$;
create or replace function kk_sys_on() returns boolean language sql stable security definer set search_path=public as $f$ select not coalesce((select disabled from kk_system where id=1),false) $f$;
create or replace function kk_active() returns boolean language sql stable security definer set search_path=public as $f$ select kk_owner() or (kk_sys_on() and exists(select 1 from kk_users where email=kk_me() and active and not blocked)) $f$;
create or replace function kk_admin() returns boolean language sql stable security definer set search_path=public as $f$ select kk_owner() or (kk_sys_on() and exists(select 1 from kk_users where email=kk_me() and active and not blocked and role='admin')) $f$;
-- רישום שעת הכניסה האחרונה (המשתמש לא יכול לשנות לעצמו הרשאות)
create or replace function kk_touch(n text) returns void language sql security definer set search_path=public as $f$ update kk_users set last_login=now(), name=coalesce(nullif(name,''),n) where email=kk_me() and active and not blocked $f$;
create or replace function kk_can_edit() returns boolean language sql stable security definer set search_path=public as $f$ select kk_owner() or (kk_sys_on() and exists(select 1 from kk_users where email=kk_me() and active and not blocked and role<>'view')) $f$;
-- רק הבעלים משבית/מפעיל משתמשים, ואף אחד לא יכול לגעת בבעלים או למנות בעלים
create or replace function kk_users_guard() returns trigger language plpgsql set search_path=public as $f$
begin
  if current_user not in ('authenticated','anon') or kk_owner() then return coalesce(new,old); end if;
  if tg_op='DELETE' then if old.role='owner' then raise exception 'אין הרשאה'; end if; return old; end if;
  if new.role='owner' or new.blocked then raise exception 'רק הבעלים יכול לעשות זאת'; end if;
  if tg_op='UPDATE' and (old.role='owner' or old.blocked is distinct from new.blocked) then raise exception 'רק הבעלים יכול לעשות זאת'; end if;
  return new;
end $f$;
drop trigger if exists kk_users_guard on kk_users;

function peopleIndex(){const g={};R.forEach(r=>{const k=personKey(r);(g[k]=g[k]||[]).push(r)});
  return Object.entries(g).map(([k,v])=>{v.sort((a,b)=>(b.date||'').localeCompare(a.date||''));const x=personSummary(v).x;return {key:k,recs:v,x,
    hay:fold([fullName(x),x.prayName,x.spouseName,x.city,x.email,...v.map(r=>r.prayName)].join(' ')),ph:uniq(v.flatMap(r=>[normPhone(r.mobile),normPhone(r.homePhone),normPhone(r.workPhone)]))}})}
function matchPeople(q,limit=8){q=fold(q);if(!q)return[];const d=digits(q),words=q.split(' ').filter(Boolean);
  return peopleIndex().map(p=>{let s=0;if(d.length>=4&&p.ph.some(n=>n&&n.includes(d)))s+=d.length>=9?100:40;
    if(words.length&&words.every(w=>p.hay.includes(w)))s+=30+(fold(fullName(p.x)).startsWith(words[0])?10:0);return {p,s}})
    .filter(o=>o.s>0).sort((a,b)=>b.s-a.s||b.p.recs.length-a.p.recs.length).slice(0,limit).map(o=>o.p)}
function matchContacts(q,limit=5){q=fold(q);if(!q)return[];const d=digits(q);
  return (C||[]).filter(c=>(d.length>=4&&[c.phone,c.phone2].some(n=>normPhone(n).includes(d)))||fold([c.name,c.role,c.city,c.email,c.notes].join(' ')).includes(q)).slice(0,limit)}

/* ---------- חיפוש מהיר בראש המסך ---------- */
function initGlobalSearch(){const inp=$('#gq'),box=$('#gres');if(!inp||inp.dataset.on)return;inp.dataset.on='1';let sel=0,items=[];
  const draw=()=>{const q=inp.value.trim();if(q.length<2){box.hidden=true;items=[];return}
    const P=matchPeople(q,7),Cs=S.features.contacts?matchContacts(q,4):[];
    items=[...P.map(p=>({t:'p',p})),...Cs.map(c=>({t:'c',c}))];sel=Math.min(sel,Math.max(0,items.length-1));
    box.innerHTML=items.length?items.map((it,i)=>it.t==='p'?`<button type="button" class="gi ${i===sel?'on':''}" data-i="${i}"><b>${esc(fullName(it.p.x))}</b><span>${esc([it.p.x.prayName,it.p.x.city].filter(Boolean).join(' · '))}</span><span class="ltr">${esc(it.p.x.mobile||it.p.x.homePhone||'')}</span><i>${it.p.recs.length} ביקורים</i></button>`
      :`<button type="button" class="gi c ${i===sel?'on':''}" data-i="${i}"><b>${esc(it.c.name)}</b><span>איש קשר${it.c.role?' · '+esc(it.c.role):''}</span><span class="ltr">${esc(it.c.phone||'')}</span><i></i></button>`).join('')
      +(canEdit()?`<button type="button" class="gi new" data-new="1">+ בקשה חדשה בשם "${esc(q)}"</button>`:'')
      :`<div class="gi none">לא נמצא. ${canEdit()?`<button type="button" class="btn sm" data-new="1">+ בקשה חדשה</button>`:''}</div>`;
    box.hidden=false;
    $$('#gres [data-i]').forEach(b=>b.onmousedown=e=>{e.preventDefault();open(+b.dataset.i)});
    $$('#gres [data-new]').forEach(b=>b.onmousedown=e=>{e.preventDefault();const p={date:todayISO(),deceased:[],donation:{type:'none'},status:'wait',tags:[]};if(digits(q).length>=6)p.mobile=q;else{const w=q.split(/\s+/);p.first=w[0]||'';p.last=w.slice(1).join(' ')}pendingPre=p;close();go('new')})};
  const close=()=>{box.hidden=true;inp.value='';inp.blur()};
  const open=i=>{const it=items[i];if(!it)return;close();if(it.t==='p')openPerson(it.p.key);else{contactFocus=it.c.id;go('contacts')}};
  inp.oninput=()=>{sel=0;draw()};inp.onblur=()=>setTimeout(()=>box.hidden=true,150);inp.onfocus=draw;
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){sel=Math.min(sel+1,items.length-1);draw();e.preventDefault()}else if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault()}else if(e.key==='Enter'){e.preventDefault();open(sel)}else if(e.key==='Escape')close()};
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!e.target.matches('input,textarea,select,[contenteditable]')&&!$('#app').hidden){e.preventDefault();inp.focus()}})}

function bindReturning(rec,fillFrom){if(rec)return;const box=$('#dupMsg');if(!box)return;let t=null;
  const check=()=>{const v=id=>($('#'+id)?.value||'').trim();const ph=[v('mobile'),v('homePhone')].map(digits).find(d=>d.length>=7);const nm=[v('first'),v('last')].join(' ').trim();
    let m=ph?matchPeople(ph,3):[];if(!m.length&&nm.length>=4&&v('last'))m=matchPeople(nm,3);
    if(!m.length){box.hidden=true;return}box.hidden=false;
    box.innerHTML=`<div class="notice info"><b>נראה שהאדם הזה כבר ביקר:</b>${m.map((p,i)=>`<div class="row" style="margin-top:6px"><span><b>${esc(fullName(p.x))}</b> · <span class="ltr">${esc(p.x.mobile||p.x.homePhone||'')}</span> · ${p.recs.length} ביקורים · אחרון ${dual(p.recs[0].date)}</span><span class="spacer"></span><button type="button" class="btn sm gold" data-fill="${i}">זה הוא – מלא פרטים</button><button type="button" class="btn sm" data-card="${i}">כרטיס</button></div>`).join('')}</div>`;
    $$('#dupMsg [data-fill]').forEach(b=>b.onclick=()=>fillFrom(m[+b.dataset.fill]));$$('#dupMsg [data-card]').forEach(b=>b.onclick=()=>openPerson(m[+b.dataset.card].key))};
  ['first','last','mobile','homePhone'].forEach(id=>$('#'+id)?.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(check,350)}))}

function tplText(t,x,extra={}){const d=x?.donation||{};const map={'{שם}':fullName(x||{}),'{שם_פרטי}':x?.first||'','{משפחה}':x?.last||'','{כתובת}':x?.address||'','{עיר}':x?.city||'','{תאריך}':hebOf(new Date()),'{סכום}':d.amount?money(d.amount):'','{אופן}':DON[d.type]||'','{קבלה}':d.receipt||'','{חודשים}':d.months||'','{שם_לתפילה}':x?.prayName||'','{נפטר}':x?.deceased?.[0]?.name||'','{יום_זיכרון}':x?.deceased?.[0]?.date||'',...extra};
  return String(t||'').replace(/\{[^}]+\}/g,m=>map[m]??m)}
const MSG_TPL={free:['הודעה חופשית',`שלום {שם},\n\n\n\nבברכה,\nמרכז חסידי ביאלא בני ברק`],

const FIN_TPL=['thanks','receipt','standing','remind'];
function compose(to,x,tplKey){if(!S.features.messages)return toast('שליחת הודעות כבויה בניהול');const keys=Object.keys(MSG_TPL).filter(k=>!FIN_TPL.includes(k)||(FIN&&canFin()));tplKey=keys.includes(tplKey)?tplKey:'free';
  const ov=document.createElement('div');ov.className='modal';const body=k=>tplText(MSG_TPL[k][1]??(S.templates||{})[k]??DEF_TPL[k],x||{first:to.name});

    <div class="row" style="flex-wrap:wrap"><button class="btn primary" id="mMail">📧 פתח במייל</button>${S.emailjs?.service&&S.emailjs?.template&&S.emailjs?.key?'<button class="btn gold" id="mSend">📨 שלח ישירות מהמערכת</button>':''}
      <button class="btn" id="mWa">וואטסאפ</button><button class="btn" id="mSms">SMS</button><button class="btn" id="mCp">העתק</button></div><div id="mMsg" class="small muted"></div></div>`;

    <label class="f wide">הערות<textarea id="cno" style="min-height:56px">${esc(c.notes||'')}</textarea></label></div>
    <div class="row"><button class="btn primary">שמור</button>${edit?'<button type="button" class="btn danger" id="cdel">מחיקה</button><button type="button" class="btn" id="ccan">ביטול</button>':''}</div></form>`:'';
    if(!canEdit())return;$('#cf').onsubmit=async e=>{e.preventDefault();const o={...(edit||{id:newId(),createdAt:Date.now(),createdBy:ME}),name:$('#cn').value.trim(),role:$('#cr').value.trim(),phone:$('#cp').value.trim(),phone2:$('#cp2').value.trim(),email:fixEmail($('#ce').value),city:$('#cc').value.trim(),person:$('#cpe').value.trim(),notes:$('#cno').value.trim()};

const addMonths=(ymS,n)=>{const [y,m]=ymS.split('-').map(Number);const d=new Date(y,m-1+n,1);return ym(d)};
function standingInfo(r){const d=r.donation||{};if(d.type!=='standing')return null;const start=d.start||(r.date||'').slice(0,7)||ym(new Date());const n=Number(d.months)||0;const end=n?addMonths(start,n-1):'';const cur=ym(new Date());
  const left=end?((+end.slice(0,4))*12+(+end.slice(5,7)))-((+cur.slice(0,4))*12+(+cur.slice(5,7))):null;
  return {start,end,left,paid:Object.values(r.payments||{}).filter(v=>v===true).length,paidNow:r.payments?.[cur]===true,bounced:Object.entries(r.payments||{}).filter(([m,v])=>v==='x').map(([m])=>m),state:end&&left<0?'ended':end&&left<=1?'ending':'active'}}
let donorFilt='all';

  const list=all.filter(F[donorFilt][1]).sort((a,b)=>b.total-a.total);const yr=String(new Date().getFullYear());
  const yearSum=donRecs().filter(r=>r.donation.type!=='standing'&&(r.date||'').startsWith(yr)).reduce((s,r)=>s+(+r.donation.amount||0),0)+donRecs().filter(r=>r.donation.type==='standing').reduce((s,r)=>s+Object.entries(r.payments||{}).filter(([m,v])=>v===true&&m.startsWith(yr)).length*(+r.donation.amount||0),0);
  $('#main').innerHTML=`<section><div class="row"><h2>תורמים</h2><span class="spacer"></span>${canEdit()?'<button class="btn gold" id="dNew">💰 רישום תרומה</button>':''}<button class="btn" id="dPrint">הדפסה</button><button class="btn" id="dCsv">הורד לאקסל</button></div>
  <div class="stats"><div class="stat"><b>${all.length}</b><span>תורמים</span></div><div class="stat"><b>${money(all.reduce((s,d)=>s+d.monthly,0))||'₪0'}</b><span>הוראות קבע לחודש</span></div>

  <div class="chips" style="margin:10px 0">${Object.entries(F).map(([k,[t]])=>`<label><input type="radio" name="dfl" value="${k}" ${donorFilt===k?'checked':''}>${t} (${all.filter(F[k][1]).length})</label>`).join('')}</div>
  <div class="tablewrap"><table class="wide"><thead><tr><th>תורם</th><th>נייד</th><th>סה״כ נתרם</th><th>הוראת קבע</th><th>תרומה אחרונה</th><th>מצב</th><th></th></tr></thead><tbody>
  ${list.map(d=>`<tr><td><a href="#" data-p="${esc(d.key)}"><b>${esc(fullName(d.x))}</b></a><div class="small muted">${esc(d.x.city||'')}</div></td><td class="num"><span class="ltr">${esc(d.x.mobile||d.x.homePhone||'')}</span></td><td class="num">${money(d.total)||'₪0'}</td>
    <td>${d.st.map(o=>`<div class="small">${money(o.r.donation.amount)} לחודש · ${o.i.end?'עד '+HEB_GREG_M[+o.i.end.slice(5)-1]+' '+o.i.end.slice(0,4):'ללא הגבלה'} · נגבו ${o.i.paid}</div>`).join('')||'<span class="muted">—</span>'}</td><td>${dual(d.last)}</td>
    <td>${d.ending?'<span class="pill rev">מסתיימת בקרוב</span>':''}${d.ended?'<span class="pill">הסתיימה</span>':''}${d.unpaid?'<span class="pill wait">לא נגבה החודש</span>':''}</td>

  const doc=()=>`${docHead('רשימת תורמים – '+F[donorFilt][0])}<table><tr><th>תורם</th><th>טלפון</th><th>סה״כ</th><th>הוראת קבע לחודש</th><th>תרומה אחרונה</th></tr>${list.map(d=>`<tr><td>${esc(fullName(d.x))}</td><td>${esc(d.x.mobile||'')}</td><td>${money(d.total)}</td><td>${d.monthly?money(d.monthly):''}</td><td>${tdate(d.last)}</td></tr>`).join('')}</table>`;
  $('#dPrint').onclick=()=>saveDoc('תורמים',doc(),'print');
  $('#dCsv').onclick=()=>{const rows=[['שם','נייד','מייל','עיר','סה״כ נתרם','הוראת קבע לחודש','תרומה אחרונה','מסתיימת','לא נגבה החודש'],...list.map(d=>[fullName(d.x),d.x.mobile,d.x.email,d.x.city,d.total,d.monthly,d.last,d.ending?'כן':'',d.unpaid?'כן':''])];downloadBlob(`תורמים-${fileStamp()}.csv`,new Blob(['﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));log('הורדת תורמים לאקסל')}}

/* ---------- דוח חודשי ---------- */
function renderReport(){const m=$('#rm')?.value||ym(new Date());const list=R.filter(r=>(r.date||'').startsWith(m));
  const before=new Set(R.filter(r=>(r.date||'')<m+'-01').map(personKey));const newP=uniq(list.map(personKey)).filter(k=>!before.has(k));
  const cnt=(arr,f)=>{const o={};arr.forEach(x=>{const k=f(x);if(k)o[k]=(o[k]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1])};
  const tags=cnt(list.flatMap(r=>(r.tags||[]).length?r.tags:['בלי נושא']),t=>t),days=cnt(list,r=>r.date).slice(0,5),by=cnt(list,r=>(r.createdBy||'').replace(' (סריקה)','')),st=cnt(list,r=>STATUS[r.status]);
  const tid=R.filter(r=>(r.tiding?.date||'').startsWith(m));const don=donRecs().filter(r=>(r.date||'').startsWith(m)&&r.donation.type!=='standing');
  const coll=donRecs().filter(r=>r.donation.type==='standing'&&r.payments?.[m]===true);const finOk=FIN&&canFin()&&S.features.finance;
  const bars=a=>{const mx=Math.max(1,...a.map(x=>x[1]));return `<div class="bars">${a.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><i style="width:${v/mx*100}%"></i><span class="num">${v}</span></div>`).join('')||'<span class="muted">אין</span>'}</div>`};
  const [y,mo]=m.split('-').map(Number);const title=`דוח חודשי · ${HEB_GREG_M[mo-1]} ${y} (${hebOf(new Date(y,mo-1,1))} – ${hebOf(new Date(y,mo,0))})`;

  <p class="muted">${esc(title)}</p>
  <div class="stats"><div class="stat"><b>${list.length}</b><span>בקשות</span></div><div class="stat"><b>${uniq(list.map(personKey)).length}</b><span>אנשים</span></div><div class="stat"><b>${newP.length}</b><span>אנשים חדשים</span></div>
    <div class="stat"><b>${uniq(list.map(r=>r.date)).length}</b><span>ימי קבלת קהל</span></div><div class="stat"><b>${tid.length}</b><span>בשורות טובות</span></div>
    ${finOk?`<div class="stat"><b>${money(don.reduce((s,r)=>s+(+r.donation.amount||0),0))||'₪0'}</b><span>תרומות חד־פעמיות</span></div><div class="stat"><b>${money(coll.reduce((s,r)=>s+(+r.donation.amount||0),0))||'₪0'}</b><span>נגבה מהוראות קבע (${coll.length})</span></div>`:''}</div>
  <div class="cols"><div class="card"><h3>לפי נושא</h3>${bars(tags)}</div><div class="card"><h3>הימים העמוסים</h3>${bars(days.map(([d,v])=>[heb(d)||d,v]))}</div><div class="card"><h3>לפי סטטוס</h3>${bars(st)}</div><div class="card"><h3>מי קלט</h3>${bars(by)}</div></div></section>`;
  $('#rm').onchange=renderReport;
  const doc=()=>`${docHead(title)}<table><tr><td class="l">בקשות</td><td>${list.length}</td></tr><tr><td class="l">אנשים</td><td>${uniq(list.map(personKey)).length} (מהם חדשים: ${newP.length})</td></tr><tr><td class="l">ימי קבלת קהל</td><td>${uniq(list.map(r=>r.date)).length}</td></tr><tr><td class="l">בשורות טובות</td><td>${tid.length}</td></tr>
    ${finOk?`<tr><td class="l">תרומות חד־פעמיות</td><td>${money(don.reduce((s,r)=>s+(+r.donation.amount||0),0))||'₪0'}</td></tr><tr><td class="l">נגבה מהוראות קבע</td><td>${money(coll.reduce((s,r)=>s+(+r.donation.amount||0),0))||'₪0'}</td></tr>`:''}</table>
    <h2>לפי נושא</h2><table>${tags.map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${v}</td></tr>`).join('')}</table><h2>לפי סטטוס</h2><table>${st.map(([k,v])=>`<tr><td class="l">${esc(k)}</td><td>${v}</td></tr>`).join('')}</table>
    ${tid.length?`<h2>בשורות טובות</h2><table>${tid.map(r=>`<tr><td>${tdate(r.tiding.date)}</td><td>${esc(fullName(r))}</td><td>${esc(r.tiding.kind)}</td></tr>`).join('')}</table>`:''}<div class="foot">הופק ממערכת קבלת הקהל · ${hebOf(new Date())}</div>`;
  $('#rPrint').onclick=()=>saveDoc('דוח חודשי',doc(),'print');$('#rWord').onclick=()=>saveDoc('דוח חודשי',doc(),'word')}

/* ---------- גיבוי (מוצפן) וגיבוי שבועי אוטומטי ---------- */
function backupData(){return {system:'biala-kabalat-kahal',version:5,date:new Date().toISOString(),records:R,kupa:EXP,contacts:C,settings:{...S,pw:undefined,fin:undefined,adm:undefined,geminiKey:undefined,users:undefined,emailjs:undefined}}}
async function backupBlob(){const o=backupData();if(MODE==='cloud'&&DEK)return new Blob([JSON.stringify({system:'biala-kabalat-kahal',encrypted:true,date:o.date,data:await encStr(JSON.stringify(o))})],{type:'application/json'});return new Blob([JSON.stringify(o)],{type:'application/json'})}

const SCAN_MULTI=`\n\nחשוב: ייתכן שבתמונה יש כמה טפסים (למשל צילום של כמה דפים יחד). החזר JSON במבנה {"forms":[ ...טופס לכל דף... ]}. לכל טופס הוסף "box":[ymin,xmin,ymax,xmax] – מיקום הטופס בתמונה בסקאלה 0–1000. דף ריק בלי כתב יד – אל תכלול.`;
async function cropTo(file,box){const img=await createImageBitmap(file);if(!box||box.length!==4)return null;let [y0,x0,y1,x1]=box.map(Number);if(!(y1>y0&&x1>x0))return null;
  const W=img.width,H=img.height,pad=15;const sx=Math.max(0,(x0-pad)/1000*W),sy=Math.max(0,(y0-pad)/1000*H),sw=Math.min(W-sx,(x1-x0+2*pad)/1000*W),sh=Math.min(H-sy,(y1-y0+2*pad)/1000*H);
  const k=Math.min(1,1100/Math.max(sw,sh));const c=document.createElement('canvas');c.width=sw*k;c.height=sh*k;c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}
async function scanToRecords(file){if(!hasKey())throw {code:'no_key'};
  const {blob,url}=await shrink(file,2200,.85);let whole='';try{whole=(await shrink(file,1100,.6)).url}catch(e){whole=url}
  const res=await aiReadImage(blob,true);const forms=Array.isArray(res?.forms)?res.forms:Array.isArray(res)?res:[res];
  const out=[];for(const f of forms.filter(f=>f&&typeof f==='object')){if(!FIELDS.some(([k])=>String(f[k]||'').trim())&&!(f.deceased||[]).length)continue;
    let crop=null;if(forms.length>1){try{crop=await cropTo(file,f.box)}catch(e){}}
    const pre={date:f.date&&/^\d{4}-\d\d-\d\d$/.test(f.date)?f.date:todayISO(),deceased:(f.deceased||[]).filter(d=>d&&(d.name||d.date)),donation:{type:'none'},status:'wait',tags:[],
      unsure:Array.isArray(f.unsure)?f.unsure.filter(k=>FL[k]):[],review:true,_scanData:crop||url,_scanUrl:crop||whole,notes:f.hebDate?`תאריך בדף: ${f.hebDate}`:''};
    FIELDS.forEach(([k])=>{if(f[k]!=null)pre[k]=String(f[k])});pre.email=fixEmail(pre.email);out.push(pre)}
  if(!out.length)throw {code:'parse'};return out}
let pdfLib=null;
async function pdfToImages(file){if(!pdfLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfLib=window.pdfjsLib;pdfLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
  const pdf=await pdfLib.getDocument({data:await file.arrayBuffer()}).promise;const out=[];
  for(let i=1;i<=pdf.numPages;i++){const pg=await pdf.getPage(i);const vp=pg.getViewport({scale:2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.9));out.push(new File([b],`${file.name.replace(/\.pdf$/i,'')} – עמוד ${i}.jpg`,{type:'image/jpeg'}))}return out}

/* הציבור ממלא טופס בקישור. הפרטים מוצפנים בדפדפן שלו במפתח הציבורי של הארגון, כך שרק גבאים מאושרים יכולים לפתוח אותם.
   בשרת יש תיבת דואר שאפשר רק להכניס אליה (לא לקרוא), ובה רק ג'יבריש. */
let INBOX=[],INKEY=null;
const WEBFORM_URL=()=>location.origin+location.pathname+'#bakasha';
let _ikP=null;function ensureInboxKey(){if(!_ikP)_ikP=_ensureInboxKey().finally(()=>{_ikP=null});return _ikP}
async function _ensureInboxKey(){if(MODE!=='cloud'||!DEK||!isAdm())return;try{
  const {data:pub}=await SB.from('kk_public').select('data').eq('id','form').maybeSingle();
  const {data:pk}=await SB.from('kk_settings').select('data').eq('id','inboxkey').maybeSingle();
  if(pub?.data?.pub&&pk?.data?.enc){if(!!pub.data.open!==!!S.features.webform)await SB.from('kk_public').upsert({id:'form',data:{...pub.data,open:!!S.features.webform}});return}
  const kp=await crypto.subtle.generateKey({name:'RSA-OAEP',modulusLength:2048,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-256'},true,['encrypt','decrypt']);
  const pubJ=await crypto.subtle.exportKey('jwk',kp.publicKey),priv=kb64(await crypto.subtle.exportKey('pkcs8',kp.privateKey));
  await SB.from('kk_settings').upsert({id:'inboxkey',data:{enc:await encStr(priv)},updated_at:new Date().toISOString()});
  await SB.from('kk_public').upsert({id:'form',data:{pub:pubJ,open:!!S.features.webform},updated_at:new Date().toISOString()});log('טופס מהבית','נוצר מפתח לטופס')}catch(e){}}
async function loadInbox(){if(MODE!=='cloud'||!DEK||!S.features.webform||!canEdit()){INBOX=[];return}try{
  if(!INKEY){const {data}=await SB.from('kk_settings').select('data').eq('id','inboxkey').maybeSingle();if(!data?.data?.enc)return;INKEY=await crypto.subtle.importKey('pkcs8',kub(await decStr(data.data.enc)),{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt'])}
  const {data,error}=await SB.from('kk_inbox').select('id,data,created_at').order('created_at',{ascending:true});if(error)return;
  const out=[];for(const r of data||[]){try{const k=await importDek(new Uint8Array(await crypto.subtle.decrypt({name:'RSA-OAEP'},INKEY,kub(r.data.k))));const iv=kub(r.data.iv);
    const o=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},k,kub(r.data.c))));out.push({id:r.id,at:r.created_at,o})}catch(e){out.push({id:r.id,at:r.created_at,bad:true})}}
  INBOX=out}catch(e){}}

  ${list.length?list.map(it=>it.bad?`<div class="card"><b>בקשה שלא ניתן לפתוח</b> <button class="btn sm danger" data-del="${it.id}">מחק</button></div>`:`<div class="card" style="margin-bottom:10px"><div class="row"><h3 style="margin:0">${esc([it.o.first,it.o.last].join(' '))}</h3><span class="muted small">${new Date(it.at).toLocaleString('he-IL')}</span><span class="spacer"></span>${(it.o.tags||[]).map(t=>`<span class="pill tag">${esc(t)}</span>`).join('')}</div>

function allReceipts(){const out=[];allDonations().forEach(it=>{const d=it.d;
  if(d.rc)out.push({it,rc:d.rc,year:null});else if(d.receipt&&d.type!=='standing')out.push({it,rc:{no:d.receipt,date:it.date,amount:+d.amount||0,old:true},year:null});

${old&&!old.cancelled?'<button type="button" class="btn danger" id="rcCancel">ביטול קבלה</button>':''}</div>${old?SEND.html:'<p class="small muted" style="margin:0">אחרי ההפקה יופיעו כאן כפתורי שליחה לתורם: מייל, וואטסאפ ותמונה.</p>'}</form>`;
  document.body.appendChild(ov);const close=()=>ov.remove();$('#rcX').onclick=close;if(old)SEND.bind();

function standingHint(aSel,mSel,sSel,outSel){const f=()=>{const a=+($(aSel)?.value||0),m=+($(mSel)?.value||0),s=$(sSel)?.value||ym(new Date()),o=$(outSel);if(!o)return;
  o.textContent=a&&m?T('סה״כ התחייבות')+': '+money(a*m)+' · '+T('חודש אחרון')+': '+HEB_GREG_M[+addMonths(s,m-1).slice(5)-1]+' '+addMonths(s,m-1).slice(0,4):a?T('ללא הגבלת חודשים – עד שמבטלים'):''};

const isPaid=v=>v===true;
MSG_TPL.bounced=['הוראת קבע שלא עברה',`שלום {שם},\n\nרצינו לעדכן שהחיוב החודשי של הוראת הקבע שלך למרכז חסידי ביאלא ({סכום}) לא עבר החודש.\nנשמח אם תבדוק מול הבנק או תיצור איתנו קשר כדי להסדיר.\n\nבברכה ובתודה,\nמרכז חסידי ביאלא בני ברק`];

/* ---------- שליחת קבלה ---------- */
function receiptText(rc){const o=ORG();return `שלום ${rc.name},\n\nתודה רבה על תרומתך ל${o.name||'מרכז חסידי ביאלא בני ברק'}.\n\nקבלה על תרומה מס׳ ${rc.no}\nתאריך: ${heb(rc.date)} (${greg(rc.date)})\nסכום: ${money(rc.amount)}\nאופן התשלום: ${rc.method||''}${rc.idNo?`\nמספר זהות / ח״פ: ${rc.idNo}`:''}${rc.s46&&o.s46Until?`\nהתרומה מוכרת לזיכוי ממס לפי סעיף 46 (האישור בתוקף עד ${greg(o.s46Until)}).`:''}${rc.reportNo?`\nהתרומה דווחה לרשות המסים – מספר דיווח: ${rc.reportNo}`:''}${rc.cancelled?'\n\n*** קבלה זו בוטלה ***':''}\n\nבברכה,\n${o.signer||'הגזבר'}\n${o.name||'מרכז חסידי ביאלא בני ברק'}`}
let _h2c=null;const loadH2C=()=>_h2c||(_h2c=new Promise((ok,no)=>{if(window.html2canvas)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';s.onload=ok;s.onerror=()=>{_h2c=null;no(new Error('load'))};document.head.appendChild(s)}));
async function receiptImage(rc){await loadH2C();const w=document.createElement('div');w.style.cssText='position:fixed;top:0;left:-3000px;width:720px;background:#fff;color:#000;padding:20px;direction:rtl;font-family:David,"Frank Ruhl Libre","Times New Roman",serif;font-size:13pt;line-height:1.5';
  w.innerHTML=receiptHTML(rc);document.body.appendChild(w);try{const c=await html2canvas(w,{scale:2,backgroundColor:'#ffffff'});return await new Promise(r=>c.toBlob(r,'image/png'))}finally{w.remove()}}
function receiptSendBar(getRc,to){return {html:`<div class="row" style="flex-wrap:wrap;margin-top:6px"><b class="small">שליחה לתורם:</b>
    <button type="button" class="btn sm" id="rsMail">📧 מייל</button><button type="button" class="btn sm" id="rsWa">וואטסאפ</button><button type="button" class="btn sm" id="rsImg">⬇ הורד כתמונה</button><button type="button" class="btn sm" id="rsCp">העתק נוסח</button></div><div id="rsMsg" class="small muted"></div>`,
  bind:()=>{const m=t=>$('#rsMsg').textContent=T(t);
    $('#rsMail').onclick=async()=>{const rc=getRc();const e=fixEmail(to().email||'');if(!e)return m('אין כתובת מייל לתורם. אפשר להוסיף בכרטיס האדם, או להוריד כתמונה ולשלוח ידנית.');const subj=`קבלה על תרומה מס׳ ${rc.no} – ${ORG().name||'מרכז חסידי ביאלא'}`;
      if(S.emailjs?.service&&S.emailjs?.template&&S.emailjs?.key){m('שולח…');try{const r=await fetch('https://api.emailjs.com/api/v1.0/email/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service_id:S.emailjs.service,template_id:S.emailjs.template,user_id:S.emailjs.key,template_params:{to_email:e,to_name:rc.name,subject:subj,message:receiptText(rc),message_html:receiptHTML(rc)}})});
        if(!r.ok)throw new Error(await r.text());log('שליחת קבלה',rc.name,{no:rc.no,channel:'emailjs'});m('הקבלה נשלחה במייל ✓')}catch(x){m('השליחה נכשלה: '+String(x.message||x).slice(0,100))}}
      else{location.href=`mailto:${encodeURIComponent(e)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(receiptText(rc))}`;log('שליחת קבלה',rc.name,{no:rc.no,channel:'mail'})}};
    $('#rsWa').onclick=()=>{const rc=getRc();const p=intlPhone(to().phone||'');if(p.length<10)return m('אין מספר נייד לתורם');window.open(`https://wa.me/${p}?text=${encodeURIComponent(receiptText(rc))}`,'_blank');log('שליחת קבלה',rc.name,{no:rc.no,channel:'whatsapp'});m('נפתח וואטסאפ עם נוסח הקבלה. אם רוצים לצרף גם את הקבלה עצמה – "הורד כתמונה" וגוררים לשיחה.')};
    $('#rsImg').onclick=async()=>{const rc=getRc();m('מכין תמונה…');try{const b=await receiptImage(rc);downloadBlob(`קבלה-${rc.no}.png`,b);m('התמונה ירדה לתיקיית ההורדות')}catch(x){m('לא הצליח להכין תמונה. אפשר "הדפסה" ← "שמור כ־PDF".')}};
    $('#rsCp').onclick=()=>copy(receiptText(getRc()),'הנוסח הועתק')}}}

/* ---------- צ׳קים ---------- */
const CHK_ST={wait:'ממתין להפקדה',dep:'הופקד',bounced:'חזר'};
function allChecks(){return allDonations().filter(it=>it.d.type==='check').map(it=>({it,due:it.d.checkDue||it.date||'',st:it.d.checkState||'wait'})).sort((a,b)=>a.due.localeCompare(b.due))}
const dueSoon=(c,days=3)=>c.st==='wait'&&c.due&&c.due<=new Date(Date.now()+days*864e5).toISOString().slice(0,10);
function checksSection(){const L=allChecks();if(!L.length)return '';const soon=L.filter(c=>dueSoon(c)).length;
  return `<h3 style="margin:18px 0 8px">צ׳קים (${L.length})${soon?` <span class="pill rev">${soon} להפקדה עכשיו</span>`:''}</h3>
  <div class="tablewrap"><table class="wide"><thead><tr><th>תאריך פירעון</th><th>שם</th><th>סכום</th><th>מס׳ צ׳ק / בנק</th><th>מצב</th><th></th></tr></thead><tbody>
  ${L.map((c,i)=>`<tr ${dueSoon(c)?'style="background:var(--hl,#fff3d6)"':''}><td>${dual(c.due)}</td><td>${esc(c.it.name)}</td><td class="num">${money(c.it.d.amount)}</td><td class="small">${esc([c.it.d.checkNo,c.it.d.checkBank].filter(Boolean).join(' · '))}</td>
    <td><span class="pill ${c.st==='dep'?'done':c.st==='bounced'?'rev':'wait'}">${CHK_ST[c.st]}</span></td>
    <td class="row">${c.st!=='dep'?`<button class="btn sm" data-ck="${i}|dep">הופקד ✓</button>`:''}${c.st!=='bounced'?`<button class="btn sm" data-ck="${i}|bounced">חזר</button>`:''}${c.st!=='wait'?`<button class="btn sm" data-ck="${i}|wait">החזר לממתין</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function bindChecks(){const L=allChecks();$$('[data-ck]').forEach(b=>b.onclick=async()=>{const [i,s]=b.dataset.ck.split('|');const c=L[+i];c.it.d={...c.it.d,checkState:s};await saveDon(c.it);log('צ׳ק – '+CHK_ST[s],c.it.name);refreshFin()})}
const checkFields=d=>`<label class="f" id="wChk1">תאריך פירעון הצ׳ק<input id="ckDue" type="date" value="${esc(d.checkDue||'')}"></label><label class="f" id="wChk2">מס׳ צ׳ק<input id="ckNo" dir="ltr" maxlength="12" value="${esc(d.checkNo||'')}"></label><label class="f" id="wChk3">בנק / סניף<input id="ckBank" maxlength="40" value="${esc(d.checkBank||'')}"></label>`;

/* ---------- יעד גבייה ---------- */
function monthCollected(m=ym(new Date())){return allDonations().reduce((s,it)=>{if(it.d.type==='standing')return s+(isPaid(it.payments?.[m])?+it.d.amount||0:0);
  if(it.d.type==='check'){if(it.d.checkState==='bounced')return s;return s+(((it.d.checkDue||it.date||'').startsWith(m))?+it.d.amount||0:0)}
  return s+((it.date||'').startsWith(m)?+it.d.amount||0:0)},0)}
function goalBar(){if(!(S.features.finance&&FIN&&canFin()&&+S.goal))return '';const g=+S.goal,c=monthCollected(),p=Math.min(100,Math.round(c/g*100));
  return `<div class="card goal"><div class="row"><b>🎯 יעד הגבייה ל${HEB_GREG_M[new Date().getMonth()]}</b><span class="spacer"></span><span class="num">${money(c)||'₪0'} מתוך ${money(g)} · ${p}%</span></div>
  <div class="gbar"><i style="width:${p}%"></i></div>${p>=100?'<div class="small" style="color:var(--ok)">היעד הושג! 🎉</div>':`<div class="small muted">חסר עוד ${money(g-c)}</div>`}</div>`}
function goalEditor(){return `<div class="row small" style="margin:6px 0"><label class="row">יעד גבייה חודשי (₪) <input id="goalIn" type="number" min="0" style="width:120px" value="${esc(S.goal||'')}"></label><button class="btn sm" id="goalSave">שמור יעד</button></div>`}
function bindGoal(){if($('#goalSave'))$('#goalSave').onclick=async()=>{S.goal=+$('#goalIn').value||0;await putS('יעד גבייה חודשי');toast('היעד נשמר');renderMoney()}}

/* ---------- רשימות שמות לאירוע / ימי זיכרון בחודש עברי ---------- */
const HM_ORDER=['Tishri','Heshvan','Kislev','Tevet','Shevat','Adar','Adar I','Adar II','Nisan','Iyar','Sivan','Tamuz','Av','Elul'];
const EVENTS=['ערב ראש השנה','יום הכיפורים','הושענא רבה','חנוכה','ט״ו בשבט','פורים','ערב פסח','ל״ג בעומר','שבועות','יום הילולא','תפילה מיוחדת'];
function yahrInMonth(mk){const out=[];R.forEach(x=>(x.deceased||[]).forEach(d=>{const dm=hebDayMonth(d.date);if(dm&&monthMatch(dm.m,mk))out.push({...d,day:dm.day,by:x})}));
  const seen=new Set();return out.filter(o=>{const k=o.name+'|'+o.day;if(seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>a.day-b.day)}
function docYahrMonth(mk){const L=yahrInMonth(mk);return `${docHead('ימי זיכרון בחודש '+HM[mk])}<table><tr><th>יום</th><th>לעילוי נשמת</th><th>קירבה</th><th>משפחת</th><th>טלפון</th></tr>${L.map(o=>`<tr><td>${gem(o.day)} ${esc(HM[mk])}</td><td><b>${esc(o.name)}</b></td><td>${esc(o.rel||'')}</td><td>${esc(fullName(o.by))}</td><td>${esc(o.by.mobile||o.by.homePhone||'')}</td></tr>`).join('')||'<tr><td colspan="5">אין ימי זיכרון בחודש הזה</td></tr>'}</table>`}
function eventsCard(){const cur=hparts(new Date());
  return `<div class="card" style="margin-top:12px"><h3>רשימות מיוחדות</h3><div class="grid">
    <div><label class="f">🕯 ימי זיכרון בחודש עברי<select id="ymM">${HM_ORDER.map(k=>`<option value="${k}" ${k===cur?.month?'selected':''}>${HM[k]}</option>`).join('')}</select></label>
      <div class="row" style="margin-top:6px"><button class="btn sm gold" id="ymP">הדפסה</button><button class="btn sm" id="ymW">וורד</button><span class="small muted" id="ymC"></span></div></div>
    <div><label class="f">📜 רשימה לאירוע (לפי הסינון למעלה)<input id="evT" list="evL" placeholder="למשל: ערב ראש השנה"><datalist id="evL">${EVENTS.map(e=>`<option value="${e}">`).join('')}</datalist></label>
      <div class="row" style="margin-top:6px"><button class="btn sm gold" id="evP">הדפסה</button><button class="btn sm" id="evW">וורד</button></div></div></div></div>`}
function bindEvents(list){if(!$('#ymM'))return;const cnt=()=>{$('#ymC').textContent=yahrInMonth($('#ymM').value).length+' '+T('שמות')};$('#ymM').onchange=cnt;cnt();
  $('#ymP').onclick=()=>saveDoc('ימי זיכרון '+HM[$('#ymM').value],docYahrMonth($('#ymM').value),'print');$('#ymW').onclick=()=>saveDoc('ימי זיכרון '+HM[$('#ymM').value],docYahrMonth($('#ymM').value),'word');
  const t=()=>'רשימת שמות לתפילה'+($('#evT').value.trim()?' – '+$('#evT').value.trim():'');
  $('#evP').onclick=()=>saveDoc(t(),docNamesTopic(list,t()),'print');$('#evW').onclick=()=>saveDoc(t(),docNamesTopic(list,t()),'word')}

boot().then(ok=>{if(ok||(MODE==='local'&&ss.get('biala_in')==='1'))enter()});
</script>
