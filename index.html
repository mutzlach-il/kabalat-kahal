<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4a2410">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="crest.webp">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>קבלת קהל ביאלה</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap">
<style>
/* פריסה: פס עליון מהגוני עם הכתר ולשוניות; אזור עבודה עם הכתר כסימן מים; תאריך עברי ראשי, לועזי קטן לידו */
:root{
  --bg:#f3efe8; --panel:#fffdf9; --ink:#2b1d12; --muted:#76624f; --line:#e1d6c6;
  --wood:#4a2410; --wood2:#6b3416; --gold:#b8862b; --gold-soft:#f1e3c2;
  --ok:#2f6b3a; --warn:#c2620a; --warn-soft:#fde8d2; --bad:#9b2c1e; --field:#fff;
  --display:"Frank Ruhl Libre","David",serif; --body:"Assistant","Arial",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b130d; --panel:#251a12; --ink:#f1e6d6; --muted:#b9a58e; --line:#3d2c1f;
  --wood:#2e160a; --wood2:#4a2410; --gold:#d6a84a; --gold-soft:#3a2a14;
  --ok:#7fc28a; --warn:#f0a050; --warn-soft:#3d2610; --bad:#e08070; --field:#1f160f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b130d; --panel:#251a12; --ink:#f1e6d6; --muted:#b9a58e; --line:#3d2c1f;
  --wood:#2e160a; --wood2:#4a2410; --gold:#d6a84a; --gold-soft:#3a2a14;
  --ok:#7fc28a; --warn:#f0a050; --warn-soft:#3d2610; --bad:#e08070; --field:#1f160f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#login{min-height:100vh;display:grid;place-items:center;padding-block:32px;background:radial-gradient(ellipse at top,#6b3416,#3a1a08 70%)}
.login-card{width:min(400px,100%);text-align:center;color:#f6ead2;display:grid;gap:12px}
.login-card img{width:min(300px,80%);margin:0 auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.login-card h1{font-family:var(--display);font-weight:900;font-size:2rem;margin:0}
.login-card p{margin:0;color:#d9c39b}
.login-card input,.login-card select{background:rgba(255,255,255,.08);border:1px solid #8a6a3a;color:#fff;border-radius:10px;padding:12px 14px;text-align:center;font-size:1.1rem}
.login-card select option{color:#222}
.login-card .err{color:#ffb4a6;min-height:1.5em}

header.top{background:linear-gradient(180deg,var(--wood2),var(--wood));color:#f6ead2;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.25)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wood2)}
.top-in{max-width:1280px;margin:0 auto;padding-block:6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top-in img{height:44px}
.brand{display:grid;line-height:1.15}
.brand b{font-family:var(--display);font-size:1.2rem}
.brand span{font-size:.78rem;color:#d9c39b}
.who{font-size:.8rem;color:#d9c39b;margin-inline-start:auto;white-space:nowrap}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;width:100%;padding-bottom:4px}
nav.tabs button{background:none;border:0;color:#e9d7b5;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.95rem;display:inline-flex;gap:6px;align-items:center}
nav.tabs button[aria-current="true"]{background:var(--gold);color:#2b1606}
nav.tabs button:hover:not([aria-current="true"]){background:rgba(255,255,255,.08)}
nav.tabs .badge{background:var(--warn);color:#fff;border-radius:99px;font-size:.72rem;padding:0 6px}
.modebar{max-width:1280px;margin:8px auto 0;font-size:.85rem}
.modebar div{background:var(--warn-soft);border:1px solid var(--warn);border-radius:9px;padding:6px 12px}
main{position:relative;max-width:1280px;margin:0 auto;padding-block:18px 70px}
.watermark{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0}
.watermark img{width:min(640px,80vw);opacity:.07}
main>section{position:relative;z-index:1}

h2{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--gold)}
a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--wood2);border-color:var(--wood2);color:#fbefd6}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b1606}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.86rem}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:default}
.stat.link{cursor:pointer}.stat.link:hover{border-color:var(--gold)}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.88rem}
.stat.alert{border-color:var(--warn);background:var(--warn-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.toolbar input[type=search]{flex:1;min-width:200px}

.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
table.wide{min-width:760px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;color:var(--muted);font-weight:700;background:var(--gold-soft);white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:color-mix(in srgb,var(--gold-soft) 55%,transparent)}
tr.rev td:first-child{box-shadow:inset -4px 0 0 var(--warn)}
td.num,.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.pill.wait{color:var(--warn)} .pill.in{color:var(--gold)} .pill.done{color:var(--ok)}
.pill.rev{color:#fff;background:var(--warn);border-color:var(--warn)}
.pill.tag{color:var(--wood2);border-style:dashed}
:root[data-theme="dark"] .pill.tag{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.tag{color:var(--gold)}}
.g{font-size:.74rem;color:var(--muted);font-weight:400}
.hd{font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}

.form{display:grid;gap:14px}
.formwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.formwrap.withimg{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:900px){.formwrap.withimg{grid-template-columns:1fr}}
.scanimg{position:sticky;top:120px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.scanimg img{width:100%;border-radius:6px;cursor:zoom-in}
.scanimg img.big{cursor:zoom-out}
fieldset{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 16px 16px;margin:0;min-width:0}
legend{font-family:var(--display);font-weight:700;font-size:1.08rem;padding:0 8px;color:var(--wood2)}
:root[data-theme="dark"] legend{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) legend{color:var(--gold)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.grid .wide{grid-column:1/-1}
label.f{display:grid;gap:3px;font-size:.86rem;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-weight:400;font-size:1rem;width:100%}
label.f textarea{min-height:84px;resize:vertical}
label.f.unsure input,label.f.unsure textarea{border:2px solid var(--warn);background:var(--warn-soft)}
label.f.unsure::after{content:"לבדיקה — לא ברור בכתב היד";color:var(--warn);font-size:.74rem}
.hint{font-size:.76rem;color:var(--gold);font-weight:600;min-height:1.1em}
input[dir="ltr"]{text-align:left}
.dec-row{display:grid;grid-template-columns:2fr 1fr 1.3fr auto;gap:8px;align-items:end;margin-bottom:8px}
@media (max-width:560px){.dec-row{grid-template-columns:1fr 1fr}.dec-row .rm{grid-column:1/-1}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{border:1px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer;font-size:.9rem;background:var(--field)}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--gold);border-color:var(--gold);color:#2b1606;font-weight:700}
.chips label:has(input:focus-visible){outline:2px solid var(--gold)}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding-block:10px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);z-index:3}
.notice{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:10px 12px}
.notice.info{background:var(--gold-soft);border-color:var(--gold)}
.lock{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:10px;padding:10px 12px;font-size:.9rem}

.view{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.view{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
dt{color:var(--muted);font-size:.86rem}
dd{margin:0;overflow-wrap:anywhere}
dd.unsure{color:var(--warn);font-weight:700}
.req{background:var(--gold-soft);border-radius:10px;padding:12px 14px;white-space:pre-wrap;font-size:1.05rem}
.confirm{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border:1px solid var(--bad);border-radius:10px;padding:10px 12px}

/* קוויטל — מסך גדול */
.kv{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:clamp(18px,4vw,44px);text-align:center;display:grid;gap:18px;min-height:60vh;align-content:center}
.kv .nm{font-family:var(--display);font-weight:900;font-size:clamp(2rem,6vw,4rem);line-height:1.2}
.kv .rq{font-size:clamp(1.2rem,3vw,1.9rem);white-space:pre-wrap}
.kv .sub{color:var(--muted);font-size:1.05rem}
.kv .dec{font-family:var(--display);font-size:1.3rem}

.queue{display:grid;gap:8px}
.qi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.qi .no{font-family:var(--display);font-weight:900;font-size:1.6rem;color:var(--gold);min-width:2.2ch;text-align:center}
.qi.cur{border:2px solid var(--gold);background:var(--gold-soft)}
.qi.done{opacity:.55}

.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:90px 1fr 90px;gap:8px;align-items:center;font-size:.88rem}
.bar i{display:block;height:14px;border-radius:4px;background:var(--gold)}
.bar i.out{background:var(--bad)}
.help{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;max-width:78ch}
.help h3{margin-top:14px}
.help p{margin:6px 0}
.drop{display:grid;place-items:center;gap:6px;text-align:center;border:2px dashed var(--gold);border-radius:16px;padding:44px 16px;background:var(--panel);cursor:pointer;margin:14px 0 6px}
.drop b{font-family:var(--display);font-size:1.4rem;color:var(--wood2)}.drop span{color:var(--muted)}.drop.over,.drop:hover{background:var(--gold-soft)}
:root[data-theme="dark"] .drop b{color:var(--gold)}
.pcard{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--gold-soft),var(--panel));border:1px solid var(--gold);border-radius:14px;padding:16px 18px;margin:14px 0}
.pname{font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15}
.pstats{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.92rem}.pstats b{font-family:var(--display);font-size:1.3rem}
.timeline{display:grid;gap:10px}.tl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}.tl.rev{border-color:var(--warn)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gallery figure{margin:0;display:grid;gap:4px}
.gallery img{width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}.gallery figure.big{grid-column:1/-1}.gallery figure.big img{cursor:zoom-out}
.gallery figcaption{font-size:.8rem;text-align:center}
.docs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;margin-top:12px}@media (max-width:820px){.docs{grid-template-columns:1fr}}
.doclist{gap:4px;padding:8px}.doclist button{background:none;border:0;text-align:right;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.doclist button:hover{background:var(--gold-soft)}.doclist button.on{background:var(--wood2);color:#fbefd6}
.edbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px}
.edbar>button:not(.btn){border:1px solid var(--line);background:var(--field);border-radius:6px;padding:3px 10px;cursor:pointer}
.paper{background:#fff;color:#000;border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:clamp(14px,4vw,40px);min-height:70vh;overflow-x:auto;outline:none}
.paper:focus{box-shadow:0 0 0 2px var(--gold),0 4px 18px rgba(0,0,0,.12)}

.langsw{display:inline-flex;border:1px solid #8a6a3a;border-radius:9px;overflow:hidden;flex:none}
.langsw button{background:transparent;color:#e9d7b5;border:0;padding:4px 10px;cursor:pointer;font-weight:700;font-size:.85rem}
.langsw button[aria-pressed="true"]{background:var(--gold);color:#2b1606}
.login-card .langsw{justify-self:center}
html[dir=ltr] body{direction:ltr}
html[dir=ltr] th,html[dir=ltr] td,html[dir=ltr] .doclist button{text-align:left}
html[lang=en] label.f.unsure::after{content:"To review — unclear handwriting"}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:1.05rem;cursor:pointer}
.gbtn:hover{background:#f3f3f3}.or{color:#d9c39b;font-size:.85rem;text-align:center}
.sysbox{display:flex;flex-wrap:wrap;gap:10px;align-items:end;border:2px solid var(--ok);border-radius:12px;padding:12px 14px;margin-bottom:12px}.sysbox.off{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.gwrap{display:grid;justify-items:center;gap:6px;min-height:44px}
.pending{background:#fff6e5;color:#4a2410;border-radius:10px;padding:12px;display:grid;gap:8px;text-align:center}.pending.bad{background:#ffe3df}
#usersIn select,#usersIn input:not([type=checkbox]){background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--wood);color:#fbefd6;padding:10px 18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:20;max-width:90vw}
textarea.code{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:.8rem;direction:ltr;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink)}
.keybox{display:grid;gap:8px;text-align:right}.keybox h3{margin:0;text-align:center}.keybox .small{line-height:1.7}.reccode{font:700 20px monospace;letter-spacing:1px;background:#fff8e6;border:2px dashed #c9a227;border-radius:8px;padding:12px;text-align:center;user-select:all;color:#222}
.gsearch{position:relative;flex:1 1 220px;max-width:340px;min-width:160px}.gsearch input{width:100%;box-sizing:border-box;padding:7px 10px;border-radius:8px;border:1px solid #8a6a3a;background:#fff8ec;color:#2a1608;font:inherit}
#gres{position:absolute;top:calc(100% + 4px);inset-inline:0;background:var(--card,#fff);color:var(--ink,#222);border:1px solid var(--line,#ccc);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:60;max-height:70vh;overflow:auto}
.gi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line,#eee);padding:8px 12px;cursor:pointer;color:inherit;font:inherit}.gi span{font-size:12px;opacity:.75}.gi i{font-size:11px;opacity:.6;font-style:normal}.gi.on,.gi:hover{background:rgba(201,162,39,.15)}.gi.new{color:var(--accent,#7a4a12);font-weight:600;display:block}.gi.none{padding:12px;display:block}
.inst{background:transparent!important;color:#e9d7b5!important;border-color:#8a6a3a!important}
.modal{position:fixed;inset:0;background:rgba(20,10,0,.55);z-index:80;display:grid;place-items:center;padding:16px}.modal-in{background:var(--card,#fff);color:var(--ink,#222);border-radius:14px;padding:18px;width:min(640px,100%);max-height:92vh;overflow:auto;display:grid;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.notice.tid{background:#fff4d6;border-color:#c9a227}
tr.sel td{background:rgba(201,162,39,.18)}
.gbar{height:14px;background:var(--line,#e5d9c3);border-radius:8px;overflow:hidden;margin:8px 0 4px}.gbar i{display:block;height:100%;background:linear-gradient(90deg,#b8862b,#d9a441);border-radius:8px}.card.goal{margin:8px 0 12px}
button.pay{min-width:38px;height:28px;border:1px solid var(--line,#ccc);border-radius:6px;background:transparent;color:inherit;cursor:pointer;font:inherit;font-size:.85rem}button.pay.ok{background:var(--ok,#2e7d32);color:#fff;border-color:transparent}button.pay.bad{background:var(--bad,#b3261e);color:#fff;border-color:transparent}
.todaygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:10px}.card.today{border-inline-start:5px solid var(--warn)}.card.today.ok{border-inline-start-color:var(--ok);opacity:.85}.card.today h3{margin:0}.card.today table{width:100%;margin:6px 0}.card.today td{padding:4px 2px;border-bottom:1px solid var(--line,#ddd)}
.pubform{max-width:760px;margin:20px auto;padding:0 16px}.pubform form{position:relative}.pfh{text-align:center;margin-bottom:12px}.pfh img{width:84px;height:auto}.pfh h1{font-size:1.35rem;margin:6px 0}.pfh p{margin:0;opacity:.75}
.qscreen{background:linear-gradient(160deg,#4a2410,#2a1406);color:#f5e6c8;border-radius:16px;padding:28px;margin-top:12px;min-height:70vh;display:grid;gap:20px;align-content:start;text-align:center}
.qscreen:fullscreen{border-radius:0;padding:5vh 5vw;align-content:center}.qsh{display:flex;align-items:center;justify-content:center;gap:16px}.qsh img{height:70px}.qsh b{display:block;font-size:2rem}.qsh span{opacity:.8}

# שפה
הכפתורים למעלה מחליפים בין עברית ל־English. ברירת המחדל היא עברית. שמות, בקשות ומכתבים להדפסה נשארים כמו שנכתבו.

# כניסה
עם שרת משותף: לוחצים "כניסה עם Google" ובוחרים את החשבון. רק מי שהמנהל הוסיף או אישר יכול להיכנס. מי שלא ברשימה רואה "ממתין לאישור מנהל" ולא רואה שום נתון.
בלי שרת: בוחרים את השם מהרשימה ומקלידים את הסיסמה האישית. כל בקשה שנקלטת נרשמת על שם מי שהכניס אותה.

# משתמשים והרשאות (ניהול)
בלשונית "ניהול" ← "משתמשים והרשאות" מוסיפים משתמש (עם שרת: לפי כתובת Gmail; בלי שרת: שם וסיסמה אישית), מאשרים בקשות הצטרפות, חוסמים, מסירים ומאפסים סיסמה.
יש ארבע הרשאות: מנהל — הכל, כולל משתמשים ויומן. גבאי + כספים — גם כספים וקופה. גבאי — קליטה, עריכה, סריקה והדפסה. צפייה בלבד — רואה ולא משנה.
המשתמש הראשון שמוסיפים הוא המנהל, ותמיד חייב להישאר לפחות מנהל אחד.
עם שרת יש גם הרשאת "בעלים" — רק לך. רק הבעלים יכול להשבית משתמש (וגם להפעיל אותו מחדש) ולהשבית את כל המערכת זמנית: בלשונית "ניהול" ← "משתמשים והרשאות" ← "השבת את המערכת לכולם". כשהמערכת מושבתת אף אחד חוץ ממך לא נכנס ולא רואה נתונים, ומי שהיה מחובר נזרק תוך כחצי דקה. מנהלים אחרים יכולים רק להוסיף ולהסיר משתמשים.

# יומן פעולות (מנהל בלבד)
כל כניסה ויציאה, בקשה חדשה, עריכה, שינוי סטטוס, מחיקה, צפייה בבקשה, הדפסה, הורדה לוורד ולאקסל, פתיחת כספים, שינוי הגדרות וניסיון כניסה שנכשל — נרשמים עם השם, התאריך והשעה.
אפשר לסנן לפי משתמש, פעולה ותאריכים, ולהוריד לאקסל. ניסיונות כושלים ומחיקות מסומנים בכתום. אי אפשר למחוק או לשנות את היומן.

# קליטת בקשה חדשה
לוחצים על "בקשה חדשה" וממלאים לפי הסדר של הטופס. ליד כל תאריך מופיע התאריך העברי.
תאריך לידה אפשר לכתוב בעברי (למשל: ד׳ חשוון תשי״ז) או בלועזי (למשל: 25/04/1956). לועזי מומר לעברי אוטומטית.
כשמקלידים מספר נייד שכבר קיים במערכת, מופיעה הודעה "נמצא ביקור קודם". לחיצה על "מלא פרטים" ממלאת את כל מה שידוע מהביקור הקודם.
"שמור והתחל חדשה" שומר ופותח טופס ריק, נוח כשיש ערימה של טפסים.

# סריקת טופס נייר
בטופס בקשה חדשה לוחצים "סרוק טופס נייר" ובוחרים תמונה של הטופס. המערכת קוראת את כתב היד וממלאת את השדות.
שדות שלא היו ברורים מסומנים בכתום עם הכיתוב "לבדיקה". תמונת הטופס מוצגת ליד הטופס, ואפשר להגדיל אותה בלחיצה.
חשוב: תמיד לעבור על השדות ולתקן לפני השמירה. כתובות מייל מתוקנות לפי הנפוץ (למשל ‎@gmail.com‎), אבל יש לוודא מול הדף.
הסריקה צריכה מפתח Gemini, שמכניסים פעם אחת בלשונית "ניהול" ← "סריקה אוטומטית".

# לשונית "סריקת דפים"
מקום מיוחד לסריקה. לוחצים על המסגרת הגדולה ובוחרים תמונה אחת או כמה תמונות ביחד (או גוררים אותן פנימה).
כל דף נקרא ונשמר אוטומטית כבקשה, עם תמונת הדף לידו. ברשימה שמתחת רואים את ההתקדמות, ולכל דף כפתור "פתח לבדיקה".
אם דף לא נקרא, אפשר ללחוץ "הקלד ידנית ליד התמונה" ולהקליד מול הדף.

# כרטיס אדם — כל החומר במקום אחד
בלשונית "אנשים" לוחצים על שם, ונפתח כרטיס עם הכל: פרטים אישיים, כל הביקורים והבקשות לפי תאריכים, כל השמות לתפילה, הנפטרים וימי הזיכרון הקרובים, התרומות (בסיסמת כספים) וכל הדפים הסרוקים שלו.
מכל בקשה אפשר להגיע לכרטיס בכפתור "כרטיס אדם מלא".
"בקשה חדשה לאדם זה" פותח טופס שכבר מולאו בו כל הפרטים, ונשאר רק לכתוב את הבקשה.

# מסמכים, וורד והדפסות
בלשונית "מסמכים והדפסות" בוחרים מסמך: טופס בקשה ריק, טופס ממולא, כרטיס אדם, קוויטלים (דף לכל בקשה), רשימת שמות, תור היום, דוח לתקופה, מדבקות כתובת, מכתב חופשי, מכתב תזכורת יום זיכרון, ובסיסמת כספים גם מכתב תודה, קבלה ואישור הוראת קבע.
המסמך מופיע כדף לבן. אפשר לכתוב ולשנות בו כל דבר, להדגיש ולהגדיל.
"הורד לוורד" שומר קובץ שנפתח ב־Word לעריכה נוספת. "הדפס" פותח מיד את חלון ההדפסה (שם אפשר גם לשמור כ־PDF).
כפתורי הדפסה ווורד יש גם בתוך כל בקשה, בכרטיס אדם, ברשימת השמות ובתור.
את נוסחי המכתבים עורכים בלשונית "ניהול".

# בקשות שמסומנות "לבדיקה"
בקשה שנסרקה או שפוענחה מכתב יד מסומנת בפס כתום ובתווית "לבדיקה". נכנסים לבקשה, לוחצים "עריכה", מתקנים ולוחצים "סמן כנבדק".

# תור קבלת קהל
בלשונית "תור היום" מופיעים כל מי שנקלטו היום לפי מספר. "הבא בתור" מסמן את הבא כמי שנכנס לאדמו״ר.

# מסך קוויטל
מציג בקשה אחת באותיות גדולות: השם לתפילה, הבקשה והנפטרים. מעבר בין בקשות בחצים. מתאים להראות לאדמו״ר או לגבאי שבפנים.

# רשימת שמות לתפילה
מרכזת את כל השמות לתפילה בקברי צדיקים ואת שמות הנפטרים לפי טווח תאריכים. כפתור "העתק" מעתיק את הרשימה, ויש גם הדפסה ווורד.

# כספים (סיסמה נוספת)
פרטי התרומות וסכומים מוסתרים מכל מי שאין לו סיסמת כספים. בלי הסיסמה רואים רק שיש תרומה, בלי סכום.
בלשונית "כספים" רואים תרומות, הוראות קבע, ומסמנים כל חודש אם הוראת הקבע נגבתה.
"קופה" מאפשרת לרשום הכנסות והוצאות של המשרד ולראות סיכום לפי חודשים.
לא רושמים במערכת מספרי כרטיס אשראי או חשבון בנק.

# ימי זיכרון וימי הולדת
המערכת מחשבת לפי הלוח העברי מי שיום הזיכרון או יום ההולדת שלו בשבועיים הקרובים.

# ניהול (סיסמת מנהל)
משתמשים והרשאות, החלפת סיסמאות הכספים והניהול, הפעלה וכיבוי של כל אפשרות במערכת, עריכת ההוראות האלה, עריכת נוסחי המכתבים, מפתח הסריקה, חיבור לשרת משותף, גיבוי ושחזור, והורדה לאקסל.

# איפה הנתונים נשמרים
בלי חיבור לשרת: הנתונים נשמרים רק במחשב שעליו עובדים. חובה להוריד קובץ גיבוי פעם בשבוע (ניהול ← "הורד קובץ גיבוי").
עם חיבור לשרת משותף (ניהול ← "חיבור לשרת משותף"): כל הגבאים עובדים על אותם נתונים מכל מחשב, וכל גבאי נכנס עם מייל וסיסמה משלו.

# אקסל וגיבוי
"הורד טבלה לאקסל" שומר קובץ שנפתח באקסל עם כל הבקשות. "הורד קובץ גיבוי" שומר את כל המערכת לקובץ אחד, ו"שחזור מקובץ גיבוי" מחזיר אותו.

# נעילה ומצב תצוגה
המערכת ננעלת לבד אחרי 20 דקות בלי פעילות (אפשר לכבות בניהול). הכפתור ◐ למעלה מחליף בין תצוגה בהירה לכהה.

# חיפוש מהיר
בראש המסך יש תיבת חיפוש. כותבים שם, שם משפחה או חלק ממספר טלפון, ומיד מופיעים האנשים המתאימים (וגם אנשי קשר). Enter או לחיצה פותחים את כרטיס האדם. אפשר ללחוץ על המקש / כדי לקפוץ לחיפוש. אם לא נמצא – יש כפתור "בקשה חדשה" עם השם שכתבת.

# זיהוי פונה חוזר
בבקשה חדשה, כשמקלידים טלפון או שם ושם משפחה, המערכת בודקת אם האדם כבר ביקר. אם כן, מופיע "נראה שהאדם הזה כבר ביקר" עם כפתור "זה הוא – מלא פרטים", שממלא את כל הפרטים והנפטרים מהביקורים הקודמים. הבקשה עצמה לא מועתקת.

# בשורות טובות
במסך של בקשה לוחצים "🎉 בשורה טובה" ובוחרים מה התבשרו (נולד ילד, נמצא זיווג, החלים...). כל הבשורות מרוכזות בלשונית "בשורות טובות", עם הדפסה ווורד. אפשר לשלוח לאדם ברכת מזל טוב בכפתור "💬 הודעה".

# מסך תור לחדר ההמתנה
בלשונית "תור היום" לוחצים "📺 מסך לחדר ההמתנה" ואז "מסך מלא". מחברים מחשב או מסך לטלוויזיה בחדר ההמתנה. רואים בגדול את המספר שנכנס עכשיו ואת הבאים בתור, בלי שמות (אפשר לסמן "להציג שם פרטי"). המסך מתעדכן לבד כל כמה שניות.

# שמות לתפילה לפי נושא
בלשונית "שמות לתפילה" השמות מסודרים לפי נושא: רפואה, זיווג, פרנסה וכו'. אפשר לבחור נושא אחד, טווח תאריכים, או "הכל ביחד". יש העתקה, הדפסה ווורד.

# אנשי קשר
לשונית "אנשי קשר" היא ספר טלפונים של המרכז: תורמים, בני משפחה, ספקים, רבנים. אפשר לקשר איש קשר לאדם שביקר, ואז הוא מופיע בכרטיס האדם. אנשי הקשר מופיעים גם בחיפוש המהיר, ויש הורדה לאקסל.

# שליחת הודעות: מייל, וואטסאפ, SMS
בכל בקשה, כרטיס אדם, איש קשר ותורם יש כפתור "💬 הודעה". בוחרים נוסח (הודעה חופשית, תודה על תרומה, קבלה, אישור הוראת קבע, תזכורת לחידוש, תזכורת יום זיכרון, ברכת מזל טוב), עורכים, ובוחרים איך לשלוח:
"פתח במייל" – פותח את תוכנת המייל עם ההודעה מוכנה.
"שלח ישירות מהמערכת" – מופיע רק אחרי שמחברים EmailJS בלשונית "ניהול".
"וואטסאפ" – פותח וואטסאפ עם ההודעה למספר הנייד (צריך וואטסאפ במחשב או בטלפון).
"SMS" ו"העתק".
כל הודעה שנשלחת נרשמת ביומן הפעולות.

# ניהול תורמים
לשונית "תורמים" (בסיסמת כספים) מרכזת כל תורם במקום אחד: כמה תרם בסך הכל, הוראות קבע, עד מתי הן, כמה נגבו, ותרומה אחרונה. יש סינון: הוראות קבע פעילות, הוראות קבע שמסתיימות בקרוב, שהסתיימו, לא נגבה החודש, חד־פעמי. מכל תורם אפשר לשלוח תודה, קבלה או תזכורת לחידוש. יש הדפסה והורדה לאקסל.

# דוח חודשי
לשונית "דוח חודשי": בוחרים חודש ורואים כמה בקשות, כמה אנשים (וכמה חדשים), ימי קבלת קהל, בשורות טובות, נושאים, סטטוסים ומי קלט. מי שפתח כספים רואה גם תרומות וגבייה. יש הדפסה ווורד.

# גיבוי שבועי אוטומטי
אצל מנהלים, פעם בשבוע יורד לבד קובץ גיבוי לתיקיית ההורדות. במצב שרת הקובץ מוצפן במפתח הארגון, כך שגם אם הוא נאבד אי אפשר לקרוא אותו. משחזרים בלשונית "ניהול" ← "שחזור מקובץ גיבוי". אפשר לכבות באפשרויות המערכת.

# סריקה בכמויות
בלשונית "סריקת דפים" אפשר להעלות הרבה תמונות ביחד, קובץ PDF מהסורק (כל עמוד נקרא לבד), וגם תמונה אחת שיש בה כמה טפסים – המערכת מזהה כל טופס, חותכת את התמונה שלו ושומרת אותו כבקשה נפרדת לבדיקה.

# התקנה כאפליקציה
בראש המסך יש כפתור "📲 התקנה כאפליקציה". לוחצים, ומאשרים. מקבלים אייקון על שולחן העבודה ובתפריט התחל, והמערכת נפתחת בחלון משלה. אם הכפתור לא עובד: בכרום או באדג' לוחצים על שלוש הנקודות למעלה ← "התקנת קבלת קהל".

# הצפנה ומפתח הארגון
כל הנתונים מוצפנים במחשב לפני שהם יוצאים לשרת, עם "מפתח הארגון". בשרת נשמר רק ג'יבריש, ובגיטהאב יש רק את התוכנה בלי שום נתון. גם מי שיצליח להגיע לשרת יראה רק ג'יבריש.
בכניסה הראשונה המנהל הראשי קובע את מפתח הארגון (משפט של לפחות 10 תווים, אפשר בעברית) ומקבל קוד שחזור. את הקוד שומרים במקום בטוח, למשל מדפיסים אותו.
גבאי שאישרת לא צריך לדעת שום מפתח. הוא נכנס עם Google, ובפעם הראשונה המחשב שלו מחכה לפתיחה. המחשב נפתח אוטומטית ברגע שמנהל נכנס למערכת. כל מחשב מקבל מנעול משלו, שנשאר נעול בתוך הדפדפן שלו ולא יוצא ממנו אף פעם. מי שלא אושר, או שהושבת, לא מקבל נתונים מהשרת בכלל, והגישה של המחשבים שלו נמחקת.
מתי צריך את המפתח? כמעט אף פעם. רק אם אתה (הבעלים) נכנס ממחשב חדש, או אחרי שמחקת את נתוני הדפדפן.
שכחת את המפתח? במסך המפתח לוחצים "📧 שכחתי את המפתח – שחזור דרך המייל שלי" ובוחרים מפתח חדש. זה עובד רק לחשבון של הבעלים, ושום נתון לא נמחק. אפשר גם להשתמש בקוד השחזור. חשוב: מי שנכנס למייל שלך יכול לשחזר, לכן שומרים היטב על הסיסמה של המייל.

# כניסה עם מייל וסיסמה
מי שיש לו Gmail נכנס בכפתור Google, ולא צריך שום סיסמה.
מי שאין לו Gmail: כותב את המייל שלו, כותב בשדה הסיסמה סיסמה שהוא בוחר (לפחות 8 תווים), ולוחץ "כניסה ראשונה? בחירת סיסמה". מקבל מייל לאישור, לוחץ על הקישור, ואחר כך נכנס עם המייל והסיסמה.
שכח סיסמה? כותב את המייל ולוחץ "שכחתי סיסמה". מגיע אליו מייל עם קישור לבחירת סיסמה חדשה.
כמו בכניסה עם Google, גם כאן רק מי שאישרת ברשימת המשתמשים רואה נתונים.
בלשונית "ניהול" ← "הצפנת הנתונים" המנהל הראשי יכול להחליף את מפתח הארגון (למשל כשגבאי עוזב) וליצור קוד שחזור חדש.

# היום שלי
לשונית "היום שלי" מרכזת את כל מה שצריך לטפל בו היום: מי ממתין בתור, ימי זיכרון היום ומחר (עם כפתור לשליחת תזכורת למשפחה), בקשות לבדיקה, בשורות טובות שעוד לא נשלחה עליהן ברכה, ולמי שבתוך הכספים – הוראות קבע שלא נגבו החודש והוראות קבע שמסתיימות. כרטיס ירוק = אין מה לעשות. כשנשלחת ברכת "מזל טוב" מתוך המערכת, הבשורה מסומנת אוטומטית כ"נשלח".

# רישום תרומה בלי בקשה
1. נכנסים לכרטיס האדם (לשונית "אנשים") ולוחצים "💰 רישום תרומה", או בלשונית "כספים" / "תורמים" לוחצים "רישום תרומה".
2. בוחרים את התורם מהרשימה (או כותבים שם חדש), אופן התשלום והסכום. בהוראת קבע – הסכום החודשי, מספר החודשים וחודש ההתחלה.
3. שומרים. התרומה מופיעה בכספים, בתורמים, בקופה (כהכנסה) ובכרטיס האדם. גביית הוראת קבע מסמנים בלשונית "כספים" כרגיל.
לא רושמים מספרי כרטיס אשראי או חשבון בנק.

# טופס בקשה מהבית
אפשר לתת לציבור קישור, שבו ממלאים בקשת ברכה מהבית, בלי כניסה למערכת.
1. בלשונית "בקשות מהבית" מופיע הקישור. לוחצים "העתק קישור" ושולחים אותו (וואטסאפ, מייל, מודעה).
2. מי שממלא את הטופס – הפרטים מוצפנים כבר אצלו במחשב, ורק גבאים מאושרים יכולים לפתוח אותם. בשרת נשמר רק ג'יבריש.
3. בקשה שהגיעה מופיעה בלשונית "בקשות מהבית" (עם מספר אדום). בודקים ולוחצים "קלוט לרשימה" – היא נכנסת לבקשות עם סימון "לבדיקה". אם האדם כבר ביקר בעבר, המערכת מראה זאת ומשלימה את הפרטים החסרים. אפשר גם למחוק.
4. כדי לסגור את הטופס לציבור – מכבים בלשונית "ניהול" את "טופס בקשה מהבית". מי שייכנס לקישור יראה שהטופס סגור.

# קבלות על תרומות (סעיף 46)
1. פעם אחת: בלשונית "ניהול" ← "פרטי העמותה וקבלות" רושמים שם העמותה, מספר עמותה, עד מתי אישור סעיף 46 בתוקף, כתובת, טלפון, שם החותם, ואם רוצים – מאיזה מספר הקבלות מתחילות.
2. בלשונית "כספים", ליד כל תרומה חד־פעמית לוחצים "🧾 הפק קבלה". בהוראת קבע יש כפתור "🧾" לכל שנה – קבלה שנתית על כל החודשים שנגבו באותה שנה.
3. בחלון הקבלה רושמים את מספר הזהות (או ח״פ) של התורם. בלי זה התורם לא יקבל זיכוי ממס.
4. חשוב: מאז 1.1.2026 כל תרומה שמקבלת קבלה לפי סעיף 46 צריכה להיות מדווחת במערכת "תרומות ישראל" של רשות המסים, ומספר הדיווח צריך להופיע על הקבלה. מדווחים שם, מעתיקים את מספר הדיווח לשדה "מספר דיווח מרשות המסים", ואז מדפיסים או שולחים לתורם.
5. מספרי הקבלות רצים לבד ולא חוזרים על עצמם. קבלה שטעו בה – לוחצים עליה ← "ביטול קבלה". היא נשארת ביומן עם סימון "בוטלה" (ואם דווחה – מבטלים אותה גם אצל רשות המסים).
6. בתחתית לשונית "כספים" יש "יומן קבלות" עם כל הקבלות, ומי שעוד לא דווחו. אפשר להוריד אותו לאקסל בשביל רואה החשבון. גם ב"היום שלי" מופיעות קבלות שעוד לא דווחו.
בהוראת קבע: בשדה "מספר חודשים" אפשר לבחור מהרשימה (6, 12, 24...) או לכתוב כל מספר, ומתחת מופיע הסכום הכולל וחודש הסיום. אם משאירים ריק – ללא הגבלה.

# שליחת קבלה לתורם
אחרי שמפיקים קבלה, בחלון הקבלה יש "שליחה לתורם":
- "📧 מייל" – אם חובר EmailJS בניהול, נשלח ישירות. כדי שהקבלה תופיע מעוצבת בתוך המייל, בתבנית ב־EmailJS כותבים {{{message_html}}} (שלושה סוגריים). בלי EmailJS נפתחת תוכנת המייל עם הנוסח מוכן.
- "וואטסאפ" – נפתח וואטסאפ לנייד של התורם עם נוסח הקבלה (מספר, סכום, מספר דיווח).
- "⬇ הורד כתמונה" – הקבלה יורדת כתמונה, ואפשר לצרף אותה בוואטסאפ או במייל.
- "העתק נוסח" – להדבקה בכל מקום.

# צ׳קים
ברישום תרומה בצ׳ק (בבקשה או ב"רישום תרומה") רושמים תאריך פירעון, מספר צ׳ק ובנק. בלשונית "כספים" יש רשימת צ׳קים לפי תאריך: לוחצים "הופקד ✓" או "חזר". צ׳קים שמגיע זמנם (עד 3 ימים) מסומנים בצבע ומופיעים ב"היום שלי". לא רושמים מספר חשבון בנק.

# יעד גבייה חודשי
בלשונית "כספים" כותבים יעד גבייה חודשי ולוחצים "שמור יעד". פס ההתקדמות מופיע בכספים, במסך הראשי וב"היום שלי" (רק למי שנכנס לכספים). נספרות תרומות של החודש, הוראות קבע שנגבו החודש, וצ׳קים שזמן פירעונם החודש (חוץ מצ׳קים שחזרו).

# הוראת קבע שחזרה
בטבלת הגבייה בלשונית "כספים" לוחצים על משבצת החודש: לחיצה ראשונה ✓ (נגבה), שנייה "חזר" (החיוב לא עבר), שלישית מנקה. הוראות קבע שחזרו החודש או בחודש הקודם מופיעות ב"היום שלי" עם כפתור הודעה לתורם (נוסח "הוראת קבע שלא עברה").

# רשימות מיוחדות (שמות לתפילה)
בלשונית "שמות לתפילה", בתחתית, "רשימות מיוחדות":
- 🕯 ימי זיכרון בחודש עברי – בוחרים חודש, ומדפיסים רשימה של כל ימי הזיכרון בו לפי הסדר, עם שם המשפחה והטלפון.
- 📜 רשימה לאירוע – בוחרים או כותבים שם אירוע (ערב ראש השנה, הושענא רבה...), והרשימה מודפסת לפי הסינון שלמעלה (תאריכים, נושא) עם כותרת האירוע.

# מתי צריך את מפתח הארגון?
הבעלים לא צריך להקליד את המפתח: בכל מחשב או דפדפן חדש המערכת נפתחת לו אוטומטית דרך החשבון שלו. גבאים מאושרים נפתחים אוטומטית כשמנהל נכנס. את המפתח וקוד השחזור שומרים רק לגיבוי.

const DEF_HELP_EN=`# Welcome to the reception system
The system replaces the paper form "Blessing request from the Biala Rebbe shlita". Everything on the form is recorded here, and you can search, arrange a queue and prepare the names for the Rebbe.

# Language
The buttons at the top switch between עברית and English. Hebrew is the default. Names, requests and printed letters stay exactly as they were written.

# Signing in
With a shared server: click "Sign in with Google" and choose the account. Only people the manager added or approved can get in. Anyone not on the list sees "waiting for manager approval" and sees no data.
Without a server: choose your name from the list and type your personal password. Every request is recorded under the person who entered it.

# Users & permissions (Management)
In "Management" → "Users & permissions" you add a user (with a server: by Gmail address; without a server: name and personal password), approve join requests, block, remove and reset passwords.
There are four permissions: Manager — everything, including users and the log. Gabbai + finances — also finances and the cash box. Gabbai — receiving, editing, scanning and printing. View only — sees but does not change.
The first user you add is the manager, and there must always be at least one manager.
With a server there is also an "Owner" permission — only you. Only the owner can disable a user (and re-enable them) and temporarily disable the whole system: "Management" → "Users & permissions" → "Disable the system for everyone". While it is disabled no one but you can sign in or see data, and anyone signed in is signed out within about half a minute. Other managers can only add and remove users.

# Activity log (manager only)
Every sign-in and sign-out, new request, edit, status change, deletion, viewing a request, printing, Word and Excel downloads, opening finances, settings changes and failed sign-in attempts are recorded with the name, date and time.
You can filter by user, action and dates, and download to Excel. Failed attempts and deletions are marked in orange. The log cannot be deleted or changed.

# Receiving a new request
Click "New request" and fill it in by the order of the form. Next to every date the Hebrew date appears.
A date of birth can be written in Hebrew (e.g. ד׳ חשוון תשי״ז) or Gregorian (e.g. 25/04/1956). Gregorian is converted to Hebrew automatically.
When you type a mobile number that already exists, a "Previous visit found" message appears. Clicking "Fill in missing details" fills in everything known from the previous visit.
"Save & start new" saves and opens an empty form, handy when there is a pile of forms.

# Scanning a paper form
In a new request click "Scan paper form" and choose an image of the form. The system reads the handwriting and fills in the fields.
Fields that were unclear are marked in orange with "To review". The form image is shown next to the form and can be enlarged by clicking.
Important: always go over the fields and fix them before saving. Email addresses are corrected to the common form (e.g. @gmail.com), but check against the page.
Scanning needs a Gemini key, entered once in "Management" → "Automatic scanning".

# The "Scan pages" tab
A dedicated place for scanning. Click the big frame and choose one image or several at once (or drag them in).
Each page is read and saved automatically as a request, with the page image next to it. The list below shows the progress, and each page has an "Open to review" button.
If a page could not be read, click "Type by hand next to the image" and type it while looking at the page.

The system locks itself after 20 minutes without activity (can be turned off in Management). The ◐ button at the top switches between light and dark display.

# Quick search
At the top of the screen there is a search box. Type a name, surname or part of a phone number, and matching people (and contacts) appear right away. Enter or a click opens the person's card. Press / to jump to the search. If nothing is found, there is a "new request" button with the name you typed.

# Returning visitor detection
In a new request, when you type a phone or a first name and surname, the system checks whether the person visited before. If so, "This person seems to have visited before" appears with a "That's him – fill in details" button, which fills in all the details and the deceased from previous visits. The request itself is not copied.

# Good tidings
On a request screen click "🎉 Good tidings" and choose what happened (a child was born, a match was found, recovered...). All tidings are gathered in the "Good tidings" tab, with print and Word. You can send the person a mazal tov message with the "💬 Message" button.

# Waiting-room queue screen
In "Today's queue" click "📺 Waiting-room screen" and then "Full screen". Connect a computer or screen to the TV in the waiting room. It shows the number going in now and the next in line in large digits, without names (you can tick "show first name"). It updates by itself every few seconds.

# Names for prayer by topic
In "Names for prayer" the names are arranged by topic: health, match, livelihood etc. You can choose one topic, a date range, or "all together". There is copy, print and Word.

# Contacts
The "Contacts" tab is the center's phone book: donors, family members, suppliers, rabbis. You can link a contact to a person who visited, and then it appears on the person's card. Contacts also appear in quick search, and there is an Excel download.

# Sending messages: email, WhatsApp, SMS
Every request, person card, contact and donor has a "💬 Message" button. Choose a template (free message, donation thanks, receipt, standing order confirmation, renewal reminder, yahrzeit reminder, mazal tov), edit it, and choose how to send:
"Open in email" – opens your email program with the message ready.
"Send directly from the system" – appears only after connecting EmailJS in "Management".
"WhatsApp" – opens WhatsApp with the message to the mobile number (needs WhatsApp on the computer or phone).
"SMS" and "Copy".
Every message sent is recorded in the activity log.

# Donor management
The "Donors" tab (behind the finance password) gathers each donor in one place: total given, standing orders, until when, how many were collected, and the last donation. Filters: active standing orders, ending soon, ended, not collected this month, one-time. From each donor you can send thanks, a receipt or a renewal reminder. There is print and Excel download.

# Monthly report
"Monthly report" tab: choose a month and see how many requests, how many people (and how many new), reception days, good tidings, topics, statuses and who entered them. Anyone who opened finances also sees donations and collections. There is print and Word.

# Weekly automatic backup
For managers, once a week a backup file downloads by itself to the Downloads folder. In server mode the file is encrypted with the organization key, so even if it is lost it cannot be read. Restore in "Management" → "Restore from backup file". It can be turned off in the system options.

# Bulk scanning
In "Scan pages" you can upload many images together, a PDF from the scanner (each page is read separately), and also one image that contains several forms – the system recognizes each form, crops its image and saves it as a separate request for review.

# Install as an app
At the top of the screen there is a "📲 Install as app" button. Click and confirm. You get an icon on the desktop and in the Start menu, and the system opens in its own window. If the button does not work: in Chrome or Edge click the three dots at the top → "Install קבלת קהל".

# Encryption and the organization key
All data is encrypted on the computer before it leaves for the server, with the "organization key". The server only stores gibberish, and GitHub only holds the program, with no data at all. Even someone who reaches the server sees only gibberish.
On the first sign-in the owner sets the organization key (a phrase of at least 10 characters, Hebrew is fine) and receives a recovery code. Keep the code somewhere safe, for example print it.
A gabbai you approve does not need to know any key. They sign in with Google, and the first time their computer waits to be opened. It opens automatically as soon as a manager signs in. Each computer gets its own lock, which stays locked inside its browser and never leaves it. Anyone not approved, or disabled, gets no data from the server at all, and their computers' access is deleted.
When is the key needed? Almost never. Only if you (the owner) sign in from a new computer, or after clearing the browser data.
Forgot the key? On the key screen click "📧 I forgot the key – recover through my email" and choose a new key. It works only for the owner's account, and no data is deleted. You can also use the recovery code. Important: anyone who gets into your email can recover, so guard your email password well.

# Signing in with email and password
Anyone with Gmail signs in with the Google button and needs no password.
Without Gmail: type your email, type a password you choose (at least 8 characters) in the password field, and click "First time? Choose a password". You get an email to confirm, click the link, then sign in with the email and password.
Forgot your password? Type your email and click "I forgot my password". An email with a link to choose a new password arrives.
As with Google sign-in, only people you approved in the users list see any data.
In "Management" → "Data encryption" the owner can change the organization key (for example when a gabbai leaves) and create a new recovery code.

# My day
The "My day" tab gathers everything to handle today: who is waiting in the queue, yahrzeits today and tomorrow (with a button to send the family a reminder), requests to review, good tidings not yet congratulated, and – inside finances – standing orders not collected this month and standing orders that are ending. A green card means nothing to do. Sending a "Mazal tov" message from the system marks the tiding as sent.

# Recording a donation without a request
1. Open the person card ("People" tab) and click "💰 Record donation", or click "Record donation" in the "Finances" / "Donors" tab.
2. Pick the donor from the list (or type a new name), the payment method and amount. For a standing order – the monthly amount, number of months and start month.
3. Save. The donation appears in Finances, Donors, the Cash box (as income) and the person card. Mark standing-order collection in "Finances" as usual.
Do not record credit card or bank account numbers.

# Request form from home
You can give the public a link to fill in a blessing request from home, without signing in.
1. The link appears in the "Requests from home" tab. Click "Copy link" and send it (WhatsApp, email, a notice).
2. The details are encrypted on the sender's own computer, and only approved gabbaim can open them. The server only holds gibberish.
3. A new request appears in "Requests from home" (with a red number). Check it and click "Add to list" – it enters the requests marked "To review". If the person visited before, the system shows it and fills in missing details. You can also delete it.
4. To close the form to the public, turn off "Request form from home" in "Management". Anyone opening the link will see that the form is closed.

# Donation receipts (Section 46)
1. Once: in "Management" → "Organization details & receipts" enter the organization name, registration number, until when the Section 46 approval is valid, address, phone, signer, and optionally the first receipt number.
2. In "Finances", click "🧾 Issue receipt" next to each one-time donation. Standing orders have a "🧾" button per year – an annual receipt for all months collected that year.
3. In the receipt window enter the donor's ID (or company) number – without it the donor won't get a tax credit.
4. Important: since 1.1.2026 every donation receiving a Section 46 receipt must be reported in the Tax Authority's "Israel Donations" system, and the report number must appear on the receipt. Report there, copy the report number into "Tax Authority report number", then print or send to the donor.
5. Receipt numbers run automatically and never repeat. A wrong receipt – open it → "Cancel receipt". It stays in the log marked "cancelled" (if reported, cancel it at the Tax Authority too).
6. At the bottom of "Finances" there is a "Receipts log" with all receipts and those not yet reported; it can be downloaded to Excel for the accountant. "My day" also shows unreported receipts.
Standing orders: in "Number of months" pick from the list (6, 12, 24...) or type any number; the total and the last month appear below. Leave it empty for no limit.

# Sending a receipt to the donor
After issuing a receipt, the receipt window has "Send to donor": "📧 Email" (direct via EmailJS if connected – put {{{message_html}}} in the EmailJS template to show the designed receipt; otherwise opens your mail program), "WhatsApp" (opens WhatsApp to the donor's mobile with the receipt text), "⬇ Download as image" (attach it in WhatsApp or email), and "Copy text".

# Checks
When recording a check donation, enter the due date, check number and bank. "Finances" lists checks by date: click "Deposited ✓" or "Bounced". Checks due within 3 days are highlighted and appear in "My day". Do not enter bank account numbers.

# Monthly collection goal
In "Finances" type a monthly goal and click "Save goal". The progress bar appears in Finances, Home and "My day" (only for those inside finances). It counts this month's donations, standing orders collected this month, and checks due this month (except bounced ones).

# Bounced standing orders
In the collection table in "Finances" click a month cell: first click ✓ (collected), second "Bounced", third clears. Standing orders that bounced this month or last appear in "My day" with a message button for the donor.

# Special lists (names for prayer)
At the bottom of "Names for prayer", "Special lists": 🕯 yahrzeits in a Hebrew month (pick a month and print all yahrzeits in order with family and phone), and 📜 list for an event (pick or type an event – Erev Rosh Hashana, Hoshana Rabba… – printed by the filter above with the event title).

# Initial passwords
Login: 1234 · Finances: 123456 · Management: 123456. You can change them in "Management" → "Passwords". To change a code you must first type the current code, so even someone with manager permission cannot take over the system without knowing the codes. Only the owner (head manager) enters finances and management without a code, and can change a code without knowing the old one. (In server mode, each gabbai signs in with their own Google account.)`;

    $('#kGo').onclick=async()=>{const p1=normKey($('#k1').value);if(p1.length<10)return kErr('לפחות 10 תווים');if(p1!==normKey($('#k2').value))return kErr('המפתחות לא זהים');

/* החלפת מפתח / קוד שחזור חדש (בעלים, מלשונית ניהול) */
async function changeOrgKey(p1){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',DEK));const w1=await wrapDek(p1,raw);await putCMeta({...CMETA,salt:w1.salt,wrap:w1.wrap});log('הצפנה','מפתח הארגון הוחלף')}
async function newRecoveryCode(){const raw=new Uint8Array(await crypto.subtle.exportKey('raw',DEK)),code=genRecovery();const w2=await wrapDek(normCode(code),raw);await putCMeta({...CMETA,rsalt:w2.salt,rwrap:w2.wrap});log('הצפנה','נוצר קוד שחזור חדש');return code}
async function cloudPut(tbl,id,data){if(!DEK){toast('אין מפתח ארגון – הנתונים לא נשמרו');return false}data=await sealData(data);const {error}=await SB.from(tbl).upsert({id,data,updated_at:new Date().toISOString()});if(error){toast('השמירה בשרת נכשלה: '+error.message);return false}return true}
async function cloudDel(tbl,id){const {error}=await SB.from(tbl).delete().eq('id',id);if(error)toast('המחיקה בשרת נכשלה: '+error.message)}
async function putRec(o,quiet){o.updatedAt=Date.now();o.updatedBy=ME;const i=R.findIndex(r=>r.id===o.id);const prev=i>=0?R[i]:null;if(i>=0)R[i]=o;else R.push(o);
  if(!quiet)log(prev?(prev.status!==o.status&&JSON.stringify({...prev,status:o.status,updatedAt:0,updatedBy:0})===JSON.stringify({...o,updatedAt:0,updatedBy:0})?'שינוי סטטוס':'עריכת בקשה'):'בקשה חדשה',fullName(o),prev&&prev.status!==o.status?{status:STATUS[o.status]}:null);
  if(MODE==='cloud')await cloudPut('kk_records',o.id,o);else await idb.set('records',R)}
async function delRec(id){const x=R.find(r=>r.id===id);if(x)log('מחיקת בקשה',fullName(x));R=R.filter(r=>r.id!==id);if(MODE==='cloud')await cloudDel('kk_records',id);else await idb.set('records',R)}
async function putExp(o,quiet){if(!quiet)log('רישום בקופה',(o.kind==='in'?'הכנסה ':'הוצאה ')+(o.desc||''));const i=EXP.findIndex(r=>r.id===o.id);if(i>=0)EXP[i]=o;else EXP.push(o);if(MODE==='cloud')await cloudPut('kk_kupa',o.id,o);else await idb.set('kupa',EXP)}
async function delExp(id){log('מחיקה מהקופה',id);EXP=EXP.filter(r=>r.id!==id);if(MODE==='cloud')await cloudDel('kk_kupa',id);else await idb.set('kupa',EXP)}
async function putS(what){if(what)log('שינוי הגדרות',what);if(MODE==='cloud'){await cloudPut('kk_settings','main',S);ensureInboxKey().catch(()=>{})}else await idb.set('settings',S)}
/* טעינת טבלה: קודם בבת אחת; אם החיבור נכשל (למשל סינון שחוסם תשובה גדולה) – טוענים שורה אחרי שורה, כדי שכמה שיותר ייטען ונדע מה נחסם */
let LOADBAD=[];
async function fetchTable(tbl){
  try{const r=await SB.from(tbl).select('id,data');if(r.error)throw r.error;return r.data||[]}
  catch(e){const ids=await SB.from(tbl).select('id');if(ids.error){ids.error.message=tbl+': '+(ids.error.message||'');throw ids.error}const rows=[],bad=[];
    const q=[...(ids.data||[])];const work=async()=>{while(q.length){const {id}=q.shift();let ok=false;
      for(let t=0;t<2&&!ok;t++){try{const r=await SB.from(tbl).select('id,data').eq('id',id).maybeSingle();if(r.error)throw r.error;if(r.data)rows.push(r.data);ok=true}catch(x){await new Promise(z=>setTimeout(z,600))}}
      if(!ok)bad.push(id)}};
    await Promise.all([work(),work(),work()]);
    if(bad.length){LOADBAD.push(...bad.map(id=>tbl+':'+id));try{await SB.from('kk_log').insert({action:'שורות שלא נטענו',target:(tbl+': '+bad.join(',')).slice(0,200),details:{who:ME,first:String(e?.message||e).slice(0,120),ua:navigator.userAgent.slice(0,160)}})}catch(z){}}
    return rows}}
async function loadCloud(){LOADBAD=[];
  const [ad,bd,c]=await Promise.all([fetchTable('kk_records'),fetchTable('kk_kupa').catch(e=>{LOADBAD.push('kk_kupa:*');return []}),Promise.resolve(SB.from('kk_settings').select('data').eq('id','main').maybeSingle()).catch(e=>({data:null,error:e}))]);
  const a={data:ad},b={data:bd};
  const plain=[],respace=[],open=async(tbl,x)=>{const d=x.data||{};if(typeof d.enc!=='string')plain.push([tbl,x.id,d]);else if(!d.enc.includes(' '))respace.push([tbl,x.id]);try{return {...(await openData(d)),id:x.id}}catch(e){return null}};
  R=(await Promise.all((a.data||[]).map(x=>open('kk_records',x)))).filter(Boolean);EXP=(await Promise.all((b.data||[]).map(x=>open('kk_kupa',x)))).filter(Boolean);
  try{const cd=await fetchTable('kk_contacts');C=(await Promise.all(cd.map(x=>open('kk_contacts',x)))).filter(Boolean)}catch(e){C=C||[]}
  let sd=c.data?.data||null;if(sd){if(typeof sd.enc!=='string')plain.push(['kk_settings','main',sd]);else if(!sd.enc.includes(' '))respace.push(['kk_settings','main']);try{sd=await openData(sd)}catch(e){sd=null}}
  S=withDefaults(sd,DEFS);
  await loadInbox();
  /* נתונים ישנים שנשמרו לפני ההצפנה – מצפינים אותם עכשיו בשרת */
  if(DEK&&respace.length&&isAdm()){const byT={kk_records:R,kk_kupa:EXP,kk_contacts:C};let n=0;for(const [t,id] of respace){if(t==='kk_settings')continue;const o=(byT[t]||[]).find(x=>x.id===id);if(o){try{await cloudPut(t,id,o);n++}catch(e){}}}
    try{if(respace.some(([t])=>t==='kk_settings'))await cloudPut('kk_settings','main',S)}catch(e){}if(n)log('הצפנה',`${n} רשומות נשמרו מחדש בפורמט שעובר סינון`)}
  if(DEK&&plain.length&&canEdit()){for(const [t,id,d] of plain){await cloudPut(t,id,t==='kk_settings'?d:{...d,id})}log('הצפנה',`הוצפנו ${plain.length} רשומות ישנות בשרת`)}}
async function boot(){
  DEFS=await DEF_S();try{await idb.open()}catch(e){}
  const c=CONN();
  if(c.url&&c.key&&window.supabase){try{SB=supabase.createClient(c.url,c.key);MODE='cloud'}catch(e){SB=null}}
  if(MODE==='local'){S=withDefaults(await idb.get('settings'),DEFS);R=(await idb.get('records'))||[];EXP=(await idb.get('kupa'))||[];C=(await idb.get('contacts'))||[];LOG=(await idb.get('log'))||[]}
  else S=withDefaults(null,DEFS);
  $('#emailWrap').hidden=MODE!=='cloud';$('#gLogin').hidden=MODE!=='cloud';$('#gabbaiSel').hidden=MODE==='cloud';
  $('#pw').placeholder=T(MODE==='cloud'?'סיסמה':'סיסמת כניסה');
  fillGabbai();renderModebar();initGoogle();
  /* רענון אוטומטי כשעובדים כמה גבאים */
  if(MODE==='cloud'&&/^#bakasha/.test(location.hash)){renderPublicForm();return false}
  if(MODE==='cloud'){setInterval(()=>{if(!document.hidden&&!$('#app').hidden){grantDevices().catch(()=>{});if(view!=='new'&&view!=='edit')loadCloud().then(refresh).catch(()=>{})}},45000);
    setInterval(async()=>{if($('#app').hidden||isOwner()||!MYEMAIL)return;const [{data:sys},{data:me}]=await Promise.all([SB.from('kk_system').select('disabled,message').eq('id',1).maybeSingle(),SB.from('kk_users').select('active,blocked').eq('email',MYEMAIL).maybeSingle()]);
      const msg=sys?.disabled?(sys.message||'המערכת מושבתת זמנית.'):(!me||me.blocked||!me.active)?'המשתמש שלך הושבת. פנה לבעל המערכת.':'';if(msg){R=[];EXP=[];logout();$('#loginErr').textContent=T(msg)}},20000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#app').hidden)loadCloud().then(refresh).catch(()=>{})});
    if(/type=recovery/.test(location.hash)){await SB.auth.getSession();history.replaceState(null,'',location.pathname);newPasswordUI();return false}
    const {data}=await SB.auth.getSession();if(data?.session){history.replaceState(null,'',location.pathname+location.search);return await afterCloudAuth(data.session.user)}}
  return false}
function renderModebar(){$('#modebar').innerHTML=MODE==='cloud'?'':`<div>הנתונים נשמרים רק במחשב הזה. כדי שכל הגבאים יעבדו על אותם נתונים, מחברים שרת משותף בלשונית "ניהול".</div>`}

/* ===== כניסה והרשאות ===== */
let ME=ss.get('biala_me')||'', FIN=ss.get('biala_fin')==='1', ADM=ss.get('biala_adm')==='1';ROLE=ss.get('biala_role')||ROLE;

const isOwner=()=>ROLE==='owner', canFin=()=>['owner','admin','finance'].includes(ROLE), isAdm=()=>ROLE==='owner'||ROLE==='admin', canEdit=()=>ROLE!=='view';
let loginFails=0;
/* אחרי כניסה לשרת: בודקים שהמשתמש ברשימת המורשים */
async function afterCloudAuth(user){
  const email=(user.email||'').toLowerCase(),name=user.user_metadata?.full_name||user.user_metadata?.name||email.split('@')[0];
  let {data:u,error}=await SB.from('kk_users').select('*').eq('email',email).maybeSingle();
  if(error){showPending('אין חיבור לרשימת המשתמשים בשרת. ודא שקוד ההקמה הורץ ב־Supabase.',true);return false}
  if(!u){await SB.from('kk_users').insert({email,name,role:'gabbai',active:false});showPending(`נרשמת כ־${email}. הבקשה נשלחה למנהל המערכת, ותוכל להיכנס אחרי שיאשר אותך.`);return false}
  if(u.blocked){showPending('המשתמש שלך הושבת. פנה לבעל המערכת.');return false}
  if(!u.active){showPending(`החשבון ${email} עדיין ממתין לאישור מנהל המערכת.`);return false}
  if(u.role!=='owner'){const {data:sys}=await SB.from('kk_system').select('disabled,message').eq('id',1).maybeSingle();if(sys?.disabled){showPending(sys.message||'המערכת מושבתת זמנית.');return false}}
  MYEMAIL=email;ME=u.name||name;ROLE=u.role||'gabbai';
  if(!await ensureKey())return false;
  let lerr=null;for(let i=0;i<2;i++){try{await loadCloud();lerr=null;break}catch(x){lerr=x;await new Promise(r=>setTimeout(r,1500))}}
  if(lerr){const m=String(lerr?.message||lerr?.code||lerr||'');try{await SB.from('kk_log').insert({action:'שגיאה בטעינת נתונים',target:m.slice(0,200),details:{who:ME,code:lerr?.code||'',hint:String(lerr?.hint||lerr?.details||'').slice(0,200),ua:navigator.userAgent.slice(0,160)}})}catch(e){}
    showPending('אין גישה לנתונים: '+m+(/fetch|network|load/i.test(m)?' — ייתכן שהסינון (נטפרי וכדומה) חוסם את השרת במחשב הזה.':''),true);return false}
  grantDevices().catch(()=>{});escrowSave();ensureInboxKey().then(()=>loadInbox()).then(()=>{if(!$('#app').hidden)renderTabs()}).catch(()=>{});

function fixEmail(e){e=String(e||'').trim().replace(/\s+/g,'');if(!e)return'';if(!e.includes('@')&&/gmail|gmial|gmai/i.test(e))e=e.replace(/(gmail|gmial|gmai)\.?(com|co)?$/i,'@gmail.com');

async function shrink(file,max=1600,q=.85){const img=await createImageBitmap(file);const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return {blob:await new Promise(r=>c.toBlob(r,'image/jpeg',q)),url:c.toDataURL('image/jpeg',Math.min(q,.6))}}
const SCAN_PROMPT=`זו תמונה של טופס נייר בעברית בשם "בקשת ברכה מכ״ק מרן האדמו״ר מביאלא שליט״א", מולא בכתב יד.
קרא את כתב היד והחזר JSON בלבד, בלי טקסט נוסף, במבנה:
{"date":"YYYY-MM-DD או ריק","hebDate":"תאריך עברי כפי שנכתב או ריק","first":"","last":"","birth":"כפי שנכתב","prayName":"","spouseName":"","spouseBirth":"כפי שנכתב","address":"","city":"","zip":"","homePhone":"","mobile":"","work":"","workPhone":"","email":"","marital":"","children":"","deceased":[{"name":"","rel":"","date":""}],"request":"","unsure":["שמות השדות שלא היו ברורים"]}
כללים: אל תמציא. שדה ריק בטופס = מחרוזת ריקה. אם קראת חלקית — כתוב את הניחוש הטוב ביותר והוסף את שם השדה ל-unsure. מייל: השלם לפי הנפוץ (רוב המיילים נגמרים ב-@gmail.com) והוסף email ל-unsure אם ניחשת. מספרי טלפון ישראליים בפורמט 05X-XXXXXXX. "מצב משפחתי" כמו "נשוי + 4" → marital "נשוי", children "4". כתב בשוליים ליד "בקשה אישית" — צרף ל-request. תאריך הבקשה בראש הדף: אם לועזי — המר ל-YYYY-MM-DD; אם עברי — השאר date ריק ומלא hebDate.`;
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
const hasKey=()=>!!(S.geminiKey);
async function aiReadImage(blob,multi){
  if(!hasKey())throw {code:'no_key'};
  const model=(S.geminiModel||'gemini-3.8-flash').trim();
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.geminiKey.trim()},
    body:JSON.stringify({contents:[{parts:[{text:SCAN_PROMPT+(multi?SCAN_MULTI:'')},{inline_data:{mime_type:'image/jpeg',data:await blobToB64(blob)}}]}],generationConfig:{response_mime_type:'application/json',temperature:0.1}})}).catch(()=>{throw {code:'net'}});
  if(r.status===429)throw {code:'rate_limited'};
  if(!r.ok){let m='';try{m=(await r.json()).error?.message||''}catch(e){}throw {code:r.status===400||r.status===403?'bad_key':'api',message:m}}
  const j=await r.json();const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').replace(/^\s*```(json)?/,'').replace(/```\s*$/,'').trim();
  try{return JSON.parse(t)}catch(e){throw {code:'parse'}}}
/* קורא תמונה אחת ומחזיר רשומה (לא שמורה) */
async function scanToRecord(file){
  if(!hasKey())throw {code:'no_key'};
  const {blob,url}=await shrink(file);let scanUrl='';try{scanUrl=(await shrink(file,1100,.6)).url}catch(e){scanUrl=url}
  const res=await aiReadImage(blob);
  const pre={date:res.date&&/^\d{4}-\d\d-\d\d$/.test(res.date)?res.date:todayISO(),deceased:(res.deceased||[]).filter(d=>d&&(d.name||d.date)),donation:{type:'none'},status:'wait',tags:[],
    unsure:Array.isArray(res.unsure)?res.unsure.filter(k=>FL[k]):[],review:true,_scanData:url,_scanUrl:scanUrl,notes:res.hebDate?`תאריך בדף: ${res.hebDate}`:''};

const scanErr=e=>({no_key:'כדי לסרוק אוטומטית צריך להכניס פעם אחת מפתח Gemini בלשונית "ניהול".',bad_key:'מפתח ה־Gemini לא התקבל. בדוק אותו בלשונית "ניהול".',rate_limited:'יותר מדי סריקות ברצף. המתן דקה ונסה שוב.',net:'אין חיבור לאינטרנט, או שהשירות חסום בסינון.',parse:'הדף לא נקרא כראוי. נסה תמונה חדה יותר.'}[e?.code]||('הסריקה לא הצליחה. '+(e?.message||'נסה תמונה חדה ומוארת יותר.')));
async function scanForm(file){const msg=$('#scanMsg');

    renderForm(null,pre);if(extra)setTimeout(()=>toast(`בתמונה היו עוד ${extra} טפסים. הם נשמרו ברשימה עם סימון "לבדיקה".`),400);$('#scanMsg').innerHTML=`<div class="notice" style="margin-top:10px">הטופס נקרא. ${pre.unsure.length?`${pre.unsure.length} שדות מסומנים בכתום לבדיקה.`:'בדוק את כל השדות מול הדף לפני השמירה.'}</div>`}
  catch(e){msg.innerHTML=`<div class="notice" style="margin-top:10px">${scanErr(e)} אפשר להקליד ידנית.</div>`}}

function renderScan(){
  $('#main').innerHTML=`<section><h2>סריקת דפים</h2>
  <p class="muted">מעלים תמונה של טופס "בקשת ברכה" — אחד או כמה ביחד. המערכת קוראת את כתב היד, שומרת כל דף כבקשה ומסמנת בכתום מה שצריך לבדוק. תמונת הדף נשמרת ליד הבקשה ובכרטיס האדם.</p>
  ${hasKey()?'':'<div class="notice" style="margin:10px 0">הסריקה האוטומטית עוד לא מחוברת: מכניסים פעם אחת מפתח Gemini בלשונית "ניהול". עד אז אפשר להעלות תמונות ולהקליד את הפרטים ידנית ליד התמונה.</div>'}
  <label class="drop" id="drop" for="multiScan"><b>לחץ כאן לבחירת תמונות</b><span>או גרור לכאן תמונות או קובץ PDF מהסורק · אפשר הרבה דפים ביחד, וגם תמונה אחת עם כמה טפסים</span></label>
  <input type="file" id="multiScan" accept="image/*,application/pdf,.pdf" multiple hidden>
  <p class="small muted">טיפ: צלם כל דף לבד, מקרוב, באור טוב ובלי צל. דף ישר וחד נקרא הרבה יותר טוב.</p>
  <div class="queue" id="jobs"></div></section>`;
  const add=async files=>{for(const f of [...files]){if(f.type==='application/pdf'||/\.pdf$/i.test(f.name)){toast('פותח את קובץ ה־PDF…');try{(await pdfToImages(f)).forEach(p=>scanJobs.push({file:p,name:p.name,state:'wait'}))}catch(e){toast('לא הצלחתי לפתוח את ה־PDF')}}else if(f.type.startsWith('image/'))scanJobs.push({file:f,name:f.name,state:'wait'})}drawJobs();runJobs()};
  $('#multiScan').onchange=e=>add(e.target.files);
  const dz=$('#drop');['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));dz.addEventListener('drop',e=>add(e.dataTransfer.files));
  drawJobs();
}
function drawJobs(){const box=$('#jobs');if(!box)return;
  box.innerHTML=scanJobs.slice().reverse().map((j,i)=>`<div class="qi ${j.state==='done'?'':''}"><span class="no">${scanJobs.length-i}</span>
    <div><b>${j.rec?esc(fullName(j.rec)):esc(j.name)}</b><div class="small ${j.state==='err'?'':'muted'}" style="${j.state==='err'?'color:var(--bad)':''}">${j.state==='wait'?'ממתין בתור':j.state==='run'?'<span class="spin"></span> קורא את כתב היד...':j.state==='done'?(j.recs?.length>1?`נמצאו ונשמרו ${j.recs.length} טפסים בתמונה: ${j.recs.map(r=>esc(fullName(r))).join(', ')}`:`נשמר. ${j.rec.unsure?.length?j.rec.unsure.length+' שדות לבדיקה':'לבדוק מול הדף'}`):esc(j.err)}</div></div>
    <div class="row">${j.state==='done'?`<button class="btn sm warn" data-open="${j.rec.id}">פתח לבדיקה</button>`:''}${j.state==='err'&&j.url?`<button class="btn sm" data-manual="${i}">הקלד ידנית ליד התמונה</button>`:''}</div></div>`).join('');
  $$('#jobs [data-open]').forEach(b=>b.onclick=()=>go('edit',byId(b.dataset.open)));
  $$('#jobs [data-manual]').forEach(b=>b.onclick=()=>{const j=scanJobs[scanJobs.length-1-b.dataset.manual];pendingPre={date:todayISO(),deceased:[],donation:{type:'none'},status:'wait',tags:[],review:true,unsure:[],_scanData:j.url,_scanUrl:j.scanUrl||j.url};go('new')})}
let jobsRunning=false;
async function runJobs(){if(jobsRunning)return;jobsRunning=true;
  for(const j of scanJobs){if(j.state!=='wait')continue;j.state='run';drawJobs();
    try{const pres=await scanToRecords(j.file);for(const pre of pres){const o={...pre,id:newId(),createdAt:Date.now(),createdBy:ME+' (סריקה)',scanUrl:pre._scanUrl||pre._scanData};delete o._scanData;delete o._scanUrl;
      if(o.date===todayISO())o.queueNo=Math.max(0,...R.filter(r=>r.date===o.date).map(r=>r.queueNo||0))+1;
      await putRec(o);j.recs=(j.recs||[]).concat(o);j.rec=j.rec||o}j.state='done'}
    catch(e){j.state='err';j.err=scanErr(e);try{const s=await shrink(j.file,1100,.6);j.url=j.scanUrl=s.url}catch(_){}}
    drawJobs()}
  jobsRunning=false;renderTabs()}

/* ===== תצוגת בקשה ===== */

      ${x.deceased?.length?`<h3>לעילוי נשמת</h3><div class="tablewrap"><table><thead><tr><th>שם ושם האבא</th><th>קירבה</th><th>יום ושנה</th></tr></thead><tbody>${x.deceased.map(o=>`<tr><td>${esc(o.name)}</td><td>${esc(o.rel)}</td><td>${freeDate(o.date)}</td></tr>`).join('')}</tbody></table></div>`:''}

    </dl>
    <label class="f">שינוי סטטוס<select id="qs">${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${x.status===k?'selected':''}>${v}</option>`).join('')}</select></label>

  if($('#kv'))$('#kv').onclick=()=>{kvIdx=null;kvList=[x.id];go('kvittel')};
  if($('#tid'))$('#tid').onclick=()=>tidingForm(x,renderView);if($('#vMsg'))$('#vMsg').onclick=()=>compose({name:fullName(x),email:x.email,phone:x.mobile},x,x.tiding?'tiding':'free');

/* ===== כרטיס אדם — כל החומר במקום אחד ===== */
const personRecs=k=>R.filter(r=>personKey(r)===k).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
const uniq=a=>[...new Set(a.filter(Boolean))];
function personSummary(recs){const x={...recs[0]};FIELDS.forEach(([k])=>{if(!x[k]){const f=recs.find(r=>r[k]);if(f)x[k]=f[k]}});
  const dec={};recs.forEach(r=>(r.deceased||[]).forEach(d=>{const k=(d.name||'').trim();if(k&&!dec[k])dec[k]={...d}}));
  return {x,prayNames:uniq(recs.map(r=>r.prayName)),deceased:Object.values(dec),scans:recs.filter(r=>r.scanUrl).map(r=>({url:r.scanUrl,date:r.date,id:r.id})),
    dons:recs.filter(r=>r.donation&&r.donation.type&&r.donation.type!=='none'),review:recs.filter(r=>r.review).length}}
function openPerson(k){curPerson=k;go('person')}
function renderPerson(){const recs=personRecs(curPerson);if(!recs.length)return go('people');
  const P=personSummary(recs),x=P.x,first=recs[recs.length-1],last=recs[0];
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:'';
  $('#main').innerHTML=`<section>
  <div class="row"><button class="btn sm" id="back">→ לכל האנשים</button><span class="spacer"></span>
    <button class="btn" id="pNew">+ בקשה חדשה לאדם זה</button>${S.features.finance&&canFin()&&canEdit()?'<button class="btn gold" id="pDon">💰 רישום תרומה</button>':''}<button class="btn" id="pEdit">עריכת הפרטים</button>
    ${S.features.messages&&(x.email||x.mobile)?'<button class="btn" id="pMsg">💬 הודעה</button>':x.email?`<a class="btn" href="mailto:${esc(x.email)}">שלח מייל</a>`:''}<button class="btn gold" id="pPrint">הדפסה</button><button class="btn" id="pWord">פתח בוורד</button></div>
  <div class="pcard"><div><div class="pname">${esc(fullName(x))}</div><div class="muted">${esc(P.prayNames.join(' · '))}</div></div>
    <div class="pstats"><span><b>${recs.length}</b> ביקורים</span><span>ראשון: ${dual(first.date)}</span><span>אחרון: ${dual(last.date)}</span>${P.review?`<span class="pill rev">${P.review} לבדיקה</span>`:''}</div></div>
  <div class="view">
    <div class="card"><h3>כל הביקורים והבקשות</h3>
      <div class="timeline">${recs.map(r=>`<div class="tl ${r.review?'rev':''}"><div class="row"><b>${dual(r.date)}</b><span class="pill ${r.status}">${STATUS[r.status]||''}</span>${r.review?'<span class="pill rev">לבדיקה</span>':''}${(r.tags||[]).map(t=>`<span class="pill tag">${t}</span>`).join('')}<span class="spacer"></span><button class="btn sm" data-open="${r.id}">פתח</button></div>
        ${r.prayName?`<div><span class="muted small">שם לתפילה:</span> <b>${esc(r.prayName)}</b></div>`:''}
        <div class="req" style="margin-top:6px">${esc(r.request)||'<span class="muted">לא נרשמה בקשה</span>'}</div>
        ${r.deceased?.length?`<div class="small" style="margin-top:6px"><span class="muted">לעילוי נשמת:</span> ${r.deceased.map(d=>esc(d.name)).join(' · ')}</div>`:''}
        ${S.features.finance&&r.donation&&r.donation.type&&r.donation.type!=='none'?`<div class="small" style="margin-top:4px"><span class="muted">תרומה:</span> ${DON[r.donation.type]} ${FIN?money(r.donation.amount):''}</div>`:''}
        ${r.notes?`<div class="small muted" style="margin-top:4px">${esc(r.notes)}</div>`:''}</div>`).join('')}</div>
      ${S.features.finance&&FIN&&canFin()&&EXP.some(e=>isDonExp(e)&&e.pkey===curPerson)?`<h3>תרומות שנרשמו בלי בקשה</h3><table><tbody>${EXP.filter(e=>isDonExp(e)&&e.pkey===curPerson).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(e=>`<tr><td>${dual(e.date)}</td><td><span class="pill tag">${DON[e.don.type]}</span></td><td class="num">${money(e.don.amount)}${e.don.type==='standing'?' לחודש':''}</td></tr>`).join('')}</tbody></table>`:''}
      ${P.scans.length?`<h3>דפים סרוקים (${P.scans.length})</h3><div class="gallery">${P.scans.map(s=>`<figure><img src="${esc(s.url)}" alt="דף מתאריך ${esc(greg(s.date))}" data-big><figcaption>${dual(s.date)}</figcaption></figure>`).join('')}</div>`:''}
    </div>
    <div class="card"><h3>פרטים אישיים</h3><dl>
      ${row('שם',esc(fullName(x)))}${row('תאריך לידה',freeDate(x.birth))}${row('בן/בת זוג',esc(x.spouseName))}${row('לידת בן/בת זוג',freeDate(x.spouseBirth))}
      ${row('מצב משפחתי',esc([x.marital,x.children?x.children+' ילדים':''].filter(Boolean).join(', ')))}
      ${row('כתובת',esc([x.address,x.city,x.zip].filter(Boolean).join(', ')))}
      ${row('נייד',x.mobile?`<span class="ltr">${esc(x.mobile)}</span>`:'')}${row('טלפון בבית',x.homePhone?`<span class="ltr">${esc(x.homePhone)}</span>`:'')}
      ${row('מקום עבודה',esc([x.work,x.workPhone].filter(Boolean).join(' · ')))}${row('מייל',x.email?`<span class="ltr">${esc(x.email)}</span>`:'')}
    </dl>
    ${P.deceased.length?`<h3>לעילוי נשמת</h3><table><thead><tr><th>שם ושם האבא</th><th>קירבה</th><th>יום ושנה</th></tr></thead><tbody>${P.deceased.map(d=>{const k=daysUntil(hebDayMonth(d.date),30);return `<tr><td>${esc(d.name)}</td><td>${esc(d.rel)}</td><td>${freeDate(d.date)}${k>=0?`<div class="small" style="color:var(--warn)">${k===0?'היום':'בעוד '+k+' ימים'}</div>`:''}</td></tr>`}).join('')}</tbody></table>`:''}
    ${S.features.contacts?(()=>{const cs=(C||[]).filter(c=>c.person&&fold(c.person)===fold(fullName(x)));return cs.length?`<h3>אנשי קשר קשורים</h3><table><tbody>${cs.map(c=>`<tr><td><b>${esc(c.name)}</b> <span class="g">${esc(c.role||'')}</span></td><td class="ltr">${esc(c.phone||'')}</td></tr>`).join('')}</tbody></table>`:''})():''}
    ${recs.some(r=>r.tiding)&&S.features.tidings?`<h3>🎉 בשורות טובות</h3>${recs.filter(r=>r.tiding).map(r=>`<div class="small"><b>${esc(r.tiding.kind)}</b> · ${dual(r.tiding.date)} ${esc(r.tiding.text||'')}</div>`).join('')}`:''}
    ${S.features.finance&&P.dons.length?`<h3>תרומות</h3>${FIN?`<table><tbody>${P.dons.map(r=>`<tr><td>${dual(r.date)}</td><td>${DON[r.donation.type]}</td><td class="num">${money(r.donation.amount)}${r.donation.type==='standing'?' לחודש':''}</td></tr>`).join('')}</tbody></table><p class="small"><b>סה״כ חד־פעמי: ${money(P.dons.filter(r=>r.donation.type!=='standing').reduce((s,r)=>s+(+r.donation.amount||0),0))||'₪0'}</b></p>`:`<div class="lock">${P.dons.length} תרומות רשומות. הסכומים בסיסמת כספים.</div>`}`:''}
    </div></div></section>`;
  $('#back').onclick=()=>go('people');
  $$('[data-open]').forEach(b=>b.onclick=()=>go('view',byId(b.dataset.open)));
  $$('[data-big]').forEach(i=>i.onclick=()=>i.closest('figure').classList.toggle('big'));
  $('#pEdit').onclick=()=>go('edit',last);
  if($('#pDon'))$('#pDon').onclick=()=>donationForm({key:curPerson},renderPerson);
  $('#pNew').onclick=()=>{const p={date:todayISO(),donation:{type:'none'},status:'wait',tags:[]};FIELDS.forEach(([k])=>{if(k!=='request')p[k]=x[k]||''});p.deceased=P.deceased.map(d=>({...d}));pendingPre=p;go('new')};
  if($('#pMsg'))$('#pMsg').onclick=()=>compose({name:fullName(x),email:x.email,phone:x.mobile},x,'free');
  $('#pPrint').onclick=()=>saveDoc('כרטיס '+fullName(x),docPerson(curPerson),'print');
  $('#pWord').onclick=()=>saveDoc('כרטיס '+fullName(x),docPerson(curPerson),'word');
}

/* ===== מסמכים: וורד והדפסה ===== */

table{width:100%;border-collapse:collapse;margin:4px 0}td,th{border:1px solid #888;padding:5px 8px;text-align:right;vertical-align:top}th{background:#efe6d6}
td.l{color:#444;width:32%;background:#faf6ef}.big{font-size:17pt;font-weight:bold}.box{border:1px solid #888;padding:8px 10px;min-height:60px;white-space:pre-wrap}
.line{border-bottom:1px solid #000;min-width:160px;display:inline-block;height:1.2em}.pb{page-break-after:always}.foot{margin-top:28px;font-size:10pt;color:#555;text-align:center}

const DEF_TPL={thanks:`{תאריך}\n\nלכבוד\n{שם}\n{כתובת} {עיר}\n\nשלום וברכה,\n\nבשם מרכז חסידי ביאלא בני ברק, ברצוננו להודות לך מקרב לב על תרומתך הנדיבה בסך {סכום}.\n\nתרומתך מסייעת להחזקת המוסדות ולפעילות התורה והחסד.\n\nבברכה ובהוקרה,\nהנהלת המרכז`,

function fillPaper(){const t=docState.type,rec=byId(docState.rec),inRange=R.filter(r=>(!docState.from||r.date>=docState.from)&&(!docState.to||r.date<=docState.to));let h='';

const HEB_GREG_M=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

let logFilt={who:'',act:'',from:'',to:''},LOGC=[];
async function renderLog(){
  $('#main').innerHTML=`<section><div class="row"><h2>יומן פעולות</h2><span class="spacer"></span><button class="btn sm" id="lgCsv">הורד לאקסל</button><button class="btn sm" id="lgRef">רענן</button></div>
  <p class="muted">כל כניסה, קליטה, עריכה, מחיקה, צפייה, הדפסה ופתיחת כספים נרשמת כאן עם השם והשעה. אי אפשר למחוק או לשנות את היומן.</p>
  <div id="lgSum" class="stats"></div>
  <div class="toolbar"><select id="lgWho"><option value="">כל המשתמשים</option></select><select id="lgAct"><option value="">כל הפעולות</option></select>
    <label class="row small">מתאריך <input type="date" id="lgFrom" value="${logFilt.from}"></label><label class="row small">עד <input type="date" id="lgTo" value="${logFilt.to}"></label></div>
  <div class="tablewrap"><table class="wide"><thead><tr><th>מתי</th><th>מי</th><th>פעולה</th><th>על מה</th></tr></thead><tbody id="lgRows"><tr><td colspan="4" class="empty"><span class="spin"></span></td></tr></tbody></table></div><p class="muted small" id="lgCnt"></p></section>`;
  if(MODE==='cloud'){const {data,error}=await SB.from('kk_log').select('*').order('at',{ascending:false}).limit(2000);
    if(error){$('#lgRows').innerHTML=`<tr><td colspan="4" class="empty">לא ניתן לטעון את היומן: ${esc(error.message)}</td></tr>`;return}
    LOGC=await Promise.all(data.map(async r=>{let tg=r.target||'',dt=r.details;try{if(tg.startsWith('enc:'))tg=await decStr(tg.slice(4))}catch(e){tg='🔒'}try{if(dt&&typeof dt.enc==='string')dt={...JSON.parse(await decStr(dt.enc)),who:dt.who}}catch(e){}return {at:r.at,who:r.details?.who||r.email,email:r.email,action:r.action,target:tg,details:dt}}))}
  else LOGC=[...LOG].reverse();
  const opt=(sel,arr,cur)=>{$(sel).innerHTML+=arr.map(v=>`<option ${v===cur?'selected':''}>${esc(v)}</option>`).join('')};
  opt('#lgWho',[...new Set(LOGC.map(l=>l.who))].sort(),logFilt.who);opt('#lgAct',[...new Set(LOGC.map(l=>l.action))].sort(),logFilt.act);
  const today=todayISO(),dayOf=l=>{const d=new Date(l.at);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
  const t=LOGC.filter(l=>dayOf(l)===today);
  $('#lgSum').innerHTML=`<div class="stat"><b>${new Set(t.filter(l=>l.action==='כניסה למערכת').map(l=>l.who)).size}</b><span>נכנסו היום</span></div><div class="stat"><b>${t.length}</b><span>פעולות היום</span></div>
    <div class="stat"><b>${t.filter(l=>/בקשה חדשה/.test(l.action)).length}</b><span>בקשות שנקלטו היום</span></div><div class="stat ${LOGC.some(l=>/שגויה|נכשל/.test(l.action)&&dayOf(l)===today)?'alert':''}"><b>${t.filter(l=>/שגויה|נכשל/.test(l.action)).length}</b><span>ניסיונות כושלים היום</span></div>`;
  const fill=()=>{const L=LOGC.filter(l=>(!logFilt.who||l.who===logFilt.who)&&(!logFilt.act||l.action===logFilt.act)&&(!logFilt.from||dayOf(l)>=logFilt.from)&&(!logFilt.to||dayOf(l)<=logFilt.to));
    $('#lgRows').innerHTML=L.slice(0,800).map(l=>{const d=new Date(l.at);return `<tr class="${/שגויה|נכשל|מחיקת|חסימת/.test(l.action)?'rev':''}"><td>${dual(dayOf(l))} <span class="num">${d.toTimeString().slice(0,5)}</span></td><td><b>${esc(l.who)}</b>${l.email&&l.email!==l.who?`<div class="g ltr">${esc(l.email)}</div>`:''}</td><td>${esc(l.action)}${l.details?.status?` <span class="g">→ ${esc(l.details.status)}</span>`:''}</td><td>${esc(l.target)}</td></tr>`}).join('')||'<tr><td colspan="4" class="empty">אין פעולות לפי הסינון</td></tr>';
    $('#lgCnt').textContent=`מוצגות ${Math.min(L.length,800)} מתוך ${L.length} פעולות`;return L};
  [['#lgWho','who'],['#lgAct','act'],['#lgFrom','from'],['#lgTo','to']].forEach(([id,k])=>$(id).onchange=e=>{logFilt[k]=e.target.value;fill()});
  $('#lgRef').onclick=renderLog;
  $('#lgCsv').onclick=()=>{const L=fill();const csv=[['תאריך','שעה','מי','מייל','פעולה','על מה'],...L.map(l=>{const d=new Date(l.at);return [greg(dayOf(l)),d.toTimeString().slice(0,5),l.who,l.email||'',l.action,l.target]})].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    downloadBlob(`יומן-פעולות-${fileStamp()}.csv`,new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));log('הורדת יומן הפעולות')};
  fill()}

create table if not exists kk_users (email text primary key, name text, role text not null default 'gabbai', active boolean not null default false, blocked boolean not null default false, created_at timestamptz default now(), last_login timestamptz);
