<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4a2410">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="crest.webp">
<link rel="apple-touch-icon" href="crest.webp">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>קבלת קהל ביאלה</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap">
<style>
/* פריסה: פס עליון מהגוני עם הכתר ולשוניות; אזור עבודה עם הכתר כסימן מים; תאריך עברי ראשי, לועזי קטן לידו */
:root{
  --bg:#f3efe8; --panel:#fffdf9; --ink:#2b1d12; --muted:#76624f; --line:#e1d6c6;
  --wood:#4a2410; --wood2:#6b3416; --gold:#b8862b; --gold-soft:#f1e3c2;
  --ok:#2f6b3a; --warn:#c2620a; --warn-soft:#fde8d2; --bad:#9b2c1e; --field:#fff;
  --display:"Frank Ruhl Libre","David",serif; --body:"Assistant","Arial",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b130d; --panel:#251a12; --ink:#f1e6d6; --muted:#b9a58e; --line:#3d2c1f;
  --wood:#2e160a; --wood2:#4a2410; --gold:#d6a84a; --gold-soft:#3a2a14;
  --ok:#7fc28a; --warn:#f0a050; --warn-soft:#3d2610; --bad:#e08070; --field:#1f160f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b130d; --panel:#251a12; --ink:#f1e6d6; --muted:#b9a58e; --line:#3d2c1f;
  --wood:#2e160a; --wood2:#4a2410; --gold:#d6a84a; --gold-soft:#3a2a14;
  --ok:#7fc28a; --warn:#f0a050; --warn-soft:#3d2610; --bad:#e08070; --field:#1f160f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#login{min-height:100vh;display:grid;place-items:center;padding-block:32px;background:radial-gradient(ellipse at top,#6b3416,#3a1a08 70%)}
.login-card{width:min(400px,100%);text-align:center;color:#f6ead2;display:grid;gap:12px}
.login-card img{width:min(300px,80%);margin:0 auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.login-card h1{font-family:var(--display);font-weight:900;font-size:2rem;margin:0}
.login-card p{margin:0;color:#d9c39b}
.login-card input,.login-card select{background:rgba(255,255,255,.08);border:1px solid #8a6a3a;color:#fff;border-radius:10px;padding:12px 14px;text-align:center;font-size:1.1rem}
.login-card select option{color:#222}
.login-card .err{color:#ffb4a6;min-height:1.5em}

header.top{background:linear-gradient(180deg,var(--wood2),var(--wood));color:#f6ead2;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.25)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wood2)}
.top-in{max-width:1280px;margin:0 auto;padding-block:6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top-in img{height:44px}
.brand{display:grid;line-height:1.15}
.brand b{font-family:var(--display);font-size:1.2rem}
.brand span{font-size:.78rem;color:#d9c39b}
.who{font-size:.8rem;color:#d9c39b;margin-inline-start:auto;white-space:nowrap}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;width:100%;padding-bottom:4px}
nav.tabs button{background:none;border:0;color:#e9d7b5;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.95rem;display:inline-flex;gap:6px;align-items:center}
nav.tabs button[aria-current="true"]{background:var(--gold);color:#2b1606}
nav.tabs button:hover:not([aria-current="true"]){background:rgba(255,255,255,.08)}
nav.tabs .badge{background:var(--warn);color:#fff;border-radius:99px;font-size:.72rem;padding:0 6px}
.modebar{max-width:1280px;margin:8px auto 0;font-size:.85rem}
.modebar div{background:var(--warn-soft);border:1px solid var(--warn);border-radius:9px;padding:6px 12px}
main{position:relative;max-width:1280px;margin:0 auto;padding-block:18px 70px}
.watermark{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0}
.watermark img{width:min(640px,80vw);opacity:.07}
main>section{position:relative;z-index:1}

h2{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--gold)}
a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--wood2);border-color:var(--wood2);color:#fbefd6}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b1606}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.86rem}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:default}
.stat.link{cursor:pointer}.stat.link:hover{border-color:var(--gold)}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.88rem}
.stat.alert{border-color:var(--warn);background:var(--warn-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.toolbar input[type=search]{flex:1;min-width:200px}

.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
table.wide{min-width:760px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;color:var(--muted);font-weight:700;background:var(--gold-soft);white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:color-mix(in srgb,var(--gold-soft) 55%,transparent)}
tr.rev td:first-child{box-shadow:inset -4px 0 0 var(--warn)}
td.num,.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.pill.wait{color:var(--warn)} .pill.in{color:var(--gold)} .pill.done{color:var(--ok)}
.pill.rev{color:#fff;background:var(--warn);border-color:var(--warn)}
.pill.tag{color:var(--wood2);border-style:dashed}
:root[data-theme="dark"] .pill.tag{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.tag{color:var(--gold)}}
.g{font-size:.74rem;color:var(--muted);font-weight:400}
.hd{font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}

.form{display:grid;gap:14px}
.formwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.formwrap.withimg{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:900px){.formwrap.withimg{grid-template-columns:1fr}}
.scanimg{position:sticky;top:120px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.scanimg img{width:100%;border-radius:6px;cursor:zoom-in}
.scanimg img.big{cursor:zoom-out}
fieldset{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 16px 16px;margin:0;min-width:0}
legend{font-family:var(--display);font-weight:700;font-size:1.08rem;padding:0 8px;color:var(--wood2)}
:root[data-theme="dark"] legend{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) legend{color:var(--gold)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.grid .wide{grid-column:1/-1}
label.f{display:grid;gap:3px;font-size:.86rem;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-weight:400;font-size:1rem;width:100%}
label.f textarea{min-height:84px;resize:vertical}
label.f.unsure input,label.f.unsure textarea{border:2px solid var(--warn);background:var(--warn-soft)}
label.f.unsure::after{content:"לבדיקה — לא ברור בכתב היד";color:var(--warn);font-size:.74rem}
.hint{font-size:.76rem;color:var(--gold);font-weight:600;min-height:1.1em}
input[dir="ltr"]{text-align:left}
.dec-row{display:grid;grid-template-columns:2fr 1fr 1.3fr auto;gap:8px;align-items:end;margin-bottom:8px}
@media (max-width:560px){.dec-row{grid-template-columns:1fr 1fr}.dec-row .rm{grid-column:1/-1}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{border:1px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer;font-size:.9rem;background:var(--field)}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--gold);border-color:var(--gold);color:#2b1606;font-weight:700}
.chips label:has(input:focus-visible){outline:2px solid var(--gold)}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding-block:10px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);z-index:3}
.notice{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:10px 12px}
.notice.info{background:var(--gold-soft);border-color:var(--gold)}
.lock{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:10px;padding:10px 12px;font-size:.9rem}

.view{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.view{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
dt{color:var(--muted);font-size:.86rem}
dd{margin:0;overflow-wrap:anywhere}
dd.unsure{color:var(--warn);font-weight:700}
.req{background:var(--gold-soft);border-radius:10px;padding:12px 14px;white-space:pre-wrap;font-size:1.05rem}
.confirm{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border:1px solid var(--bad);border-radius:10px;padding:10px 12px}

/* קוויטל — מסך גדול */
.kv{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:clamp(18px,4vw,44px);text-align:center;display:grid;gap:18px;min-height:60vh;align-content:center}
.kv .nm{font-family:var(--display);font-weight:900;font-size:clamp(2rem,6vw,4rem);line-height:1.2}
.kv .rq{font-size:clamp(1.2rem,3vw,1.9rem);white-space:pre-wrap}
.kv .sub{color:var(--muted);font-size:1.05rem}
.kv .dec{font-family:var(--display);font-size:1.3rem}

.queue{display:grid;gap:8px}
.qi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.qi .no{font-family:var(--display);font-weight:900;font-size:1.6rem;color:var(--gold);min-width:2.2ch;text-align:center}
.qi.cur{border:2px solid var(--gold);background:var(--gold-soft)}
.qi.done{opacity:.55}

.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:90px 1fr 90px;gap:8px;align-items:center;font-size:.88rem}
.bar i{display:block;height:14px;border-radius:4px;background:var(--gold)}
.bar i.out{background:var(--bad)}
.help{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;max-width:78ch}
.help h3{margin-top:14px}
.help p{margin:6px 0}
.drop{display:grid;place-items:center;gap:6px;text-align:center;border:2px dashed var(--gold);border-radius:16px;padding:44px 16px;background:var(--panel);cursor:pointer;margin:14px 0 6px}
.drop b{font-family:var(--display);font-size:1.4rem;color:var(--wood2)}.drop span{color:var(--muted)}.drop.over,.drop:hover{background:var(--gold-soft)}
:root[data-theme="dark"] .drop b{color:var(--gold)}
.pcard{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--gold-soft),var(--panel));border:1px solid var(--gold);border-radius:14px;padding:16px 18px;margin:14px 0}
.pname{font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15}
.pstats{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.92rem}.pstats b{font-family:var(--display);font-size:1.3rem}
.timeline{display:grid;gap:10px}.tl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}.tl.rev{border-color:var(--warn)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gallery figure{margin:0;display:grid;gap:4px}
.gallery img{width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}.gallery figure.big{grid-column:1/-1}.gallery figure.big img{cursor:zoom-out}
.gallery figcaption{font-size:.8rem;text-align:center}
.docs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;margin-top:12px}@media (max-width:820px){.docs{grid-template-columns:1fr}}
.doclist{gap:4px;padding:8px}.doclist button{background:none;border:0;text-align:right;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.doclist button:hover{background:var(--gold-soft)}.doclist button.on{background:var(--wood2);color:#fbefd6}
.edbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px}
.edbar>button:not(.btn){border:1px solid var(--line);background:var(--field);border-radius:6px;padding:3px 10px;cursor:pointer}
.paper{background:#fff;color:#000;border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:clamp(14px,4vw,40px);min-height:70vh;overflow-x:auto;outline:none}
.paper:focus{box-shadow:0 0 0 2px var(--gold),0 4px 18px rgba(0,0,0,.12)}

.langsw{display:inline-flex;border:1px solid #8a6a3a;border-radius:9px;overflow:hidden;flex:none}
.langsw button{background:transparent;color:#e9d7b5;border:0;padding:4px 10px;cursor:pointer;font-weight:700;font-size:.85rem}
.langsw button[aria-pressed="true"]{background:var(--gold);color:#2b1606}
.login-card .langsw{justify-self:center}
html[dir=ltr] body{direction:ltr}
html[dir=ltr] th,html[dir=ltr] td,html[dir=ltr] .doclist button{text-align:left}
html[lang=en] label.f.unsure::after{content:"To review — unclear handwriting"}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:10px;padding:11px 14px;font-weight:700;font-size:1.05rem;cursor:pointer}
.gbtn:hover{background:#f3f3f3}.or{color:#d9c39b;font-size:.85rem;text-align:center}
.sysbox{display:flex;flex-wrap:wrap;gap:10px;align-items:end;border:2px solid var(--ok);border-radius:12px;padding:12px 14px;margin-bottom:12px}.sysbox.off{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--panel))}
.gwrap{display:grid;justify-items:center;gap:6px;min-height:44px}
.pending{background:#fff6e5;color:#4a2410;border-radius:10px;padding:12px;display:grid;gap:8px;text-align:center}.pending.bad{background:#ffe3df}
#usersIn select,#usersIn input:not([type=checkbox]){background:var(--field);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--ink)}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--wood);color:#fbefd6;padding:10px 18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:20;max-width:90vw}
textarea.code{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:.8rem;direction:ltr;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink)}
.keybox{display:grid;gap:8px;text-align:right}.keybox h3{margin:0;text-align:center}.keybox .small{line-height:1.7}.reccode{font:700 20px monospace;letter-spacing:1px;background:#fff8e6;border:2px dashed #c9a227;border-radius:8px;padding:12px;text-align:center;user-select:all;color:#222}
.pwlinks{font-size:13px;text-align:center}.pwlinks a{color:inherit;text-decoration:underline;cursor:pointer}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>


<div id="login" class="gut">
  <form class="login-card" id="loginForm">
    <div class="langsw" data-noi18n role="group" aria-label="Language / שפה"><button type="button" data-lang="he">עברית</button><button type="button" data-lang="en">English</button></div>
    <img src="crest.webp" alt="כתר ביאלה">
    <h1>מערכת קבלת קהל</h1>
    <p>מרכז חסידי ביאלא בני ברק</p>
    <div id="gLogin" hidden class="gwrap"><div id="gBtn"></div><div id="gMsg" class="or"></div></div>
    <div id="emailWrap" hidden style="display:grid;gap:8px"><div class="or">או עם מייל וסיסמה</div><input id="em" type="email" dir="ltr" placeholder="כתובת מייל" aria-label="כתובת מייל" autocomplete="username"><div class="pwlinks"><a href="#" id="pwFirst">כניסה ראשונה? בחירת סיסמה</a> · <a href="#" id="pwForgot">שכחתי סיסמה</a></div></div>
    <input id="pw" type="password" placeholder="סיסמת כניסה" aria-label="סיסמה" autocomplete="current-password">
    <select id="gabbaiSel" aria-label="מי נכנס"></select>
    <button class="btn gold" type="submit">כניסה</button>
    <div class="err" id="loginErr"></div>
    <div id="pendingBox" hidden class="pending"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="top-in gut">
    <img src="crest.webp" alt="">
    <div class="brand"><b>קבלת קהל</b><span>מרכז חסידי ביאלא בני ברק</span></div>
    <span class="who" id="who"></span><div class="langsw" data-noi18n role="group" aria-label="Language / שפה"><button type="button" data-lang="he">עברית</button><button type="button" data-lang="en">English</button></div><button class="btn sm" id="themeBtn" style="background:transparent;color:#e9d7b5;border-color:#8a6a3a" aria-label="מצב תצוגה">◐</button>
    <nav class="tabs" id="tabs"></nav>
  </div></header>
  <div class="modebar gut" id="modebar"></div>
  <div class="watermark"><img src="crest.webp" alt=""></div>
  <main id="main" class="gut"></main>
</div>
<div id="toast" hidden></div>

<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});</script>
<script>
/* ===== כלים ===== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

# שפה
הכפתורים למעלה מחליפים בין עברית ל־English. ברירת המחדל היא עברית. שמות, בקשות ומכתבים להדפסה נשארים כמו שנכתבו.

# כניסה
עם שרת משותף: לוחצים "כניסה עם Google" ובוחרים את החשבון. רק מי שהמנהל הוסיף או אישר יכול להיכנס. מי שלא ברשימה רואה "ממתין לאישור מנהל" ולא רואה שום נתון.
בלי שרת: בוחרים את השם מהרשימה ומקלידים את הסיסמה האישית. כל בקשה שנקלטת נרשמת על שם מי שהכניס אותה.

# משתמשים והרשאות (ניהול)
בלשונית "ניהול" ← "משתמשים והרשאות" מוסיפים משתמש (עם שרת: לפי כתובת Gmail; בלי שרת: שם וסיסמה אישית), מאשרים בקשות הצטרפות, חוסמים, מסירים ומאפסים סיסמה.
יש ארבע הרשאות: מנהל — הכל, כולל משתמשים ויומן. גבאי + כספים — גם כספים וקופה. גבאי — קליטה, עריכה, סריקה והדפסה. צפייה בלבד — רואה ולא משנה.
המשתמש הראשון שמוסיפים הוא המנהל, ותמיד חייב להישאר לפחות מנהל אחד.
עם שרת יש גם הרשאת "בעלים" — רק לך. רק הבעלים יכול להשבית משתמש (וגם להפעיל אותו מחדש) ולהשבית את כל המערכת זמנית: בלשונית "ניהול" ← "משתמשים והרשאות" ← "השבת את המערכת לכולם". כשהמערכת מושבתת אף אחד חוץ ממך לא נכנס ולא רואה נתונים, ומי שהיה מחובר נזרק תוך כחצי דקה. מנהלים אחרים יכולים רק להוסיף ולהסיר משתמשים.

# יומן פעולות (מנהל בלבד)
כל כניסה ויציאה, בקשה חדשה, עריכה, שינוי סטטוס, מחיקה, צפייה בבקשה, הדפסה, הורדה לוורד ולאקסל, פתיחת כספים, שינוי הגדרות וניסיון כניסה שנכשל — נרשמים עם השם, התאריך והשעה.
אפשר לסנן לפי משתמש, פעולה ותאריכים, ולהוריד לאקסל. ניסיונות כושלים ומחיקות מסומנים בכתום. אי אפשר למחוק או לשנות את היומן.

# קליטת בקשה חדשה
לוחצים על "בקשה חדשה" וממלאים לפי הסדר של הטופס. ליד כל תאריך מופיע התאריך העברי.
תאריך לידה אפשר לכתוב בעברי (למשל: ד׳ חשוון תשי״ז) או בלועזי (למשל: 25/04/1956). לועזי מומר לעברי אוטומטית.
כשמקלידים מספר נייד שכבר קיים במערכת, מופיעה הודעה "נמצא ביקור קודם". לחיצה על "מלא פרטים" ממלאת את כל מה שידוע מהביקור הקודם.
"שמור והתחל חדשה" שומר ופותח טופס ריק, נוח כשיש ערימה של טפסים.

# סריקת טופס נייר
בטופס בקשה חדשה לוחצים "סרוק טופס נייר" ובוחרים תמונה של הטופס. המערכת קוראת את כתב היד וממלאת את השדות.
שדות שלא היו ברורים מסומנים בכתום עם הכיתוב "לבדיקה". תמונת הטופס מוצגת ליד הטופס, ואפשר להגדיל אותה בלחיצה.
חשוב: תמיד לעבור על השדות ולתקן לפני השמירה. כתובות מייל מתוקנות לפי הנפוץ (למשל ‎@gmail.com‎), אבל יש לוודא מול הדף.
הסריקה צריכה מפתח Gemini, שמכניסים פעם אחת בלשונית "ניהול" ← "סריקה אוטומטית".

# לשונית "סריקת דפים"
מקום מיוחד לסריקה. לוחצים על המסגרת הגדולה ובוחרים תמונה אחת או כמה תמונות ביחד (או גוררים אותן פנימה).
כל דף נקרא ונשמר אוטומטית כבקשה, עם תמונת הדף לידו. ברשימה שמתחת רואים את ההתקדמות, ולכל דף כפתור "פתח לבדיקה".
אם דף לא נקרא, אפשר ללחוץ "הקלד ידנית ליד התמונה" ולהקליד מול הדף.

# כרטיס אדם — כל החומר במקום אחד
בלשונית "אנשים" לוחצים על שם, ונפתח כרטיס עם הכל: פרטים אישיים, כל הביקורים והבקשות לפי תאריכים, כל השמות לתפילה, הנפטרים וימי הזיכרון הקרובים, התרומות (בסיסמת כספים) וכל הדפים הסרוקים שלו.
מכל בקשה אפשר להגיע לכרטיס בכפתור "כרטיס אדם מלא".
"בקשה חדשה לאדם זה" פותח טופס שכבר מולאו בו כל הפרטים, ונשאר רק לכתוב את הבקשה.

# מסמכים, וורד והדפסות
בלשונית "מסמכים והדפסות" בוחרים מסמך: טופס בקשה ריק, טופס ממולא, כרטיס אדם, קוויטלים (דף לכל בקשה), רשימת שמות, תור היום, דוח לתקופה, מדבקות כתובת, מכתב חופשי, מכתב תזכורת יום זיכרון, ובסיסמת כספים גם מכתב תודה, קבלה ואישור הוראת קבע.
המסמך מופיע כדף לבן. אפשר לכתוב ולשנות בו כל דבר, להדגיש ולהגדיל.
"הורד לוורד" שומר קובץ שנפתח ב־Word לעריכה נוספת. "הדפס" פותח מיד את חלון ההדפסה (שם אפשר גם לשמור כ־PDF).
כפתורי הדפסה ווורד יש גם בתוך כל בקשה, בכרטיס אדם, ברשימת השמות ובתור.
את נוסחי המכתבים עורכים בלשונית "ניהול".

# בקשות שמסומנות "לבדיקה"
בקשה שנסרקה או שפוענחה מכתב יד מסומנת בפס כתום ובתווית "לבדיקה". נכנסים לבקשה, לוחצים "עריכה", מתקנים ולוחצים "סמן כנבדק".

# תור קבלת קהל
בלשונית "תור היום" מופיעים כל מי שנקלטו היום לפי מספר. "הבא בתור" מסמן את הבא כמי שנכנס לאדמו״ר.

# מסך קוויטל
מציג בקשה אחת באותיות גדולות: השם לתפילה, הבקשה והנפטרים. מעבר בין בקשות בחצים. מתאים להראות לאדמו״ר או לגבאי שבפנים.

# רשימת שמות לתפילה
מרכזת את כל השמות לתפילה בקברי צדיקים ואת שמות הנפטרים לפי טווח תאריכים. כפתור "העתק" מעתיק את הרשימה, ויש גם הדפסה ווורד.

# כספים (סיסמה נוספת)
פרטי התרומות וסכומים מוסתרים מכל מי שאין לו סיסמת כספים. בלי הסיסמה רואים רק שיש תרומה, בלי סכום.
בלשונית "כספים" רואים תרומות, הוראות קבע, ומסמנים כל חודש אם הוראת הקבע נגבתה.
"קופה" מאפשרת לרשום הכנסות והוצאות של המשרד ולראות סיכום לפי חודשים.
לא רושמים במערכת מספרי כרטיס אשראי או חשבון בנק.

# ימי זיכרון וימי הולדת
המערכת מחשבת לפי הלוח העברי מי שיום הזיכרון או יום ההולדת שלו בשבועיים הקרובים.

# ניהול (סיסמת מנהל)
משתמשים והרשאות, החלפת סיסמאות הכספים והניהול, הפעלה וכיבוי של כל אפשרות במערכת, עריכת ההוראות האלה, עריכת נוסחי המכתבים, מפתח הסריקה, חיבור לשרת משותף, גיבוי ושחזור, והורדה לאקסל.

# איפה הנתונים נשמרים
בלי חיבור לשרת: הנתונים נשמרים רק במחשב שעליו עובדים. חובה להוריד קובץ גיבוי פעם בשבוע (ניהול ← "הורד קובץ גיבוי").
עם חיבור לשרת משותף (ניהול ← "חיבור לשרת משותף"): כל הגבאים עובדים על אותם נתונים מכל מחשב, וכל גבאי נכנס עם מייל וסיסמה משלו.

# אקסל וגיבוי
"הורד טבלה לאקסל" שומר קובץ שנפתח באקסל עם כל הבקשות. "הורד קובץ גיבוי" שומר את כל המערכת לקובץ אחד, ו"שחזור מקובץ גיבוי" מחזיר אותו.

# נעילה ומצב תצוגה
המערכת ננעלת לבד אחרי 20 דקות בלי פעילות (אפשר לכבות בניהול). הכפתור ◐ למעלה מחליף בין תצוגה בהירה לכהה.

# הצפנה ומפתח הארגון
כל הנתונים מוצפנים במחשב לפני שהם יוצאים לשרת, עם "מפתח הארגון". בשרת נשמר רק ג'יבריש, ובגיטהאב יש רק את התוכנה בלי שום נתון. גם מי שיצליח להגיע לשרת יראה רק ג'יבריש.
בכניסה הראשונה המנהל הראשי קובע את מפתח הארגון (משפט של לפחות 10 תווים, אפשר בעברית) ומקבל קוד שחזור. את הקוד שומרים במקום בטוח, למשל מדפיסים אותו.
גבאי שאישרת לא צריך לדעת שום מפתח. הוא נכנס עם Google, ובפעם הראשונה המחשב שלו מחכה לפתיחה. המחשב נפתח אוטומטית ברגע שמנהל נכנס למערכת. כל מחשב מקבל מנעול משלו, שנשאר נעול בתוך הדפדפן שלו ולא יוצא ממנו אף פעם. מי שלא אושר, או שהושבת, לא מקבל נתונים מהשרת בכלל, והגישה של המחשבים שלו נמחקת.
מתי צריך את המפתח? כמעט אף פעם. רק אם אתה (הבעלים) נכנס ממחשב חדש, או אחרי שמחקת את נתוני הדפדפן.
שכחת את המפתח? במסך המפתח לוחצים "📧 שכחתי את המפתח – שחזור דרך המייל שלי" ובוחרים מפתח חדש. זה עובד רק לחשבון של הבעלים, ושום נתון לא נמחק. אפשר גם להשתמש בקוד השחזור. חשוב: מי שנכנס למייל שלך יכול לשחזר, לכן שומרים היטב על הסיסמה של המייל.

# כניסה עם מייל וסיסמה
מי שיש לו Gmail נכנס בכפתור Google, ולא צריך שום סיסמה.
מי שאין לו Gmail: כותב את המייל שלו, כותב בשדה הסיסמה סיסמה שהוא בוחר (לפחות 8 תווים), ולוחץ "כניסה ראשונה? בחירת סיסמה". מקבל מייל לאישור, לוחץ על הקישור, ואחר כך נכנס עם המייל והסיסמה.
שכח סיסמה? כותב את המייל ולוחץ "שכחתי סיסמה". מגיע אליו מייל עם קישור לבחירת סיסמה חדשה.
כמו בכניסה עם Google, גם כאן רק מי שאישרת ברשימת המשתמשים רואה נתונים.
בלשונית "ניהול" ← "הצפנת הנתונים" המנהל הראשי יכול להחליף את מפתח הארגון (למשל כשגבאי עוזב) וליצור קוד שחזור חדש.

# סיסמאות ראשוניות
כניסה: 1234 · כספים: 123456 · ניהול: 123456. אפשר להחליף אותן בלשונית "ניהול" ← "סיסמאות". כדי להחליף קוד צריך להקליד קודם את הקוד הנוכחי, כך שגם מי שקיבל הרשאת מנהל לא יכול להשתלט על המערכת בלי לדעת את הקודים. רק הבעלים (המנהל הראשי) נכנס לכספים ולניהול בלי קוד, ויכול להחליף קוד גם בלי לדעת את הקוד הישן. (במצב שרת הכניסה היא עם חשבון Google של כל גבאי.)`;

/* ===== הצפנה מקצה לקצה (כמו בעזר): הנתונים מוצפנים במחשב לפני שהם יוצאים לשרת =====
   מפתח אקראי חזק (DEK) מצפין את כל הנתונים. הוא שמור בשרת רק כשהוא נעול: פעם במפתח הארגון (משפט שרק אנשי הצוות יודעים)

let DEK=null, CMETA=null;
const kb64=u=>{let s='';const a=new Uint8Array(u);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));return btoa(s)};
const kub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normKey=p=>String(p||'').normalize('NFC').trim();
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
async function kDerive(pass,salt){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:kub(salt),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function aesEnc(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return kb64(o)}
async function aesDec(key,s){const u=kub(s);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12)))}
const encStr=async s=>aesEnc(DEK,new TextEncoder().encode(s));
const decStr=async s=>new TextDecoder().decode(await aesDec(DEK,s));
const importDek=raw=>crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['encrypt','decrypt']);
async function wrapDek(secret,raw){const salt=kb64(crypto.getRandomValues(new Uint8Array(16)));return {salt,wrap:await aesEnc(await kDerive(secret,salt),raw)}}
async function unwrapDek(secret,salt,wrap){return aesDec(await kDerive(secret,salt),wrap)}
const dekSlot=()=>'kk_dek_'+(MYEMAIL||'local');
async function dekSave(){try{localStorage.setItem(dekSlot(),kb64(await crypto.subtle.exportKey('raw',DEK)))}catch(e){}}
function dekForget(){try{localStorage.removeItem(dekSlot())}catch(e){}}
async function dekCheck(){try{return !!CMETA&&await decStr(CMETA.check)==='kk-ok'}catch(e){return false}}
async function sealData(o){return DEK?{enc:await encStr(JSON.stringify(o))}:o}
async function openData(d){if(d&&typeof d.enc==='string'){if(!DEK)throw new Error('אין מפתח ארגון במחשב הזה');return JSON.parse(await decStr(d.enc))}return d}
function genRecovery(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=crypto.getRandomValues(new Uint8Array(20));let s='';b.forEach((x,i)=>{s+=A[x%A.length];if(i%5===4&&i<19)s+='-'});return s}
async function putCMeta(m){const {error}=await SB.from('kk_settings').upsert({id:'crypto',data:m,updated_at:new Date().toISOString()});if(error)throw new Error(error.message);CMETA=m}

function upcomingYahr(n){const out=[];R.forEach(x=>(x.deceased||[]).forEach(d=>{const dm=hebDayMonth(d.date);const k=daysUntil(dm,n);if(k>=0)out.push({...d,by:x,days:k})}));return out.sort((a,b)=>a.days-b.days)}

/* תיקון מייל לפי הנפוץ */
function fixEmail(e){e=String(e||'').trim().replace(/\s+/g,'');if(!e)return'';if(!e.includes('@')&&/gmail|gmial|gmai/i.test(e))e=e.replace(/(gmail|gmial|gmai)\.?(com|co)?$/i,'@gmail.com');
  return e.replace(/@(gmail|gmial|gmai|gamil|gnail|gmal)(\.c?o?m?)?$/i,'@gmail.com').replace(/@(walla|wala)(\.c?o?\.?i?l?)?$/i,'@walla.co.il').toLowerCase()}

/* ===== סריקת טופס ===== */
async function shrink(file,max=1600,q=.85){const img=await createImageBitmap(file);const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return {blob:await new Promise(r=>c.toBlob(r,'image/jpeg',q)),url:c.toDataURL('image/jpeg',Math.min(q,.6))}}
const SCAN_PROMPT=`זו תמונה של טופס נייר בעברית בשם "בקשת ברכה מכ״ק מרן האדמו״ר מביאלא שליט״א", מולא בכתב יד.
קרא את כתב היד והחזר JSON בלבד, בלי טקסט נוסף, במבנה:
{"date":"YYYY-MM-DD או ריק","hebDate":"תאריך עברי כפי שנכתב או ריק","first":"","last":"","birth":"כפי שנכתב","prayName":"","spouseName":"","spouseBirth":"כפי שנכתב","address":"","city":"","zip":"","homePhone":"","mobile":"","work":"","workPhone":"","email":"","marital":"","children":"","deceased":[{"name":"","rel":"","date":""}],"request":"","unsure":["שמות השדות שלא היו ברורים"]}
כללים: אל תמציא. שדה ריק בטופס = מחרוזת ריקה. אם קראת חלקית — כתוב את הניחוש הטוב ביותר והוסף את שם השדה ל-unsure. מייל: השלם לפי הנפוץ (רוב המיילים נגמרים ב-@gmail.com) והוסף email ל-unsure אם ניחשת. מספרי טלפון ישראליים בפורמט 05X-XXXXXXX. "מצב משפחתי" כמו "נשוי + 4" → marital "נשוי", children "4". כתב בשוליים ליד "בקשה אישית" — צרף ל-request. תאריך הבקשה בראש הדף: אם לועזי — המר ל-YYYY-MM-DD; אם עברי — השאר date ריק ומלא hebDate.`;
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
const hasKey=()=>!!(S.geminiKey);
async function aiReadImage(blob){
  if(!hasKey())throw {code:'no_key'};
  const model=(S.geminiModel||'gemini-3.8-flash').trim();
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.geminiKey.trim()},
    body:JSON.stringify({contents:[{parts:[{text:SCAN_PROMPT},{inline_data:{mime_type:'image/jpeg',data:await blobToB64(blob)}}]}],generationConfig:{response_mime_type:'application/json',temperature:0.1}})}).catch(()=>{throw {code:'net'}});
  if(r.status===429)throw {code:'rate_limited'};
  if(!r.ok){let m='';try{m=(await r.json()).error?.message||''}catch(e){}throw {code:r.status===400||r.status===403?'bad_key':'api',message:m}}
  const j=await r.json();const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').replace(/^\s*```(json)?/,'').replace(/```\s*$/,'').trim();
  try{return JSON.parse(t)}catch(e){throw {code:'parse'}}}
/* קורא תמונה אחת ומחזיר רשומה (לא שמורה) */
async function scanToRecord(file){
  if(!hasKey())throw {code:'no_key'};
  const {blob,url}=await shrink(file);let scanUrl='';try{scanUrl=(await shrink(file,1100,.6)).url}catch(e){scanUrl=url}
  const res=await aiReadImage(blob);
  const pre={date:res.date&&/^\d{4}-\d\d-\d\d$/.test(res.date)?res.date:todayISO(),deceased:(res.deceased||[]).filter(d=>d&&(d.name||d.date)),donation:{type:'none'},status:'wait',tags:[],
    unsure:Array.isArray(res.unsure)?res.unsure.filter(k=>FL[k]):[],review:true,_scanData:url,_scanUrl:scanUrl,notes:res.hebDate?`תאריך בדף: ${res.hebDate}`:''};
  FIELDS.forEach(([k])=>{if(res[k]!=null)pre[k]=String(res[k])});pre.email=fixEmail(pre.email);return pre}
const scanErr=e=>({no_key:'כדי לסרוק אוטומטית צריך להכניס פעם אחת מפתח Gemini בלשונית "ניהול".',bad_key:'מפתח ה־Gemini לא התקבל. בדוק אותו בלשונית "ניהול".',rate_limited:'יותר מדי סריקות ברצף. המתן דקה ונסה שוב.',net:'אין חיבור לאינטרנט, או שהשירות חסום בסינון.',parse:'הדף לא נקרא כראוי. נסה תמונה חדה יותר.'}[e?.code]||('הסריקה לא הצליחה. '+(e?.message||'נסה תמונה חדה ומוארת יותר.')));
async function scanForm(file){const msg=$('#scanMsg');
  msg.innerHTML='<div class="notice info" style="margin-top:10px"><span class="spin"></span> קורא את כתב היד... זה יכול לקחת עד דקה.</div>';
  try{const pre=await scanToRecord(file);renderForm(null,pre);$('#scanMsg').innerHTML=`<div class="notice" style="margin-top:10px">הטופס נקרא. ${pre.unsure.length?`${pre.unsure.length} שדות מסומנים בכתום לבדיקה.`:'בדוק את כל השדות מול הדף לפני השמירה.'}</div>`}
  catch(e){msg.innerHTML=`<div class="notice" style="margin-top:10px">${scanErr(e)} אפשר להקליד ידנית.</div>`}}

/* ===== לשונית סריקת דפים ===== */
let scanJobs=[];
function renderScan(){
  $('#main').innerHTML=`<section><h2>סריקת דפים</h2>
  <p class="muted">מעלים תמונה של טופס "בקשת ברכה" — אחד או כמה ביחד. המערכת קוראת את כתב היד, שומרת כל דף כבקשה ומסמנת בכתום מה שצריך לבדוק. תמונת הדף נשמרת ליד הבקשה ובכרטיס האדם.</p>
  ${hasKey()?'':'<div class="notice" style="margin:10px 0">הסריקה האוטומטית עוד לא מחוברת: מכניסים פעם אחת מפתח Gemini בלשונית "ניהול". עד אז אפשר להעלות תמונות ולהקליד את הפרטים ידנית ליד התמונה.</div>'}
  <label class="drop" id="drop" for="multiScan"><b>לחץ כאן לבחירת תמונות</b><span>או גרור לכאן תמונות של הטפסים · אפשר לבחור כמה דפים ביחד</span></label>
  <input type="file" id="multiScan" accept="image/*" multiple hidden>
  <p class="small muted">טיפ: צלם כל דף לבד, מקרוב, באור טוב ובלי צל. דף ישר וחד נקרא הרבה יותר טוב.</p>
  <div class="queue" id="jobs"></div></section>`;
  const add=files=>{[...files].filter(f=>f.type.startsWith('image/')).forEach(f=>scanJobs.push({file:f,name:f.name,state:'wait'}));drawJobs();runJobs()};
  $('#multiScan').onchange=e=>add(e.target.files);
  const dz=$('#drop');['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));dz.addEventListener('drop',e=>add(e.dataTransfer.files));
  drawJobs();
}
function drawJobs(){const box=$('#jobs');if(!box)return;
  box.innerHTML=scanJobs.slice().reverse().map((j,i)=>`<div class="qi ${j.state==='done'?'':''}"><span class="no">${scanJobs.length-i}</span>
    <div><b>${j.rec?esc(fullName(j.rec)):esc(j.name)}</b><div class="small ${j.state==='err'?'':'muted'}" style="${j.state==='err'?'color:var(--bad)':''}">${j.state==='wait'?'ממתין בתור':j.state==='run'?'<span class="spin"></span> קורא את כתב היד...':j.state==='done'?`נשמר. ${j.rec.unsure?.length?j.rec.unsure.length+' שדות לבדיקה':'לבדוק מול הדף'}`:esc(j.err)}</div></div>
    <div class="row">${j.state==='done'?`<button class="btn sm warn" data-open="${j.rec.id}">פתח לבדיקה</button>`:''}${j.state==='err'&&j.url?`<button class="btn sm" data-manual="${i}">הקלד ידנית ליד התמונה</button>`:''}</div></div>`).join('');
  $$('#jobs [data-open]').forEach(b=>b.onclick=()=>go('edit',byId(b.dataset.open)));
  $$('#jobs [data-manual]').forEach(b=>b.onclick=()=>{const j=scanJobs[scanJobs.length-1-b.dataset.manual];pendingPre={date:todayISO(),deceased:[],donation:{type:'none'},status:'wait',tags:[],review:true,unsure:[],_scanData:j.url,_scanUrl:j.scanUrl||j.url};go('new')})}
let jobsRunning=false;
async function runJobs(){if(jobsRunning)return;jobsRunning=true;
  for(const j of scanJobs){if(j.state!=='wait')continue;j.state='run';drawJobs();
    try{const pre=await scanToRecord(j.file);const o={...pre,id:newId(),createdAt:Date.now(),createdBy:ME+' (סריקה)',scanUrl:pre._scanUrl||pre._scanData};delete o._scanData;delete o._scanUrl;
      if(o.date===todayISO())o.queueNo=Math.max(0,...R.filter(r=>r.date===o.date).map(r=>r.queueNo||0))+1;
      await putRec(o);j.rec=o;j.state='done'}
    catch(e){j.state='err';j.err=scanErr(e);try{const s=await shrink(j.file,1100,.6);j.url=j.scanUrl=s.url}catch(_){}}
    drawJobs()}
  jobsRunning=false;renderTabs()}

let logFilt={who:'',act:'',from:'',to:''},LOGC=[];
async function renderLog(){

    <label class="row small">מתאריך <input type="date" id="lgFrom" value="${logFilt.from}"></label><label class="row small">עד <input type="date" id="lgTo" value="${logFilt.to}"></label></div>

  if(MODE==='cloud'){const {data,error}=await SB.from('kk_log').select('*').order('at',{ascending:false}).limit(2000);
    if(error){$('#lgRows').innerHTML=`<tr><td colspan="4" class="empty">לא ניתן לטעון את היומן: ${esc(error.message)}</td></tr>`;return}
    LOGC=await Promise.all(data.map(async r=>{let tg=r.target||'',dt=r.details;try{if(tg.startsWith('enc:'))tg=await decStr(tg.slice(4))}catch(e){tg='🔒'}try{if(dt&&typeof dt.enc==='string')dt={...JSON.parse(await decStr(dt.enc)),who:dt.who}}catch(e){}return {at:r.at,who:r.details?.who||r.email,email:r.email,action:r.action,target:tg,details:dt}}))}

    <div class="stat"><b>${t.filter(l=>/בקשה חדשה/.test(l.action)).length}</b><span>בקשות שנקלטו היום</span></div><div class="stat ${LOGC.some(l=>/שגויה|נכשל/.test(l.action)&&dayOf(l)===today)?'alert':''}"><b>${t.filter(l=>/שגויה|נכשל/.test(l.action)).length}</b><span>ניסיונות כושלים היום</span></div>`;

  <fieldset><legend>סריקה אוטומטית (Gemini)</legend>
    <p class="muted small" style="margin-top:0">הסריקה קוראת את כתב היד בעזרת Gemini של גוגל. צריך מפתח פעם אחת: נכנסים ל־aistudio.google.com/apikey, לוחצים "Create API key" ומעתיקים לכאן. ${MODE==='cloud'?'המפתח נשמר בשרת ומשמש את כל הגבאים.':'המפתח נשמר במחשב הזה.'}</p>
    <div class="grid"><label class="f">מפתח Gemini<input id="gk" type="password" dir="ltr" value="${esc(S.geminiKey)}" autocomplete="off"></label>

    <p class="small" style="color:var(--warn)">שים לב: בחשבון גוגל חינמי, גוגל רשאית להשתמש בתוכן שנשלח אליה לשיפור השירות. בגלל שבטפסים יש פרטים אישיים, עדיף מפתח מחשבון בתשלום (כמו שעשית בביאלה).</p>
    <div class="row"><button class="btn primary" id="gkBtn">שמור מפתח</button><button class="btn" id="gkTest">בדוק חיבור</button><span id="gkMsg" class="small"></span></div></fieldset>
  <fieldset><legend>חיבור לשרת משותף (Supabase)</legend>
    <p class="muted small" style="margin-top:0">${MODE==='cloud'?'<b style="color:var(--ok)">המערכת מחוברת לשרת.</b> כל הגבאים רואים את אותם נתונים. כל אחד נכנס עם חשבון Google משלו, ורק מי שאישרת ברשימת המשתמשים יכול להיכנס.':'כרגע הנתונים במחשב הזה בלבד. כדי שכמה גבאים יעבדו ביחד מכל מחשב: יוצרים פרויקט ב־Supabase, מריצים את קוד ההקמה למטה, ומכניסים כאן את הכתובת והמפתח.'}</p>
    <div class="grid"><label class="f">כתובת הפרויקט (Project URL)<input id="su" dir="ltr" placeholder="https://xxxx.supabase.co" value="${esc(CONN().url)}"></label>
    <label class="f">מפתח ציבורי (anon public)<input id="sk" dir="ltr" value="${esc(CONN().key)}" autocomplete="off"></label></div>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="suBtn">שמור והתחבר</button>${MODE==='cloud'?'<button class="btn" id="suUp">העלה לשרת את הנתונים שבמחשב הזה</button><button class="btn danger" id="suOff">נתק מהשרת במחשב הזה</button>':''}</div>
    <div class="row" style="margin-top:8px;align-items:end"><label class="f" style="flex:1;min-width:220px">כתובת ה־Gmail של המנהל הראשי (נכנסת לקוד ההקמה)<input id="admEmail" type="email" dir="ltr" value="${esc(MYEMAIL)}" placeholder="name@gmail.com"></label><button class="btn" id="sqlBtn">העתק קוד הקמה</button></div>
    <details style="margin-top:10px"><summary class="small">איך עובדת הכניסה עם Google?</summary><p class="small">המערכת משתמשת באותו חיבור Google של מערכת התמלול (Google Cloud ← פרויקט Tamlul Plus). כתובת המערכת כבר מאושרת שם. מערכת על כתובת אחרת צריכה להתווסף ב־Google Cloud ← Clients ← Authorized JavaScript origins.</p></details>
    <textarea class="code" id="sqlBox" hidden></textarea></fieldset>
  <fieldset><legend>גיבוי, שחזור ואקסל</legend>
    <p class="muted small" style="margin-top:0">${MODE==='cloud'?'הנתונים שמורים בשרת. בכל זאת מומלץ להוריד קובץ גיבוי פעם בשבוע.':'הנתונים במחשב הזה בלבד. חובה להוריד קובץ גיבוי פעם בשבוע ולשמור אותו בדיסק נוסף או במייל של החברה.'} ${lget('lastBackup','')?'גיבוי אחרון מהמחשב הזה: '+esc(lget('lastBackup','')):'עדיין לא הורד גיבוי מהמחשב הזה.'}</p>
    <div class="row"><button class="btn gold" id="dlBk">הורד קובץ גיבוי</button><button class="btn" id="dlCsv">הורד טבלה לאקסל</button><button class="btn" id="copyCsv">העתק טבלה לאקסל</button></div>
    <label class="f" style="margin-top:12px">שחזור מקובץ גיבוי<input type="file" id="bkFile" accept=".json,application/json"></label>
    <label class="f" style="margin-top:8px">או הדבק כאן טקסט של גיבוי<textarea class="code" id="bk"></textarea></label>
    <div class="row" style="margin-top:8px"><button class="btn" id="restore">שחזר מהטקסט (מוסיף ומעדכן, לא מוחק)</button></div></fieldset>
  </section>`;
  $('#lockAdm').onclick=()=>{ADM=false;ss.del('biala_adm');go('home')};
  renderUsers();
  $('#pwBtn').onclick=async()=>{const k=$('#pk').value;if(!isOwner()&&await hash($('#p0').value)!==S[k]){log('ניסיון החלפת קוד עם קוד נוכחי שגוי',$('#pk').selectedOptions[0].text);return toast('הקוד הנוכחי שגוי')}if($('#p1').value.length<4)return toast('לפחות 4 תווים');if($('#p1').value!==$('#p2').value)return toast('הסיסמאות לא זהות');S[$('#pk').value]=await hash($('#p1').value);await putS('החלפת סיסמה: '+$('#pk').selectedOptions[0].text);toast('הסיסמה הוחלפה');$('#p1').value=$('#p2').value='';if($('#p0'))$('#p0').value=''};
  if($('#okBtn'))$('#okBtn').onclick=async()=>{const p1=normKey($('#ok1').value);if(p1.length<10)return toast('לפחות 10 תווים');if(p1!==normKey($('#ok2').value))return toast('המפתחות לא זהים');
    $('#okMsg').textContent=T('מחליף…');try{await changeOrgKey(p1);$('#ok1').value=$('#ok2').value='';$('#okMsg').textContent='';toast('מפתח הארגון הוחלף. מעכשיו אומרים לגבאים חדשים את המפתח החדש.')}catch(e){$('#okMsg').textContent=e.message||''}};
  if($('#orBtn'))$('#orBtn').onclick=async()=>{if(!confirm(T('ליצור קוד שחזור חדש? הקוד הישן יפסיק לעבוד.')))return;try{const code=await newRecoveryCode();
    $('#okMsg').innerHTML=`<b>${esc(T('קוד השחזור החדש:'))}</b> <span dir="ltr" class="reccode" data-noi18n style="display:inline-block;font-size:16px;padding:4px 8px">${esc(code)}</span> ${esc(T('שמור אותו במקום בטוח.'))}`}catch(e){toast(e.message||'')}};
  $('#gbBtn').onclick=async()=>{S.gabbaim=$('#gb').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!S.gabbaim.length)S.gabbaim=['גבאי'];await putS();fillGabbai();toast('הגבאים נשמרו')};
  $$('[data-ft]').forEach(c=>c.onchange=async()=>{S.features={...S.features,[c.dataset.ft]:c.checked};await putS((c.checked?'הפעלת ':'כיבוי ')+FEATURES[c.dataset.ft]);renderTabs();toast('עודכן')});
  $('#tplBtn').onclick=async()=>{S.templates={...(S.templates||{})};$$('[data-tpl]').forEach(t=>S.templates[t.dataset.tpl]=t.value);await putS();toast('הנוסחים נשמרו')};
  $('#hlBtn').onclick=async()=>{S.help=$('#hl').value;await putS();toast('ההוראות נשמרו')};$('#hlReset').onclick=()=>{$('#hl').value=DEF_HELP};
  const mkSQL=adminEmail=>`-- מערכת קבלת קהל ביאלה — קוד הקמה ל-Supabase (SQL Editor ← New query ← Run)
-- אפשר להריץ שוב בלי לאבד נתונים.
create table if not exists kk_records (id text primary key, data jsonb not null, updated_at timestamptz default now());
create table if not exists kk_kupa (id text primary key, data jsonb not null, updated_at timestamptz default now());
create table if not exists kk_settings (id text primary key, data jsonb not null, updated_at timestamptz default now());
-- רשימת המורשים: רק מי שנמצא כאן ומאושר יכול להיכנס
create table if not exists kk_users (email text primary key, name text, role text not null default 'gabbai', active boolean not null default false, blocked boolean not null default false, created_at timestamptz default now(), last_login timestamptz);
-- יומן פעולות: מי עשה מה ומתי (אי אפשר למחוק או לשנות)
create table if not exists kk_log (id bigint generated always as identity primary key, at timestamptz not null default now(), email text not null default lower(auth.jwt()->>'email'), action text not null, target text, details jsonb);
create index if not exists kk_log_at on kk_log(at desc);
-- מתג השבתה כללי — רק הבעלים
create table if not exists kk_system (id int primary key default 1 check (id=1), disabled boolean not null default false, message text, updated_at timestamptz default now());
insert into kk_system(id) values (1) on conflict (id) do nothing;

create or replace function kk_me() returns text language sql stable as $f$ select lower(coalesce(auth.jwt()->>'email','')) $f$;
create or replace function kk_owner() returns boolean language sql stable security definer set search_path=public as $f$ select exists(select 1 from kk_users where email=kk_me() and active and not blocked and role='owner') $f$;
create or replace function kk_sys_on() returns boolean language sql stable security definer set search_path=public as $f$ select not coalesce((select disabled from kk_system where id=1),false) $f$;
create or replace function kk_active() returns boolean language sql stable security definer set search_path=public as $f$ select kk_owner() or (kk_sys_on() and exists(select 1 from kk_users where email=kk_me() and active and not blocked)) $f$;
create or replace function kk_admin() returns boolean language sql stable security definer set search_path=public as $f$ select kk_owner() or (kk_sys_on() and exists(select 1 from kk_users where email=kk_me() and active and not blocked and role='admin')) $f$;
-- רישום שעת הכניסה האחרונה (המשתמש לא יכול לשנות לעצמו הרשאות)
create or replace function kk_touch(n text) returns void language sql security definer set search_path=public as $f$ update kk_users set last_login=now(), name=coalesce(nullif(name,''),n) where email=kk_me() and active and not blocked $f$;
create or replace function kk_can_edit() returns boolean language sql stable security definer set search_path=public as $f$ select kk_owner() or (kk_sys_on() and exists(select 1 from kk_users where email=kk_me() and active and not blocked and role<>'view')) $f$;
-- רק הבעלים משבית/מפעיל משתמשים, ואף אחד לא יכול לגעת בבעלים או למנות בעלים
create or replace function kk_users_guard() returns trigger language plpgsql set search_path=public as $f$
begin
  if current_user not in ('authenticated','anon') or kk_owner() then return coalesce(new,old); end if;
  if tg_op='DELETE' then if old.role='owner' then raise exception 'אין הרשאה'; end if; return old; end if;
  if new.role='owner' or new.blocked then raise exception 'רק הבעלים יכול לעשות זאת'; end if;
  if tg_op='UPDATE' and (old.role='owner' or old.blocked is distinct from new.blocked) then raise exception 'רק הבעלים יכול לעשות זאת'; end if;
  return new;
end $f$;
drop trigger if exists kk_users_guard on kk_users;
create trigger kk_users_guard before insert or update or delete on kk_users for each row execute function kk_users_guard();

-- המנהל הראשי
-- הבעלים (רק הוא יכול להשבית את המערכת ולהשבית משתמשים)
insert into kk_users(email,name,role,active) values (lower('${adminEmail||'YOUR_GMAIL@gmail.com'}'),'בעלים','owner',true)
  on conflict (email) do update set role='owner', active=true, blocked=false;

alter table kk_records enable row level security;
alter table kk_kupa enable row level security;
alter table kk_settings enable row level security;
alter table kk_users enable row level security;
alter table kk_log enable row level security;
alter table kk_system enable row level security;
drop policy if exists kk_sys_sel on kk_system; drop policy if exists kk_sys_upd on kk_system;
create policy kk_sys_sel on kk_system for select to authenticated using (true);
create policy kk_sys_upd on kk_system for update to authenticated using (kk_owner()) with check (kk_owner());
drop policy if exists "kk_records_auth" on kk_records; drop policy if exists "kk_kupa_auth" on kk_kupa; drop policy if exists "kk_settings_auth" on kk_settings;
drop policy if exists kk_r_sel on kk_records; drop policy if exists kk_r_ins on kk_records; drop policy if exists kk_r_upd on kk_records; drop policy if exists kk_r_del on kk_records;
drop policy if exists kk_k_all on kk_kupa; drop policy if exists kk_s_sel on kk_settings; drop policy if exists kk_s_mod on kk_settings;
drop policy if exists kk_u_sel on kk_users; drop policy if exists kk_u_req on kk_users; drop policy if exists kk_u_adm on kk_users;
drop policy if exists kk_l_ins on kk_log; drop policy if exists kk_l_sel on kk_log;
create policy kk_r_sel on kk_records for select to authenticated using (kk_active());
create policy kk_r_ins on kk_records for insert to authenticated with check (kk_can_edit());
create policy kk_r_upd on kk_records for update to authenticated using (kk_can_edit()) with check (kk_can_edit());
create policy kk_r_del on kk_records for delete to authenticated using (kk_can_edit());
create policy kk_k_all on kk_kupa for all to authenticated using (kk_active()) with check (kk_can_edit());
create policy kk_s_sel on kk_settings for select to authenticated using (kk_active());
create policy kk_s_mod on kk_settings for all to authenticated using (kk_can_edit() and id<>'crypto') with check (kk_can_edit() and id<>'crypto');
drop policy if exists kk_s_crypto on kk_settings;
-- את מפתח ההצפנה הנעול רק הבעלים יכול לשנות
create policy kk_s_crypto on kk_settings for all to authenticated using (kk_owner()) with check (kk_owner());
-- מחשבים של משתמשים מאושרים: לכל מחשב מנעול משלו (מפתח ציבורי), והמנהל פותח לו את הנתונים אוטומטית
create table if not exists kk_devices (id text primary key, email text not null, name text, pub jsonb not null, wrap text, created_at timestamptz default now(), granted_at timestamptz, granted_by text);
alter table kk_devices enable row level security;
drop policy if exists kk_d_sel on kk_devices; drop policy if exists kk_d_ins on kk_devices; drop policy if exists kk_d_upd on kk_devices; drop policy if exists kk_d_del on kk_devices;
create policy kk_d_sel on kk_devices for select to authenticated using (email=kk_me() or kk_admin());
create policy kk_d_ins on kk_devices for insert to authenticated with check (email=kk_me() and wrap is null and kk_active());
create policy kk_d_upd on kk_devices for update to authenticated using (kk_admin()) with check (kk_admin());
create policy kk_d_del on kk_devices for delete to authenticated using (email=kk_me() or kk_admin());
-- שחזור מפתח הארגון דרך המייל של הבעלים
create table if not exists kk_escrow (email text primary key, dek text not null, updated_at timestamptz default now());
alter table kk_escrow enable row level security;
drop policy if exists kk_e_own on kk_escrow;
create policy kk_e_own on kk_escrow for all to authenticated using (email=kk_me() and kk_owner()) with check (email=kk_me() and kk_owner());
