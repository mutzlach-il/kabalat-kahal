<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4a2410">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="crest.webp">
<link rel="apple-touch-icon" href="crest.webp">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>קבלת קהל ביאלה</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap">
<style>
/* פריסה: פס עליון מהגוני עם הכתר ולשוניות; אזור עבודה עם הכתר כסימן מים; תאריך עברי ראשי, לועזי קטן לידו */
:root{
  --bg:#f3efe8; --panel:#fffdf9; --ink:#2b1d12; --muted:#76624f; --line:#e1d6c6;
  --wood:#4a2410; --wood2:#6b3416; --gold:#b8862b; --gold-soft:#f1e3c2;
  --ok:#2f6b3a; --warn:#c2620a; --warn-soft:#fde8d2; --bad:#9b2c1e; --field:#fff;
  --display:"Frank Ruhl Libre","David",serif; --body:"Assistant","Arial",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b130d; --panel:#251a12; --ink:#f1e6d6; --muted:#b9a58e; --line:#3d2c1f;
  --wood:#2e160a; --wood2:#4a2410; --gold:#d6a84a; --gold-soft:#3a2a14;
  --ok:#7fc28a; --warn:#f0a050; --warn-soft:#3d2610; --bad:#e08070; --field:#1f160f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b130d; --panel:#251a12; --ink:#f1e6d6; --muted:#b9a58e; --line:#3d2c1f;
  --wood:#2e160a; --wood2:#4a2410; --gold:#d6a84a; --gold-soft:#3a2a14;
  --ok:#7fc28a; --warn:#f0a050; --warn-soft:#3d2610; --bad:#e08070; --field:#1f160f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

#login{min-height:100vh;display:grid;place-items:center;padding-block:32px;background:radial-gradient(ellipse at top,#6b3416,#3a1a08 70%)}
.login-card{width:min(400px,100%);text-align:center;color:#f6ead2;display:grid;gap:12px}
.login-card img{width:min(300px,80%);margin:0 auto;filter:drop-shadow(0 10px 24px rgba(0,0,0,.45))}
.login-card h1{font-family:var(--display);font-weight:900;font-size:2rem;margin:0}
.login-card p{margin:0;color:#d9c39b}
.login-card input,.login-card select{background:rgba(255,255,255,.08);border:1px solid #8a6a3a;color:#fff;border-radius:10px;padding:12px 14px;text-align:center;font-size:1.1rem}
.login-card select option{color:#222}
.login-card .err{color:#ffb4a6;min-height:1.5em}

header.top{background:linear-gradient(180deg,var(--wood2),var(--wood));color:#f6ead2;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.25)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--wood2)}
.top-in{max-width:1280px;margin:0 auto;padding-block:6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top-in img{height:44px}
.brand{display:grid;line-height:1.15}
.brand b{font-family:var(--display);font-size:1.2rem}
.brand span{font-size:.78rem;color:#d9c39b}
.who{font-size:.8rem;color:#d9c39b;margin-inline-start:auto;white-space:nowrap}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap;width:100%;padding-bottom:4px}
nav.tabs button{background:none;border:0;color:#e9d7b5;padding:6px 11px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.95rem;display:inline-flex;gap:6px;align-items:center}
nav.tabs button[aria-current="true"]{background:var(--gold);color:#2b1606}
nav.tabs button:hover:not([aria-current="true"]){background:rgba(255,255,255,.08)}
nav.tabs .badge{background:var(--warn);color:#fff;border-radius:99px;font-size:.72rem;padding:0 6px}
.modebar{max-width:1280px;margin:8px auto 0;font-size:.85rem}
.modebar div{background:var(--warn-soft);border:1px solid var(--warn);border-radius:9px;padding:6px 12px}
main{position:relative;max-width:1280px;margin:0 auto;padding-block:18px 70px}
.watermark{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:0}
.watermark img{width:min(640px,80vw);opacity:.07}
main>section{position:relative;z-index:1}

h2{font-family:var(--display);font-weight:700;font-size:1.6rem;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--gold)}
a.btn{color:inherit;text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--wood2);border-color:var(--wood2);color:#fbefd6}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2b1606}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:.86rem}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:default}
.stat.link{cursor:pointer}.stat.link:hover{border-color:var(--gold)}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.88rem}
.stat.alert{border-color:var(--warn);background:var(--warn-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.toolbar input,.toolbar select{background:var(--field);border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.toolbar input[type=search]{flex:1;min-width:200px}

.tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse}
table.wide{min-width:760px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.8rem;color:var(--muted);font-weight:700;background:var(--gold-soft);white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:color-mix(in srgb,var(--gold-soft) 55%,transparent)}
tr.rev td:first-child{box-shadow:inset -4px 0 0 var(--warn)}
td.num,.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.ltr{direction:ltr;unicode-bidi:isolate}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.pill.wait{color:var(--warn)} .pill.in{color:var(--gold)} .pill.done{color:var(--ok)}
.pill.rev{color:#fff;background:var(--warn);border-color:var(--warn)}
.pill.tag{color:var(--wood2);border-style:dashed}
:root[data-theme="dark"] .pill.tag{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.tag{color:var(--gold)}}
.g{font-size:.74rem;color:var(--muted);font-weight:400}
.hd{font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}

.form{display:grid;gap:14px}
.formwrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.formwrap.withimg{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:900px){.formwrap.withimg{grid-template-columns:1fr}}
.scanimg{position:sticky;top:120px;align-self:start;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.scanimg img{width:100%;border-radius:6px;cursor:zoom-in}
.scanimg img.big{cursor:zoom-out}
fieldset{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px 16px 16px;margin:0;min-width:0}
legend{font-family:var(--display);font-weight:700;font-size:1.08rem;padding:0 8px;color:var(--wood2)}
:root[data-theme="dark"] legend{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) legend{color:var(--gold)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 14px}
.grid .wide{grid-column:1/-1}
label.f{display:grid;gap:3px;font-size:.86rem;color:var(--muted);font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink);font-weight:400;font-size:1rem;width:100%}
label.f textarea{min-height:84px;resize:vertical}
label.f.unsure input,label.f.unsure textarea{border:2px solid var(--warn);background:var(--warn-soft)}
label.f.unsure::after{content:"לבדיקה — לא ברור בכתב היד";color:var(--warn);font-size:.74rem}
.hint{font-size:.76rem;color:var(--gold);font-weight:600;min-height:1.1em}
input[dir="ltr"]{text-align:left}
.dec-row{display:grid;grid-template-columns:2fr 1fr 1.3fr auto;gap:8px;align-items:end;margin-bottom:8px}
@media (max-width:560px){.dec-row{grid-template-columns:1fr 1fr}.dec-row .rm{grid-column:1/-1}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{border:1px solid var(--line);border-radius:99px;padding:3px 12px;cursor:pointer;font-size:.9rem;background:var(--field)}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked){background:var(--gold);border-color:var(--gold);color:#2b1606;font-weight:700}
.chips label:has(input:focus-visible){outline:2px solid var(--gold)}
.sticky-actions{position:sticky;bottom:0;background:var(--bg);padding-block:10px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);z-index:3}
.notice{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:10px 12px}
.notice.info{background:var(--gold-soft);border-color:var(--gold)}
.lock{background:var(--gold-soft);border:1px dashed var(--gold);border-radius:10px;padding:10px 12px;font-size:.9rem}

.view{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.view{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px;align-content:start}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
dt{color:var(--muted);font-size:.86rem}
dd{margin:0;overflow-wrap:anywhere}
dd.unsure{color:var(--warn);font-weight:700}
.req{background:var(--gold-soft);border-radius:10px;padding:12px 14px;white-space:pre-wrap;font-size:1.05rem}
.confirm{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border:1px solid var(--bad);border-radius:10px;padding:10px 12px}

/* קוויטל — מסך גדול */
.kv{background:var(--panel);border:2px solid var(--gold);border-radius:16px;padding:clamp(18px,4vw,44px);text-align:center;display:grid;gap:18px;min-height:60vh;align-content:center}
.kv .nm{font-family:var(--display);font-weight:900;font-size:clamp(2rem,6vw,4rem);line-height:1.2}
.kv .rq{font-size:clamp(1.2rem,3vw,1.9rem);white-space:pre-wrap}
.kv .sub{color:var(--muted);font-size:1.05rem}
.kv .dec{font-family:var(--display);font-size:1.3rem}

.queue{display:grid;gap:8px}
.qi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.qi .no{font-family:var(--display);font-weight:900;font-size:1.6rem;color:var(--gold);min-width:2.2ch;text-align:center}
.qi.cur{border:2px solid var(--gold);background:var(--gold-soft)}
.qi.done{opacity:.55}

.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:90px 1fr 90px;gap:8px;align-items:center;font-size:.88rem}
.bar i{display:block;height:14px;border-radius:4px;background:var(--gold)}
.bar i.out{background:var(--bad)}
.help{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 22px;max-width:78ch}
.help h3{margin-top:14px}
.help p{margin:6px 0}
.drop{display:grid;place-items:center;gap:6px;text-align:center;border:2px dashed var(--gold);border-radius:16px;padding:44px 16px;background:var(--panel);cursor:pointer;margin:14px 0 6px}
.drop b{font-family:var(--display);font-size:1.4rem;color:var(--wood2)}.drop span{color:var(--muted)}.drop.over,.drop:hover{background:var(--gold-soft)}
:root[data-theme="dark"] .drop b{color:var(--gold)}
.pcard{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;background:linear-gradient(135deg,var(--gold-soft),var(--panel));border:1px solid var(--gold);border-radius:14px;padding:16px 18px;margin:14px 0}
.pname{font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15}
.pstats{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:.92rem}.pstats b{font-family:var(--display);font-size:1.3rem}
.timeline{display:grid;gap:10px}.tl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}.tl.rev{border-color:var(--warn)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gallery figure{margin:0;display:grid;gap:4px}
.gallery img{width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in}.gallery figure.big{grid-column:1/-1}.gallery figure.big img{cursor:zoom-out}
.gallery figcaption{font-size:.8rem;text-align:center}
.docs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;margin-top:12px}@media (max-width:820px){.docs{grid-template-columns:1fr}}
.doclist{gap:4px;padding:8px}.doclist button{background:none;border:0;text-align:right;padding:8px 10px;border-radius:8px;cursor:pointer;font-weight:600}
.doclist button:hover{background:var(--gold-soft)}.doclist button.on{background:var(--wood2);color:#fbefd6}
.edbar{display:flex;gap:4px;flex-wrap:wrap;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px}
.edbar>button:not(.btn){border:1px solid var(--line);background:var(--field);border-radius:6px;padding:3px 10px;cursor:pointer}
.paper{background:#fff;color:#000;border:1px solid var(--line);border-radius:4px;box-shadow:0 4px 18px rgba(0,0,0,.12);padding:clamp(14px,4vw,40px);min-height:70vh;overflow-x:auto;outline:none}
.paper:focus{box-shadow:0 0 0 2px var(--gold),0 4px 18px rgba(0,0,0,.12)}

.langsw{display:inline-flex;border:1px solid #8a6a3a;border-radius:9px;overflow:hidden;flex:none}
.langsw button{background:transparent;color:#e9d7b5;border:0;padding:4px 10px;cursor:pointer;font-weight:700;font-size:.85rem}
.langsw button[aria-pressed="true"]{background:var(--gold);color:#2b1606}
.login-card .langsw{justify-self:center}
html[dir=ltr] body{direction:ltr}
html[dir=ltr] th,html[dir=ltr] td,html[dir=ltr] .doclist button{text-align:left}
html[lang=en] label.f.unsure::after{content:"To review — unclear handwriting"}
#toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--wood);color:#fbefd6;padding:10px 18px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:20;max-width:90vw}
textarea.code{width:100%;min-height:120px;font-family:ui-monospace,monospace;font-size:.8rem;direction:ltr;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>


<div id="login" class="gut">
  <form class="login-card" id="loginForm">
    <div class="langsw" data-noi18n role="group" aria-label="Language / שפה"><button type="button" data-lang="he">עברית</button><button type="button" data-lang="en">English</button></div>
    <img src="crest.webp" alt="כתר ביאלה">
    <h1>מערכת קבלת קהל</h1>
    <p>מרכז חסידי ביאלא בני ברק</p>
    <div id="emailWrap" hidden style="display:grid"><input id="em" type="email" dir="ltr" placeholder="כתובת מייל" aria-label="כתובת מייל" autocomplete="username"></div>
    <input id="pw" type="password" placeholder="סיסמת כניסה" aria-label="סיסמה" autocomplete="current-password">
    <select id="gabbaiSel" aria-label="מי נכנס"></select>
    <button class="btn gold" type="submit">כניסה</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top"><div class="top-in gut">
    <img src="crest.webp" alt="">
    <div class="brand"><b>קבלת קהל</b><span>מרכז חסידי ביאלא בני ברק</span></div>
    <span class="who" id="who"></span><div class="langsw" data-noi18n role="group" aria-label="Language / שפה"><button type="button" data-lang="he">עברית</button><button type="button" data-lang="en">English</button></div><button class="btn sm" id="themeBtn" style="background:transparent;color:#e9d7b5;border-color:#8a6a3a" aria-label="מצב תצוגה">◐</button>
    <nav class="tabs" id="tabs"></nav>
  </div></header>
  <div class="modebar gut" id="modebar"></div>
  <div class="watermark"><img src="crest.webp" alt=""></div>
  <main id="main" class="gut"></main>
</div>
<div id="toast" hidden></div>

<script>if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(function(){});</script>
<script>
/* ===== כלים ===== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* ===== שפה: עברית (ברירת מחדל) / English ===== */
let LANG=(()=>{try{return localStorage.getItem('biala_kk_lang')||'he'}catch(e){return 'he'}})();
const I18N={
/* כללי וכניסה */
'מערכת קבלת קהל':'Reception System','קבלת קהל':'Reception','מרכז חסידי ביאלא בני ברק':'Biala Chassidic Center, Bnei Brak','כתר ביאלה':'Biala crown',
'סיסמת כניסה':'Login password','סיסמה':'Password','כניסה':'Sign in','מי נכנס':'Who is signing in','— מי נכנס? —':'— Who is signing in? —','כתובת מייל':'Email address',
'הסיסמה שגויה, נסה שוב':'Wrong password, please try again','הסיסמה שגויה':'Wrong password','הסיסמה שגויה. אם שכחת — מנהל המערכת יכול להחליף אותה מהמחשב הראשי.':'Wrong password. If you forgot it, the system manager can change it from the main computer.',
'מתחבר...':'Connecting...','המייל או הסיסמה שגויים':'Wrong email or password','המערכת ננעלה אחרי 20 דקות ללא פעילות':'The system locked after 20 minutes without activity',
'אזור זה מוגן בסיסמה נוספת.':'This area is protected by an extra password.','פתח':'Open','גבאי':'Gabbai','גבאי ראשי':'Head gabbai','מצב תצוגה':'Display mode',

# שפה
הכפתורים למעלה מחליפים בין עברית ל־English. ברירת המחדל היא עברית. שמות, בקשות ומכתבים להדפסה נשארים כמו שנכתבו.

# כניסה
מקלידים את סיסמת הכניסה ובוחרים את שם הגבאי. כל בקשה שנקלטת נרשמת על שם הגבאי שהכניס אותה.

# קליטת בקשה חדשה
לוחצים על "בקשה חדשה" וממלאים לפי הסדר של הטופס. ליד כל תאריך מופיע התאריך העברי.
תאריך לידה אפשר לכתוב בעברי (למשל: ד׳ חשוון תשי״ז) או בלועזי (למשל: 25/04/1956). לועזי מומר לעברי אוטומטית.
כשמקלידים מספר נייד שכבר קיים במערכת, מופיעה הודעה "נמצא ביקור קודם". לחיצה על "מלא פרטים" ממלאת את כל מה שידוע מהביקור הקודם.
"שמור והתחל חדשה" שומר ופותח טופס ריק, נוח כשיש ערימה של טפסים.

# סריקת טופס נייר
בטופס בקשה חדשה לוחצים "סרוק טופס נייר" ובוחרים תמונה של הטופס. המערכת קוראת את כתב היד וממלאת את השדות.
שדות שלא היו ברורים מסומנים בכתום עם הכיתוב "לבדיקה". תמונת הטופס מוצגת ליד הטופס, ואפשר להגדיל אותה בלחיצה.
חשוב: תמיד לעבור על השדות ולתקן לפני השמירה. כתובות מייל מתוקנות לפי הנפוץ (למשל ‎@gmail.com‎), אבל יש לוודא מול הדף.
הסריקה צריכה מפתח Gemini, שמכניסים פעם אחת בלשונית "ניהול" ← "סריקה אוטומטית".

# לשונית "סריקת דפים"
מקום מיוחד לסריקה. לוחצים על המסגרת הגדולה ובוחרים תמונה אחת או כמה תמונות ביחד (או גוררים אותן פנימה).
כל דף נקרא ונשמר אוטומטית כבקשה, עם תמונת הדף לידו. ברשימה שמתחת רואים את ההתקדמות, ולכל דף כפתור "פתח לבדיקה".
אם דף לא נקרא, אפשר ללחוץ "הקלד ידנית ליד התמונה" ולהקליד מול הדף.

# כרטיס אדם — כל החומר במקום אחד
בלשונית "אנשים" לוחצים על שם, ונפתח כרטיס עם הכל: פרטים אישיים, כל הביקורים והבקשות לפי תאריכים, כל השמות לתפילה, הנפטרים וימי הזיכרון הקרובים, התרומות (בסיסמת כספים) וכל הדפים הסרוקים שלו.
מכל בקשה אפשר להגיע לכרטיס בכפתור "כרטיס אדם מלא".
"בקשה חדשה לאדם זה" פותח טופס שכבר מולאו בו כל הפרטים, ונשאר רק לכתוב את הבקשה.

# מסמכים, וורד והדפסות
בלשונית "מסמכים והדפסות" בוחרים מסמך: טופס בקשה ריק, טופס ממולא, כרטיס אדם, קוויטלים (דף לכל בקשה), רשימת שמות, תור היום, דוח לתקופה, מדבקות כתובת, מכתב חופשי, מכתב תזכורת יום זיכרון, ובסיסמת כספים גם מכתב תודה, קבלה ואישור הוראת קבע.
המסמך מופיע כדף לבן. אפשר לכתוב ולשנות בו כל דבר, להדגיש ולהגדיל.
"הורד לוורד" שומר קובץ שנפתח ב־Word לעריכה נוספת. "הדפס" פותח מיד את חלון ההדפסה (שם אפשר גם לשמור כ־PDF).
כפתורי הדפסה ווורד יש גם בתוך כל בקשה, בכרטיס אדם, ברשימת השמות ובתור.
את נוסחי המכתבים עורכים בלשונית "ניהול".

# בקשות שמסומנות "לבדיקה"
בקשה שנסרקה או שפוענחה מכתב יד מסומנת בפס כתום ובתווית "לבדיקה". נכנסים לבקשה, לוחצים "עריכה", מתקנים ולוחצים "סמן כנבדק".

# תור קבלת קהל
בלשונית "תור היום" מופיעים כל מי שנקלטו היום לפי מספר. "הבא בתור" מסמן את הבא כמי שנכנס לאדמו״ר.

# מסך קוויטל
מציג בקשה אחת באותיות גדולות: השם לתפילה, הבקשה והנפטרים. מעבר בין בקשות בחצים. מתאים להראות לאדמו״ר או לגבאי שבפנים.

# רשימת שמות לתפילה
מרכזת את כל השמות לתפילה בקברי צדיקים ואת שמות הנפטרים לפי טווח תאריכים. כפתור "העתק" מעתיק את הרשימה, ויש גם הדפסה ווורד.

# כספים (סיסמה נוספת)
פרטי התרומות וסכומים מוסתרים מכל מי שאין לו סיסמת כספים. בלי הסיסמה רואים רק שיש תרומה, בלי סכום.
בלשונית "כספים" רואים תרומות, הוראות קבע, ומסמנים כל חודש אם הוראת הקבע נגבתה.
"קופה" מאפשרת לרשום הכנסות והוצאות של המשרד ולראות סיכום לפי חודשים.
לא רושמים במערכת מספרי כרטיס אשראי או חשבון בנק.

# ימי זיכרון וימי הולדת
המערכת מחשבת לפי הלוח העברי מי שיום הזיכרון או יום ההולדת שלו בשבועיים הקרובים.

# ניהול (סיסמת מנהל)
החלפת שלוש הסיסמאות, רשימת הגבאים, הפעלה וכיבוי של כל אפשרות במערכת, עריכת ההוראות האלה, עריכת נוסחי המכתבים, מפתח הסריקה, חיבור לשרת משותף, גיבוי ושחזור, והורדה לאקסל.

# איפה הנתונים נשמרים
בלי חיבור לשרת: הנתונים נשמרים רק במחשב שעליו עובדים. חובה להוריד קובץ גיבוי פעם בשבוע (ניהול ← "הורד קובץ גיבוי").
עם חיבור לשרת משותף (ניהול ← "חיבור לשרת משותף"): כל הגבאים עובדים על אותם נתונים מכל מחשב, וכל גבאי נכנס עם מייל וסיסמה משלו.

# אקסל וגיבוי
"הורד טבלה לאקסל" שומר קובץ שנפתח באקסל עם כל הבקשות. "הורד קובץ גיבוי" שומר את כל המערכת לקובץ אחד, ו"שחזור מקובץ גיבוי" מחזיר אותו.

# נעילה ומצב תצוגה
המערכת ננעלת לבד אחרי 20 דקות בלי פעילות (אפשר לכבות בניהול). הכפתור ◐ למעלה מחליף בין תצוגה בהירה לכהה.

# סיסמאות ראשוניות
כניסה: 1234 · כספים: 4321 · ניהול: 123456. יש להחליף אותן מיד בלשונית "ניהול". (במצב שרת הכניסה היא עם מייל וסיסמה של כל גבאי.)`;

const DEF_HELP_EN=`# Welcome to the reception system
The system replaces the paper form "Blessing request from the Biala Rebbe shlita". Everything on the form is recorded here, and you can search, arrange a queue and prepare the names for the Rebbe.

# Language
The buttons at the top switch between עברית and English. Hebrew is the default. Names, requests and printed letters stay exactly as they were written.

# Signing in
Type the login password and choose the gabbai's name. Every request that is received is recorded under the gabbai who entered it.

# Receiving a new request
Click "New request" and fill it in by the order of the form. Next to every date the Hebrew date appears.
A date of birth can be written in Hebrew (e.g. ד׳ חשוון תשי״ז) or Gregorian (e.g. 25/04/1956). Gregorian is converted to Hebrew automatically.
When you type a mobile number that already exists, a "Previous visit found" message appears. Clicking "Fill in missing details" fills in everything known from the previous visit.
"Save & start new" saves and opens an empty form, handy when there is a pile of forms.

# Scanning a paper form
In a new request click "Scan paper form" and choose an image of the form. The system reads the handwriting and fills in the fields.
Fields that were unclear are marked in orange with "To review". The form image is shown next to the form and can be enlarged by clicking.
Important: always go over the fields and fix them before saving. Email addresses are corrected to the common form (e.g. @gmail.com), but check against the page.
Scanning needs a Gemini key, entered once in "Management" → "Automatic scanning".

# The "Scan pages" tab
A dedicated place for scanning. Click the big frame and choose one image or several at once (or drag them in).
Each page is read and saved automatically as a request, with the page image next to it. The list below shows the progress, and each page has an "Open to review" button.
If a page could not be read, click "Type by hand next to the image" and type it while looking at the page.

# Person card — all the material in one place
In the "People" tab click a name to open a card with everything: personal details, all visits and requests by date, all names for prayer, the deceased and upcoming yahrzeits, donations (with the finance password) and all their scanned pages.
From any request you can reach the card with the "Full person card" button.
"New request for this person" opens a form with all details already filled in, so only the request needs to be written.

# Documents, Word and printing
In the "Documents & printing" tab choose a document: blank request form, filled form, person card, kvittels (a page per request), list of names, today's queue, report for a period, address labels, free letter, yahrzeit reminder letter, and with the finance password also a thank-you letter, receipt and standing order confirmation.
The document appears as a white page. You can write and change anything on it, make text bold and larger.
"Download to Word" saves a file that opens in Word for further editing. "Print" opens the print window right away (you can also save as PDF there).
Print and Word buttons also appear inside each request, in the person card, in the names list and in the queue.
The letter templates are edited in the "Management" tab.

# Requests marked "To review"
A request that was scanned or read from handwriting has an orange stripe and a "To review" label. Open the request, click "Edit", fix it and click "Save & mark as reviewed".

# Reception queue
The "Today's queue" tab shows everyone received today, by number. "Next in line" marks the next person as having gone in to the Rebbe.

# Kvittel screen
Shows one request in large letters: the name for prayer, the request and the deceased. Move between requests with the arrows. Suitable for showing to the Rebbe or to the gabbai inside.

# List of names for prayer
Gathers all names for prayer at the tzaddikim's graves and the names of the deceased by date range. "Copy" copies the list, and there is also Print and Word.

# Finances (extra password)
Donation details and amounts are hidden from anyone without the finance password. Without it you only see that there is a donation, without the amount.
The "Finances" tab shows donations and standing orders, and each month you mark whether the standing order was collected.
"Cash box" lets you record office income and expenses and see a monthly summary.
Never enter credit card or bank account numbers in the system.

# Yahrzeits and birthdays
The system calculates by the Hebrew calendar whose yahrzeit or birthday falls in the coming two weeks.

# Management (manager password)
Changing the three passwords, the list of gabbaim, turning each option on and off, editing these instructions, editing the letter templates, the scanning key, the shared server connection, backup and restore, and downloading to Excel.

# Where the data is saved
Without a server connection: the data is saved only on the computer you work on. Download a backup file every week (Management → "Download backup file").
With a shared server (Management → "Shared server connection"): all gabbaim work on the same data from any computer, and each gabbai signs in with their own email and password.

# Excel and backup
"Download table for Excel" saves a file that opens in Excel with all requests. "Download backup file" saves the whole system to one file, and "Restore from backup file" brings it back.

# Lock and display mode
The system locks itself after 20 minutes without activity (can be turned off in Management). The ◐ button at the top switches between light and dark display.

# Initial passwords
Login: 1234 · Finances: 4321 · Management: 123456. Change them right away in the "Management" tab. (In server mode, each gabbai signs in with their own email and password.)`;

/* ===== חיבור לשרת משותף (לא חובה) =====
   ריק = הנתונים נשמרים רק במחשב הזה.
   כדי שכל הגבאים יעבדו על אותם נתונים: מכניסים כאן את כתובת Supabase ואת המפתח הציבורי (anon public),
   או מכניסים אותם במסך "ניהול" ← "חיבור לשרת משותף". */
const SUPA_URL='';
const SUPA_KEY='';
const LKEY='biala_kk_';
const lget=(k,d)=>{try{const v=localStorage.getItem(LKEY+k);return v?JSON.parse(v):d}catch(e){return d}};
const lset=(k,v)=>{try{localStorage.setItem(LKEY+k,JSON.stringify(v))}catch(e){}};
const CONN=()=>({url:SUPA_URL||lget('supaUrl',''),key:SUPA_KEY||lget('supaKey','')});
/* אחסון במחשב: IndexedDB (מחזיק גם תמונות של דפים) */
const idb={db:null,open(){return new Promise((res,rej)=>{const r=indexedDB.open('biala_kabalat_kahal',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  get(k){return new Promise(res=>{try{const t=this.db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(undefined)}catch(e){res(undefined)}})},
  set(k,v){return new Promise(res=>{try{const t=this.db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>{toast('השמירה במחשב נכשלה');res(false)}}catch(e){toast('השמירה במחשב נכשלה');res(false)}})}};
let SB=null, MODE='local', DEFS=null;
let R=[], EXP=[], S=null;
const DEF_S=async()=>({pw:await hash('1234'),fin:await hash('4321'),adm:await hash('123456'),gabbaim:['גבאי ראשי'],features:Object.fromEntries(Object.keys(FEATURES).map(k=>[k,true])),help:DEF_HELP,geminiKey:'',geminiModel:'gemini-3.8-flash',templates:{}});
function withDefaults(o,d){return {...d,...o,features:{...d.features,...(o?.features||{})}}}
async function cloudPut(tbl,id,data){const {error}=await SB.from(tbl).upsert({id,data,updated_at:new Date().toISOString()});if(error){toast('השמירה בשרת נכשלה: '+error.message);return false}return true}
async function cloudDel(tbl,id){const {error}=await SB.from(tbl).delete().eq('id',id);if(error)toast('המחיקה בשרת נכשלה: '+error.message)}
async function putRec(o){o.updatedAt=Date.now();const i=R.findIndex(r=>r.id===o.id);if(i>=0)R[i]=o;else R.push(o);
  if(MODE==='cloud')await cloudPut('kk_records',o.id,o);else await idb.set('records',R)}
async function delRec(id){R=R.filter(r=>r.id!==id);if(MODE==='cloud')await cloudDel('kk_records',id);else await idb.set('records',R)}
async function putExp(o){const i=EXP.findIndex(r=>r.id===o.id);if(i>=0)EXP[i]=o;else EXP.push(o);if(MODE==='cloud')await cloudPut('kk_kupa',o.id,o);else await idb.set('kupa',EXP)}
async function delExp(id){EXP=EXP.filter(r=>r.id!==id);if(MODE==='cloud')await cloudDel('kk_kupa',id);else await idb.set('kupa',EXP)}
async function putS(){if(MODE==='cloud')await cloudPut('kk_settings','main',S);else await idb.set('settings',S)}
async function loadCloud(){
  const [a,b,c]=await Promise.all([SB.from('kk_records').select('id,data'),SB.from('kk_kupa').select('id,data'),SB.from('kk_settings').select('data').eq('id','main').maybeSingle()]);
  if(a.error)throw a.error;
  R=(a.data||[]).map(x=>({...x.data,id:x.id}));EXP=(b.data||[]).map(x=>({...x.data,id:x.id}));S=withDefaults(c.data?.data||null,DEFS)}
async function boot(){
  DEFS=await DEF_S();try{await idb.open()}catch(e){}
  const c=CONN();
  if(c.url&&c.key&&window.supabase){try{SB=supabase.createClient(c.url,c.key);MODE='cloud'}catch(e){SB=null}}
  if(MODE==='local'){S=withDefaults(await idb.get('settings'),DEFS);R=(await idb.get('records'))||[];EXP=(await idb.get('kupa'))||[]}
  else S=withDefaults(null,DEFS);
  $('#emailWrap').hidden=MODE!=='cloud';$('#gabbaiSel').hidden=MODE==='cloud';
  $('#pw').placeholder=T(MODE==='cloud'?'סיסמה':'סיסמת כניסה');
  fillGabbai();renderModebar();
  /* רענון אוטומטי כשעובדים כמה גבאים */
  if(MODE==='cloud'){setInterval(()=>{if(!document.hidden&&!$('#app').hidden&&view!=='new'&&view!=='edit')loadCloud().then(refresh).catch(()=>{})},45000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#app').hidden)loadCloud().then(refresh).catch(()=>{})});
    const {data}=await SB.auth.getSession();if(data?.session){ME=data.session.user.user_metadata?.name||data.session.user.email.split('@')[0];try{await loadCloud();return true}catch(e){}}}
  return false}
function renderModebar(){$('#modebar').innerHTML=MODE==='cloud'?'':`<div>הנתונים נשמרים רק במחשב הזה. כדי שכל הגבאים יעבדו על אותם נתונים, מחברים שרת משותף בלשונית "ניהול".</div>`}

function fillGabbai(){const sel=$('#gabbaiSel');if(!sel||!S)return;const cur=sel.value||ME;sel.innerHTML='<option value="">— מי נכנס? —</option>'+S.gabbaim.map(g=>`<option ${g===cur?'selected':''}>${esc(g)}</option>`).join('')}

/* קבצים: הורדה והדפסה */
function downloadBlob(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},3000)}
function printHTML(html){const f=document.createElement('iframe');f.style.cssText='position:fixed;width:0;height:0;border:0;left:-9999px';document.body.appendChild(f);
  const d=f.contentDocument;d.open();d.write(html);d.close();setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('ההדפסה לא נפתחה')}setTimeout(()=>f.remove(),3000)},600)}
const fileStamp=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

let view='home', current=null, filt={q:'',status:'',date:'',tag:'',rev:false};

(()=>{const t=lget('theme','');if(t)document.documentElement.dataset.theme=t})();
$$('.langsw [data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===LANG)));

$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.v==='logout')return logout();go(b.dataset.v)});
let pendingPre=null, curPerson=null;
const VIEWS={home:renderHome,list:renderList,new:()=>{const p=pendingPre;pendingPre=null;renderForm(null,p)},scan:renderScan,docs:renderDocs,person:renderPerson,edit:()=>renderForm(current),view:renderView,queue:renderQueue,kvittel:renderKvittel,names:renderNames,dates:renderDates,people:renderPeople,
  money:()=>FIN?renderMoney():gate('fin','כספים',renderMoney),kupa:()=>FIN?renderKupa():gate('fin','קופה',renderKupa),help:renderHelp,admin:()=>ADM?renderAdmin():gate('adm','ניהול',renderAdmin)};
function go(v,rec){if(!VIEWS[v])v='home';view=v;if(rec!==undefined)current=rec;renderTabs();VIEWS[v]();window.scrollTo(0,0)}
let dirty=false;
function refresh(){if($('#app').hidden)return;renderTabs();if(view==='new'||view==='edit'||$('#gf'))return;if(view==='view'&&current)current=R.find(r=>r.id===current.id)||null;
  if(view==='list'&&$('#rows')){fillRows();return}VIEWS[view]()}
const byId=id=>R.find(r=>r.id===id);
const fullName=x=>[x.first,x.last].filter(Boolean).join(' ')||x.prayName||'ללא שם';
function bindRows(sel){$$(sel+' tr[data-id]').forEach(tr=>tr.onclick=()=>go('view',byId(tr.dataset.id)))}
function donCell(x){const d=x.donation;if(!d||d.type==='none'||!d.type)return'<span class="muted">—</span>';return `<span class="pill tag">${DON[d.type]}</span>${FIN&&d.amount?` <span class="num">${money(d.amount)}</span>`:''}`}

function renderHome(){

  const yahr=S.features.yahr?upcomingYahr(14):[], bd=S.features.birthdays?upcomingBirthdays(14):[];
  const tagCount={};R.forEach(r=>(r.tags||[]).forEach(g=>tagCount[g]=(tagCount[g]||0)+1));
  const maxTag=Math.max(1,...Object.values(tagCount));
  $('#main').innerHTML=`<section>
  <div class="row"><h2>${hebOf(new Date())}</h2><span class="g num">${greg(t)}</span><span class="spacer"></span><button class="btn primary" id="hNew">+ בקשה חדשה</button></div>
  <div class="stats">
    <div class="stat link" data-go="list"><b>${R.length}</b><span>בקשות במערכת</span></div>
    <div class="stat link" data-go="queue"><b>${todays.length}</b><span>נקלטו היום</span></div>
    <div class="stat link" data-go="list" data-f="wait"><b>${R.filter(r=>r.status==='wait').length}</b><span>ממתינות לאדמו״ר</span></div>
    <div class="stat link ${rev.length?'alert':''}" data-go="list" data-f="rev"><b>${rev.length}</b><span>לבדיקה ותיקון</span></div>
    <div class="stat"><b>${new Set(R.map(personKey)).size}</b><span>אנשים שונים</span></div>
  </div>
  ${MODE==='local'&&R.length&&!lget('lastBackup','')?`<div class="notice" style="margin-bottom:14px"><b>עדיין לא הורד גיבוי.</b> הנתונים שמורים רק במחשב הזה. <button class="btn sm warn" id="hBk">לגיבוי</button></div>`:''}
  ${rev.length?`<div class="notice" style="margin-bottom:14px"><b>${rev.length} בקשות מחכות לבדיקה.</b> הן פוענחו מכתב יד, וחלק מהשדות לא היו ברורים. <button class="btn sm warn" id="hRev">לבדיקה</button></div>`:''}
  <div class="cols">
    <div class="card"><h3>ימי זיכרון בשבועיים הקרובים</h3>${yahr.length?`<table><tbody>${yahr.slice(0,8).map(y=>`<tr class="click" data-id="${y.by.id}"><td><b>${esc(y.name)}</b> <span class="g">${esc(y.rel)}</span></td><td class="num">${y.days===0?'היום':y.days===1?'מחר':'בעוד '+y.days+' ימים'}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">אין ימי זיכרון קרובים לפי הרשום.</p>'}</div>
    <div class="card"><h3>ימי הולדת עבריים קרובים</h3>${bd.length?`<table><tbody>${bd.slice(0,8).map(y=>`<tr class="click" data-id="${y.by.id}"><td><b>${esc(y.name)}</b></td><td class="num">${y.days===0?'היום':y.days===1?'מחר':'בעוד '+y.days+' ימים'}</td></tr>`).join('')}</tbody></table>`:'<p class="muted">אין ימי הולדת קרובים לפי הרשום.</p>'}</div>
    <div class="card"><h3>נושאי הבקשות</h3>${Object.keys(tagCount).length?`<div class="bars">${Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${k}</span><i style="width:${v/maxTag*100}%"></i><span class="num">${v}</span></div>`).join('')}</div>`:'<p class="muted">מסמנים נושא בכל בקשה (רפואה, פרנסה...) ואז רואים כאן סיכום.</p>'}</div>
  </div></section>`;
  $('#hNew').onclick=()=>go('new');if($('#hBk'))$('#hBk').onclick=()=>go('admin'); if($('#hRev'))$('#hRev').onclick=()=>{filt={q:'',status:'',date:'',tag:'',rev:true};go('list')};
  $$('.stat.link').forEach(s=>s.onclick=()=>{filt={q:'',status:'',date:'',tag:'',rev:false};if(s.dataset.f==='rev')filt.rev=true;else if(s.dataset.f)filt.status=s.dataset.f;go(s.dataset.go)});
  bindRows('#main');
}
function upcomingYahr(n){const out=[];R.forEach(x=>(x.deceased||[]).forEach(d=>{const dm=hebDayMonth(d.date);const k=daysUntil(dm,n);if(k>=0)out.push({...d,by:x,days:k})}));return out.sort((a,b)=>a.days-b.days)}
function upcomingBirthdays(n){const out=[];R.forEach(x=>{[[x.birth,fullName(x)],[x.spouseBirth,x.spouseName]].forEach(([b,nm])=>{if(!b||!nm)return;const k=daysUntil(hebDayMonth(b),n);if(k>=0)out.push({name:nm,by:x,days:k})})});return out.sort((a,b)=>a.days-b.days)}

/* ===== רשימה ===== */
function renderList(){
  $('#main').innerHTML=`<section>
  <div class="row"><h2>בקשות ברכה</h2><span class="spacer"></span><button class="btn primary" id="addBtn">+ בקשה חדשה</button></div>
  <div class="toolbar" style="margin-top:12px">
    <input type="search" id="q" placeholder="חיפוש: שם, טלפון, עיר, בקשה, שם נפטר" value="${esc(filt.q)}">
    <select id="fs"><option value="">כל הסטטוסים</option>${Object.entries(STATUS).map(([k,v])=>`<option value="${k}" ${filt.status===k?'selected':''}>${v}</option>`).join('')}</select>
    <select id="ft"><option value="">כל הנושאים</option>${TAGS.map(t=>`<option ${filt.tag===t?'selected':''}>${t}</option>`).join('')}</select>
    <input id="fd" type="date" value="${filt.date}" aria-label="תאריך">
    <label class="row small" style="gap:4px"><input type="checkbox" id="fr" ${filt.rev?'checked':''}> רק לבדיקה</label>
  </div>
  <div class="tablewrap"><table class="wide"><thead><tr><th>תאריך</th><th>שם</th><th>שם לתפילה</th><th>עיר</th><th>נייד</th><th>בקשה</th><th>תרומה</th><th>סטטוס</th></tr></thead><tbody id="rows"></tbody></table></div>
  <p class="muted small" id="cnt"></p></section>`;
  $('#addBtn').onclick=()=>go('new');
  $('#q').oninput=e=>{filt.q=e.target.value;fillRows()};$('#fs').onchange=e=>{filt.status=e.target.value;fillRows()};$('#ft').onchange=e=>{filt.tag=e.target.value;fillRows()};
  $('#fd').onchange=e=>{filt.date=e.target.value;fillRows()};$('#fr').onchange=e=>{filt.rev=e.target.checked;fillRows()};
  fillRows();
}
function fillRows(){const q=filt.q.trim();
  const list=R.filter(x=>(!filt.status||x.status===filt.status)&&(!filt.date||x.date===filt.date)&&(!filt.tag||(x.tags||[]).includes(filt.tag))&&(!filt.rev||x.review)&&
    (!q||[x.first,x.last,x.prayName,x.mobile,x.homePhone,x.city,x.request,x.email,x.spouseName,...(x.deceased||[]).map(d=>d.name)].join(' ').includes(q)||(digits(q).length>3&&(digits(x.mobile)+digits(x.homePhone)).includes(digits(q)))))
    .sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
  $('#rows').innerHTML=list.length?list.map(x=>`<tr class="click ${x.review?'rev':''}" data-id="${x.id}">
    <td>${dual(x.date)}</td>
    <td><b>${esc(fullName(x))}</b> ${x.review?'<span class="pill rev">לבדיקה</span>':''}</td>
    <td>${esc(x.prayName)}</td><td>${esc(x.city)}</td><td class="num"><span class="ltr">${esc(x.mobile||x.homePhone)}</span></td>
    <td>${esc((x.request||'').slice(0,36))}${(x.request||'').length>36?'…':''}${(x.tags||[]).map(t=>` <span class="pill tag">${t}</span>`).join('')}</td>
    <td>${donCell(x)}</td><td><span class="pill ${x.status}">${STATUS[x.status]||''}</span></td></tr>`).join('')
    :`<tr><td colspan="8" class="empty">${R.length?'לא נמצאו בקשות לפי החיפוש.':'עדיין אין בקשות. לחץ "בקשה חדשה" או "סרוק טופס נייר".'}</td></tr>`;
  $('#cnt').textContent=`מוצגות ${list.length} מתוך ${R.length} בקשות`;bindRows('#rows')}

/* ===== טופס ===== */
const FIELDS=[['first','שם'],['last','שם משפחה'],['birth','תאריך לידה'],['prayName','שם להתפלל בקברי צדיקים'],['spouseName','שם בן / בת הזוג'],['spouseBirth','תאריך לידה בן / בת הזוג'],['address','כתובת'],['city','עיר'],['zip','מיקוד'],['homePhone','טלפון בבית'],['mobile','נייד'],['work','מקום העבודה'],['workPhone','טלפון העבודה'],['email','כתובת מייל'],['marital','מצב משפחתי'],['children','מספר ילדים'],['request','בקשה אישית מהאדמו״ר']];
const FL=Object.fromEntries(FIELDS);

    ${F('first')}${F('last')}${F('birth','text','','עברי או לועזי, למשל 25/04/1956')}

  <fieldset><legend>בן / בת הזוג ומשפחה</legend><div class="grid">

  <fieldset><legend>כתובת וטלפונים</legend><div class="grid">

/* תיקון מייל לפי הנפוץ */
function fixEmail(e){e=String(e||'').trim().replace(/\s+/g,'');if(!e)return'';if(!e.includes('@')&&/gmail|gmial|gmai/i.test(e))e=e.replace(/(gmail|gmial|gmai)\.?(com|co)?$/i,'@gmail.com');
  return e.replace(/@(gmail|gmial|gmai|gamil|gnail|gmal)(\.c?o?m?)?$/i,'@gmail.com').replace(/@(walla|wala)(\.c?o?\.?i?l?)?$/i,'@walla.co.il').toLowerCase()}

/* ===== סריקת טופס ===== */
async function shrink(file,max=1600,q=.85){const img=await createImageBitmap(file);const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return {blob:await new Promise(r=>c.toBlob(r,'image/jpeg',q)),url:c.toDataURL('image/jpeg',Math.min(q,.6))}}
const SCAN_PROMPT=`זו תמונה של טופס נייר בעברית בשם "בקשת ברכה מכ״ק מרן האדמו״ר מביאלא שליט״א", מולא בכתב יד.
קרא את כתב היד והחזר JSON בלבד, בלי טקסט נוסף, במבנה:
{"date":"YYYY-MM-DD או ריק","hebDate":"תאריך עברי כפי שנכתב או ריק","first":"","last":"","birth":"כפי שנכתב","prayName":"","spouseName":"","spouseBirth":"כפי שנכתב","address":"","city":"","zip":"","homePhone":"","mobile":"","work":"","workPhone":"","email":"","marital":"","children":"","deceased":[{"name":"","rel":"","date":""}],"request":"","unsure":["שמות השדות שלא היו ברורים"]}
כללים: אל תמציא. שדה ריק בטופס = מחרוזת ריקה. אם קראת חלקית — כתוב את הניחוש הטוב ביותר והוסף את שם השדה ל-unsure. מייל: השלם לפי הנפוץ (רוב המיילים נגמרים ב-@gmail.com) והוסף email ל-unsure אם ניחשת. מספרי טלפון ישראליים בפורמט 05X-XXXXXXX. "מצב משפחתי" כמו "נשוי + 4" → marital "נשוי", children "4". כתב בשוליים ליד "בקשה אישית" — צרף ל-request. תאריך הבקשה בראש הדף: אם לועזי — המר ל-YYYY-MM-DD; אם עברי — השאר date ריק ומלא hebDate.`;
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
const hasKey=()=>!!(S.geminiKey);
async function aiReadImage(blob){
  if(!hasKey())throw {code:'no_key'};
  const model=(S.geminiModel||'gemini-3.8-flash').trim();
  const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':S.geminiKey.trim()},
    body:JSON.stringify({contents:[{parts:[{text:SCAN_PROMPT},{inline_data:{mime_type:'image/jpeg',data:await blobToB64(blob)}}]}],generationConfig:{response_mime_type:'application/json',temperature:0.1}})}).catch(()=>{throw {code:'net'}});
  if(r.status===429)throw {code:'rate_limited'};
  if(!r.ok){let m='';try{m=(await r.json()).error?.message||''}catch(e){}throw {code:r.status===400||r.status===403?'bad_key':'api',message:m}}
  const j=await r.json();const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').replace(/^\s*```(json)?/,'').replace(/```\s*$/,'').trim();
  try{return JSON.parse(t)}catch(e){throw {code:'parse'}}}
/* קורא תמונה אחת ומחזיר רשומה (לא שמורה) */
async function scanToRecord(file){
  if(!hasKey())throw {code:'no_key'};
  const {blob,url}=await shrink(file);let scanUrl='';try{scanUrl=(await shrink(file,1100,.6)).url}catch(e){scanUrl=url}
  const res=await aiReadImage(blob);
  const pre={date:res.date&&/^\d{4}-\d\d-\d\d$/.test(res.date)?res.date:todayISO(),deceased:(res.deceased||[]).filter(d=>d&&(d.name||d.date)),donation:{type:'none'},status:'wait',tags:[],
    unsure:Array.isArray(res.unsure)?res.unsure.filter(k=>FL[k]):[],review:true,_scanData:url,_scanUrl:scanUrl,notes:res.hebDate?`תאריך בדף: ${res.hebDate}`:''};
  FIELDS.forEach(([k])=>{if(res[k]!=null)pre[k]=String(res[k])});pre.email=fixEmail(pre.email);return pre}
const scanErr=e=>({no_key:'כדי לסרוק אוטומטית צריך להכניס פעם אחת מפתח Gemini בלשונית "ניהול".',bad_key:'מפתח ה־Gemini לא התקבל. בדוק אותו בלשונית "ניהול".',rate_limited:'יותר מדי סריקות ברצף. המתן דקה ונסה שוב.',net:'אין חיבור לאינטרנט, או שהשירות חסום בסינון.',parse:'הדף לא נקרא כראוי. נסה תמונה חדה יותר.'}[e?.code]||('הסריקה לא הצליחה. '+(e?.message||'נסה תמונה חדה ומוארת יותר.')));
async function scanForm(file){const msg=$('#scanMsg');
  msg.innerHTML='<div class="notice info" style="margin-top:10px"><span class="spin"></span> קורא את כתב היד... זה יכול לקחת עד דקה.</div>';
  try{const pre=await scanToRecord(file);renderForm(null,pre);$('#scanMsg').innerHTML=`<div class="notice" style="margin-top:10px">הטופס נקרא. ${pre.unsure.length?`${pre.unsure.length} שדות מסומנים בכתום לבדיקה.`:'בדוק את כל השדות מול הדף לפני השמירה.'}</div>`}
  catch(e){msg.innerHTML=`<div class="notice" style="margin-top:10px">${scanErr(e)} אפשר להקליד ידנית.</div>`}}

let scanJobs=[];
function renderScan(){
  $('#main').innerHTML=`<section><h2>סריקת דפים</h2>
  <p class="muted">מעלים תמונה של טופס "בקשת ברכה" — אחד או כמה ביחד. המערכת קוראת את כתב היד, שומרת כל דף כבקשה ומסמנת בכתום מה שצריך לבדוק. תמונת הדף נשמרת ליד הבקשה ובכרטיס האדם.</p>
  ${hasKey()?'':'<div class="notice" style="margin:10px 0">הסריקה האוטומטית עוד לא מחוברת: מכניסים פעם אחת מפתח Gemini בלשונית "ניהול". עד אז אפשר להעלות תמונות ולהקליד את הפרטים ידנית ליד התמונה.</div>'}
  <label class="drop" id="drop" for="multiScan"><b>לחץ כאן לבחירת תמונות</b><span>או גרור לכאן תמונות של הטפסים · אפשר לבחור כמה דפים ביחד</span></label>
  <input type="file" id="multiScan" accept="image/*" multiple hidden>
  <p class="small muted">טיפ: צלם כל דף לבד, מקרוב, באור טוב ובלי צל. דף ישר וחד נקרא הרבה יותר טוב.</p>
  <div class="queue" id="jobs"></div></section>`;
  const add=files=>{[...files].filter(f=>f.type.startsWith('image/')).forEach(f=>scanJobs.push({file:f,name:f.name,state:'wait'}));drawJobs();runJobs()};
  $('#multiScan').onchange=e=>add(e.target.files);
  const dz=$('#drop');['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over')}));dz.addEventListener('drop',e=>add(e.dataTransfer.files));
  drawJobs();
}
function drawJobs(){const box=$('#jobs');if(!box)return;
  box.innerHTML=scanJobs.slice().reverse().map((j,i)=>`<div class="qi ${j.state==='done'?'':''}"><span class="no">${scanJobs.length-i}</span>
    <div><b>${j.rec?esc(fullName(j.rec)):esc(j.name)}</b><div class="small ${j.state==='err'?'':'muted'}" style="${j.state==='err'?'color:var(--bad)':''}">${j.state==='wait'?'ממתין בתור':j.state==='run'?'<span class="spin"></span> קורא את כתב היד...':j.state==='done'?`נשמר. ${j.rec.unsure?.length?j.rec.unsure.length+' שדות לבדיקה':'לבדוק מול הדף'}`:esc(j.err)}</div></div>
    <div class="row">${j.state==='done'?`<button class="btn sm warn" data-open="${j.rec.id}">פתח לבדיקה</button>`:''}${j.state==='err'&&j.url?`<button class="btn sm" data-manual="${i}">הקלד ידנית ליד התמונה</button>`:''}</div></div>`).join('');
  $$('#jobs [data-open]').forEach(b=>b.onclick=()=>go('edit',byId(b.dataset.open)));
  $$('#jobs [data-manual]').forEach(b=>b.onclick=()=>{const j=scanJobs[scanJobs.length-1-b.dataset.manual];pendingPre={date:todayISO(),deceased:[],donation:{type:'none'},status:'wait',tags:[],review:true,unsure:[],_scanData:j.url,_scanUrl:j.scanUrl||j.url};go('new')})}
let jobsRunning=false;
async function runJobs(){if(jobsRunning)return;jobsRunning=true;
  for(const j of scanJobs){if(j.state!=='wait')continue;j.state='run';drawJobs();
    try{const pre=await scanToRecord(j.file);const o={...pre,id:newId(),createdAt:Date.now(),createdBy:ME+' (סריקה)',scanUrl:pre._scanUrl||pre._scanData};delete o._scanData;delete o._scanUrl;
      if(o.date===todayISO())o.queueNo=Math.max(0,...R.filter(r=>r.date===o.date).map(r=>r.queueNo||0))+1;
      await putRec(o);j.rec=o;j.state='done'}
    catch(e){j.state='err';j.err=scanErr(e);try{const s=await shrink(j.file,1100,.6);j.url=j.scanUrl=s.url}catch(_){}}
    drawJobs()}
  jobsRunning=false;renderTabs()}

const DOCTYPES=[['blank','טופס בקשה ריק להדפסה','none'],['request','טופס בקשה ממולא','rec'],['person','כרטיס אדם מלא','person'],['kvittel','קוויטלים להדפסה (דף לכל בקשה)','range'],['names','רשימת שמות לתפילה','range'],['queue','תור היום','day'],['report','דוח בקשות לתקופה','range'],

  ${Object.keys(byM).length?`<div class="card" style="margin-top:14px"><h3>לפי חודשים</h3><div class="bars">${Object.entries(byM).sort().reverse().slice(0,8).map(([k,v])=>`<div class="bar"><span class="num">${k?HEB_GREG_M[+k.slice(5)-1]+' '+k.slice(0,4):''}</span><span style="display:grid;gap:2px"><i style="width:${v.in/mx*100}%"></i><i class="out" style="width:${v.out/mx*100}%"></i></span><span class="num small">${money(v.in)||'₪0'} / ${money(v.out)||'₪0'}</span></div>`).join('')}</div><p class="small muted">זהב = הכנסות, אדום = הוצאות</p></div>`:''}
  <div class="tablewrap" style="margin-top:14px"><table class="wide"><thead><tr><th>תאריך</th><th>סוג</th><th>תיאור</th><th>סכום</th><th>נרשם ע״י</th><th></th></tr></thead><tbody>
  ${list.map(e=>`<tr><td>${dual(e.date)}</td><td>${e.kind==='in'?'הכנסה':'הוצאה'}</td><td>${esc(e.desc)}</td><td class="num" style="color:${e.kind==='in'?'var(--ok)':'var(--bad)'}">${money(e.amount)}</td><td>${esc(e.by)}</td><td><button class="btn sm danger" data-x="${e.id}">מחק</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">אין רישומים עדיין</td></tr>'}
  </tbody></table></div></section>`;
  $('#kf').onsubmit=async e=>{e.preventDefault();await putExp({id:newId(),kind:$('#kk').value,date:$('#kd').value,amount:Number($('#ka').value),desc:$('#kt').value.trim(),by:ME});toast('נרשם');renderKupa()};
  $$('[data-x]').forEach(b=>b.onclick=async()=>{await delExp(b.dataset.x);renderKupa()});
}

/* ===== הוראות ===== */
function helpHTML(t){return t.split('\n').map(l=>l.startsWith('# ')?`<h3>${esc(l.slice(2))}</h3>`:l.trim()?`<p>${esc(l)}</p>`:'').join('')}
function renderHelp(){const en=LANG==='en'&&(!S.help||S.help===DEF_HELP);$('#main').innerHTML=`<section><div class="help" ${en?'data-noi18n':''}>${helpHTML(en?DEF_HELP_EN:(S.help||DEF_HELP))}</div><p class="muted small">את ההוראות אפשר לערוך בלשונית "ניהול".</p></section>`}

/* ===== ניהול ===== */
function renderAdmin(){
  $('#main').innerHTML=`<section class="form"><div class="row"><h2>ניהול</h2><span class="spacer"></span><button class="btn sm" id="lockAdm">נעל ניהול</button></div>
  <fieldset><legend>סיסמאות</legend>${MODE==='cloud'?'<p class="muted small" style="margin-top:0">במצב שרת, הכניסה למערכת היא עם המייל והסיסמה של כל גבאי. כאן מחליפים את סיסמאות הכספים והניהול.</p>':''}<div class="grid">
    <label class="f">איזו סיסמה<select id="pk"><option value="pw">כניסה למערכת</option><option value="fin">כספים</option><option value="adm">ניהול</option></select></label>
    <label class="f">סיסמה חדשה<input id="p1" type="password"></label><label class="f">שוב סיסמה חדשה<input id="p2" type="password"></label>
  </div><div class="row" style="margin-top:10px"><button class="btn primary" id="pwBtn">החלף סיסמה</button></div></fieldset>
  <fieldset><legend>גבאים</legend><p class="muted small" style="margin-top:0">שם בכל שורה. השמות מופיעים בבחירה במסך הכניסה.</p>
    <label class="f"><textarea id="gb">${esc(S.gabbaim.join('\n'))}</textarea></label><div class="row" style="margin-top:8px"><button class="btn primary" id="gbBtn">שמור גבאים</button></div></fieldset>
  <fieldset><legend>אפשרויות במערכת</legend><p class="muted small" style="margin-top:0">כיבוי אפשרות מסתיר אותה מכל הגבאים. הנתונים לא נמחקים.</p>
    <div class="grid">${Object.entries(FEATURES).map(([k,v])=>`<label class="row" style="gap:8px"><input type="checkbox" data-ft="${k}" ${S.features[k]?'checked':''}> ${v}</label>`).join('')}</div></fieldset>
  <fieldset><legend>עריכת ההוראות</legend><p class="muted small" style="margin-top:0">שורה שמתחילה ב־"# " היא כותרת.</p>
    <label class="f"><textarea id="hl" style="min-height:260px">${esc(S.help||DEF_HELP)}</textarea></label>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="hlBtn">שמור הוראות</button><button class="btn" id="hlReset">החזר להוראות המקוריות</button></div></fieldset>
  <fieldset><legend>נוסחי מכתבים</legend><p class="muted small" style="margin-top:0">מילים בסוגריים מסולסלים מתמלאות לבד: {שם} {כתובת} {עיר} {תאריך} {סכום} {אופן} {קבלה} {חודשים} {שם_לתפילה} {נפטר} {יום_זיכרון}</p>
    <div class="grid">${[['thanks','מכתב תודה לתורם'],['receipt','קבלה על תרומה'],['standing','אישור הוראת קבע'],['letter','מכתב חופשי'],['yahr','תזכורת יום זיכרון']].map(([k,n])=>`<label class="f">${n}<textarea data-tpl="${k}" style="min-height:180px">${esc((S.templates||{})[k]||DEF_TPL[k])}</textarea></label>`).join('')}</div>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="tplBtn">שמור נוסחים</button></div></fieldset>
  <fieldset><legend>סריקה אוטומטית (Gemini)</legend>
    <p class="muted small" style="margin-top:0">הסריקה קוראת את כתב היד בעזרת Gemini של גוגל. צריך מפתח פעם אחת: נכנסים ל־aistudio.google.com/apikey, לוחצים "Create API key" ומעתיקים לכאן. ${MODE==='cloud'?'המפתח נשמר בשרת ומשמש את כל הגבאים.':'המפתח נשמר במחשב הזה.'}</p>
    <div class="grid"><label class="f">מפתח Gemini<input id="gk" type="password" dir="ltr" value="${esc(S.geminiKey)}" autocomplete="off"></label>
    <label class="f">דגם<input id="gm" dir="ltr" value="${esc(S.geminiModel||'gemini-3.8-flash')}"></label></div>
    <p class="small" style="color:var(--warn)">שים לב: בחשבון גוגל חינמי, גוגל רשאית להשתמש בתוכן שנשלח אליה לשיפור השירות. בגלל שבטפסים יש פרטים אישיים, עדיף מפתח מחשבון בתשלום (כמו שעשית בביאלה).</p>
    <div class="row"><button class="btn primary" id="gkBtn">שמור מפתח</button><button class="btn" id="gkTest">בדוק חיבור</button><span id="gkMsg" class="small"></span></div></fieldset>
  <fieldset><legend>חיבור לשרת משותף (Supabase)</legend>
    <p class="muted small" style="margin-top:0">${MODE==='cloud'?'<b style="color:var(--ok)">המערכת מחוברת לשרת.</b> כל הגבאים רואים את אותם נתונים, וכל גבאי נכנס עם מייל וסיסמה משלו.':'כרגע הנתונים במחשב הזה בלבד. כדי שכמה גבאים יעבדו ביחד מכל מחשב: יוצרים פרויקט ב־Supabase, מריצים את קוד ההקמה למטה, ומכניסים כאן את הכתובת והמפתח.'}</p>
    <div class="grid"><label class="f">כתובת הפרויקט (Project URL)<input id="su" dir="ltr" placeholder="https://xxxx.supabase.co" value="${esc(CONN().url)}"></label>
    <label class="f">מפתח ציבורי (anon public)<input id="sk" dir="ltr" value="${esc(CONN().key)}" autocomplete="off"></label></div>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="suBtn">שמור והתחבר</button>${MODE==='cloud'?'<button class="btn" id="suUp">העלה לשרת את הנתונים שבמחשב הזה</button><button class="btn danger" id="suOff">נתק מהשרת במחשב הזה</button>':''}<button class="btn" id="sqlBtn">העתק קוד הקמה</button></div>
    <details style="margin-top:10px"><summary class="small">איך מוסיפים גבאי בשרת?</summary><p class="small">ב־Supabase: Authentication ← Users ← Add user ← Create new user. מכניסים מייל וסיסמה לגבאי ומסמנים Auto Confirm. אחר כך הוא נכנס למערכת עם המייל והסיסמה האלה. כדי לחסום גבאי — מוחקים אותו משם.</p></details>
    <textarea class="code" id="sqlBox" hidden></textarea></fieldset>
  <fieldset><legend>גיבוי, שחזור ואקסל</legend>
    <p class="muted small" style="margin-top:0">${MODE==='cloud'?'הנתונים שמורים בשרת. בכל זאת מומלץ להוריד קובץ גיבוי פעם בשבוע.':'הנתונים במחשב הזה בלבד. חובה להוריד קובץ גיבוי פעם בשבוע ולשמור אותו בדיסק נוסף או במייל של החברה.'} ${lget('lastBackup','')?'גיבוי אחרון מהמחשב הזה: '+esc(lget('lastBackup','')):'עדיין לא הורד גיבוי מהמחשב הזה.'}</p>
    <div class="row"><button class="btn gold" id="dlBk">הורד קובץ גיבוי</button><button class="btn" id="dlCsv">הורד טבלה לאקסל</button><button class="btn" id="copyCsv">העתק טבלה לאקסל</button></div>
    <label class="f" style="margin-top:12px">שחזור מקובץ גיבוי<input type="file" id="bkFile" accept=".json,application/json"></label>
    <label class="f" style="margin-top:8px">או הדבק כאן טקסט של גיבוי<textarea class="code" id="bk"></textarea></label>
    <div class="row" style="margin-top:8px"><button class="btn" id="restore">שחזר מהטקסט (מוסיף ומעדכן, לא מוחק)</button></div></fieldset>
  </section>`;
  $('#lockAdm').onclick=()=>{ADM=false;ss.del('biala_adm');go('home')};
  $('#pwBtn').onclick=async()=>{if($('#p1').value.length<4)return toast('לפחות 4 תווים');if($('#p1').value!==$('#p2').value)return toast('הסיסמאות לא זהות');S[$('#pk').value]=await hash($('#p1').value);await putS();toast('הסיסמה הוחלפה');$('#p1').value=$('#p2').value=''};
  $('#gbBtn').onclick=async()=>{S.gabbaim=$('#gb').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!S.gabbaim.length)S.gabbaim=['גבאי'];await putS();fillGabbai();toast('הגבאים נשמרו')};
  $$('[data-ft]').forEach(c=>c.onchange=async()=>{S.features={...S.features,[c.dataset.ft]:c.checked};await putS();renderTabs();toast('עודכן')});
  $('#tplBtn').onclick=async()=>{S.templates={...(S.templates||{})};$$('[data-tpl]').forEach(t=>S.templates[t.dataset.tpl]=t.value);await putS();toast('הנוסחים נשמרו')};
  $('#hlBtn').onclick=async()=>{S.help=$('#hl').value;await putS();toast('ההוראות נשמרו')};$('#hlReset').onclick=()=>{$('#hl').value=DEF_HELP};
  const SQL=`-- מערכת קבלת קהל ביאלה — קוד הקמה ל-Supabase (SQL Editor ← New query ← Run)
create table if not exists kk_records (id text primary key, data jsonb not null, updated_at timestamptz default now());
create table if not exists kk_kupa (id text primary key, data jsonb not null, updated_at timestamptz default now());
create table if not exists kk_settings (id text primary key, data jsonb not null, updated_at timestamptz default now());
alter table kk_records enable row level security;
alter table kk_kupa enable row level security;
alter table kk_settings enable row level security;
-- רק גבאים מחוברים (משתמשים שהוספת ב-Authentication) יכולים לקרוא ולכתוב. מי שאין לו משתמש לא רואה כלום.
create policy "kk_records_auth" on kk_records for all to authenticated using (true) with check (true);
create policy "kk_kupa_auth" on kk_kupa for all to authenticated using (true) with check (true);
create policy "kk_settings_auth" on kk_settings for all to authenticated using (true) with check (true);`;
  $('#sqlBtn').onclick=()=>{$('#sqlBox').hidden=false;$('#sqlBox').value=SQL;copy(SQL,'קוד ההקמה הועתק. הדבק אותו ב־Supabase ← SQL Editor')};
  $('#gkBtn').onclick=async()=>{S.geminiKey=$('#gk').value.trim();S.geminiModel=$('#gm').value.trim()||'gemini-3.8-flash';await putS();toast('המפתח נשמר')};
  $('#gkTest').onclick=async()=>{const m=$('#gkMsg');m.textContent='בודק...';S.geminiKey=$('#gk').value.trim();S.geminiModel=$('#gm').value.trim()||'gemini-3.8-flash';
    try{const c=document.createElement('canvas');c.width=c.height=40;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,40,40);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.8));await aiReadImage(b);m.style.color='var(--ok)';m.textContent='החיבור תקין ✓'}
    catch(e){m.style.color='var(--bad)';m.textContent=e.code==='parse'?'החיבור תקין ✓':scanErr(e);if(e.code==='parse')m.style.color='var(--ok)'}};
  $('#suBtn').onclick=()=>{const u=$('#su').value.trim().replace(/\/+$/,''),k=$('#sk').value.trim();if(u&&!/^https:\/\/.+/.test(u))return toast('הכתובת צריכה להתחיל ב־https://');
    lset('supaUrl',u);lset('supaKey',k);toast(u?'נשמר. המערכת נטענת מחדש':'החיבור נמחק');setTimeout(()=>location.reload(),900)};
  if($('#suOff'))$('#suOff').onclick=()=>{lset('supaUrl','');lset('supaKey','');location.reload()};
  if($('#suUp'))$('#suUp').onclick=async()=>{const lr=(await idb.get('records'))||[],lk=(await idb.get('kupa'))||[];if(!lr.length&&!lk.length)return toast('אין נתונים שמורים במחשב הזה');
    for(const r of lr)await putRec(r);for(const k of lk)await putExp(k);toast(`הועלו ${lr.length} בקשות לשרת`)};
  const backupObj=()=>({system:'biala-kabalat-kahal',version:4,date:new Date().toISOString(),records:R,kupa:EXP,settings:{...S,pw:undefined,fin:undefined,adm:undefined,geminiKey:undefined}});
  $('#dlBk').onclick=()=>{downloadBlob(`גיבוי-קבלת-קהל-${fileStamp()}.json`,new Blob([JSON.stringify(backupObj())],{type:'application/json'}));lset('lastBackup',hebOf(new Date())+' ('+greg(todayISO())+')');toast('קובץ הגיבוי ירד לתיקיית ההורדות')};
  const csvRows=()=>{const cols=[['date','תאריך'],...FIELDS];return [[...cols.map(c=>c[1]),'תאריך עברי','סטטוס','נושאים','נפטרים','תרומה',FIN?'סכום':''],...R.map(x=>[...cols.map(c=>x[c[0]]??''),heb(x.date),STATUS[x.status],(x.tags||[]).join(', '),(x.deceased||[]).map(d=>d.name+(d.date?' ('+d.date+')':'')).join('; '),DON[x.donation?.type||'none'],FIN?(x.donation?.amount||''):''])]};
  $('#dlCsv').onclick=()=>{const csv=csvRows().map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""').replace(/\n/g,' ')+'"').join(',')).join('\r\n');downloadBlob(`בקשות-ברכה-${fileStamp()}.csv`,new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));toast('הטבלה ירדה. פתח אותה באקסל')};
  $('#copyCsv').onclick=()=>copy(csvRows().map(r=>r.map(v=>String(v).replace(/[\t\n]/g,' ')).join('\t')).join('\n'),'הטבלה הועתקה, הדבק באקסל');
  const doRestore=async o=>{if(!o||!Array.isArray(o.records))throw 0;for(const r of o.records)await putRec(r);for(const e of (o.kupa||[]))await putExp(e);
    if(o.settings){const keep={pw:S.pw,fin:S.fin,adm:S.adm,geminiKey:S.geminiKey};S=withDefaults({...o.settings,...keep},DEFS);await putS()}toast(`שוחזרו ${o.records.length} בקשות`);go('list')};
  $('#bkFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await doRestore(JSON.parse(await f.text()))}catch(x){toast('הקובץ אינו קובץ גיבוי תקין')}};
  $('#restore').onclick=async()=>{try{await doRestore(JSON.parse($('#bk').value))}catch(e){toast('הטקסט שהודבק אינו גיבוי תקין')}};
}

boot().then(ok=>{if(ok||(MODE==='local'&&ss.get('biala_in')==='1'))enter()});
</script>
